<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAP 분석 (로컬 연결)</title>
<style>
:root {
  --bg:#f6f7f6; --surface:#fff; --sunken:#eceeed; --line:#d6dad8;
  --fg:#16211f; --muted:#5c6a67; --accent:#15605b; --warn:#8a5a12; --ok:#1b7a4b;
  --b:"IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif;
  --m:ui-monospace,Consolas,monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#111816; --surface:#18211f; --sunken:#141c1a; --line:#2b3835;
          --fg:#e6ece9; --muted:#94a49f; --accent:#57b3aa; --warn:#d6a95f; --ok:#4fb97e;
          color-scheme: dark; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--b);line-height:1.6}
.wrap{max-width:960px;margin:0 auto;padding:22px 16px 40px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:19px;margin:0;font-weight:600}
h1 small{display:block;font-size:11.5px;color:var(--muted);font-weight:400;font-family:var(--m);margin-top:2px}
.tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
select,button,input{font-family:var(--b);font-size:13px;color:var(--fg);background:var(--sunken);
  border:1px solid var(--line);border-radius:6px;padding:7px 10px}
button{cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button:disabled{opacity:.5;cursor:default}
a.btn{display:inline-block;font-size:13px;text-decoration:none;color:var(--fg);background:var(--sunken);
  border:1px solid var(--line);border-radius:6px;padding:7px 10px}
input#worker{font-family:var(--m);font-size:12px;width:190px}
input#who{font-family:var(--m);font-size:12px;width:160px}
.msg.fact{border-color:var(--accent);background:transparent}
.msg.fact .who{color:var(--accent)}
.msg.fact .body{font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:12.5px}
.bar .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.bar .dot.on{background:var(--ok)} .bar .dot.off{background:var(--warn)}
.bar span.k{color:var(--muted);font-family:var(--m);font-size:11.5px}
#log{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;min-height:110px}
.msg{border:1px solid var(--line);border-radius:10px;padding:12px 15px;background:var(--surface)}
.msg.me{background:var(--sunken)}
.who{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:5px}
.body{white-space:pre-wrap;word-break:break-word}
.meta{margin-top:9px;padding-top:8px;border-top:1px solid var(--line);font-family:var(--m);
  font-size:11px;color:var(--muted);display:flex;flex-wrap:wrap;gap:12px}
.msg.err{border-color:var(--warn)} .msg.err .who{color:var(--warn)}
.msg.err .body{font-family:var(--m);font-size:12px}
.msg.tool{border-style:dashed;background:transparent}
.msg.tool .who{color:var(--accent)}
.msg.tool .body{font-family:var(--m);font-size:11.5px;max-height:260px;overflow:auto}
.empty{color:var(--muted);font-size:13.5px;text-align:center;padding:30px 0}
form{display:flex;gap:9px;align-items:flex-end}
textarea{flex:1;min-width:0;font-family:var(--b);font-size:14.5px;color:var(--fg);background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:11px 13px;resize:vertical;min-height:62px;line-height:1.5}
textarea:focus-visible,select:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.hint{font-size:11.5px;color:var(--muted);margin-top:8px;font-family:var(--m)}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>SAP 분석 (로컬 연결)<small>AI 는 클라우드 · SAP 조회는 이 PC 의 워커</small></h1>
    <div class="tools">
      <select id="model" title="모델">
        <option value="openai/gpt-6-luna">gpt-6-luna · 저가</option>
        <option value="openai/gpt-6-sol">gpt-6-sol · 중간</option>
        <option value="openai/gpt-6-astra">gpt-6-astra · 고가</option>
        <option value="anthropic/claude-sonnet-5.5">claude-sonnet-5.5</option>
        <option value="anthropic/claude-opus-5">claude-opus-5</option>
      </select>
      <button id="reset" type="button">새 분석</button>
      <a class="btn" href="../sap-facts/" target="_blank" rel="noopener">지식 정리</a>
    </div>
  </header>

  <div class="bar">
    <span class="dot" id="dot"></span>
    <span id="wstat">워커 확인 중…</span>
    <input id="worker" value="http://127.0.0.1:8777" spellcheck="false">
    <button id="recheck" type="button">다시 확인</button>
    <input id="who" placeholder="내 이름/이메일" spellcheck="false" title="정리된 지식에 작성자로 남습니다">
    <select id="api" title="어느 서버를 부를지">
      <option value="aws">서버: AWS</option>
      <option value="local">서버: 로컬</option>
    </select>
    <span class="k" id="fstat"></span>
    <span class="k" id="totals"></span>
  </div>

  <div id="log"><p class="empty">워커를 켠 뒤 질문하면, AI 가 SAP 을 조회해가며 분석합니다.</p></div>

  <form id="f">
    <textarea id="q" placeholder="예) ZSDNR0012 에서 거래처 필터가 안 먹는 이유를 찾아줘&#10;예) ZSDNT0110 에 8월 데이터가 없는지 확인하고 원인을 추정해줘"></textarea>
    <button class="primary" id="send" type="submit">분석</button>
    <button id="stop" type="button" hidden>중단</button>
  </form>
  <p class="hint">Ctrl+Enter 전송 · 도구는 워커가 알려주는 대로 전부 사용 · 반복 제한 없음(멈추려면 중단) · 끝나면 알게 된 사실만 서버에 쌓임</p>

</div>

<script>
/* 서버 두 곳. 같은 코드(lambda/sap.js)가 양쪽에서 돌고 같은 DynamoDB 를 본다.
   AWS  — 배포본. 모델 호출이 되므로 분석은 여기여야 한다.
   로컬 — 이 PC 의 node server.js. 고친 코드를 배포 없이 바로 확인할 때 쓴다.
          HERMES_URL/PROXY_TOKEN 을 로컬에 넣어두면 분석까지 전부 로컬에서 돈다. */
var AWS_API = 'https://erilyjnp21.execute-api.ap-southeast-2.amazonaws.com';
var API = AWS_API;
/* 반복 횟수로 분석을 끊지 않는다. 몇 번에 끝날지는 질문이 정하는 것이지
   우리가 정할 일이 아니다. 대신 사람이 언제든 "중단" 을 누를 수 있게 했다.
   아래 숫자는 제한이 아니라 무한루프 안전장치다(버그로 같은 호출을 반복할 때). */
var SAFETY_STEPS = 1000;
var stopped = false;

var SYSTEM = [
  '당신은 SAP ERP 운영 문의를 분석하는 어시스턴트입니다.',
  '도구로 개발서버의 ABAP 소스와 운영서버의 테이블 데이터를 직접 조회할 수 있습니다.',
  '이름만 알고 무엇인지 모르면 search_object 로 먼저 타입·패키지를 확인하세요.',
  '추측하지 말고 필요한 것을 조회해서 근거를 확보한 뒤 답하세요.',
  '조회 결과는 요약본이라 원문 전체가 아닙니다. 더 좁은 조건이 필요하면 다시 조회하세요.',
  '최종 답변에는 판단 근거(테이블·필드·프로그램 위치)를 반드시 적으세요.',
  '한국어로 간결하게 답하세요.'
].join(' ');

var log = document.getElementById('log');
var q = document.getElementById('q');
var send = document.getElementById('send');
var stopBtn = document.getElementById('stop');
var modelSel = document.getElementById('model');
var workerInput = document.getElementById('worker');
var dot = document.getElementById('dot');
var wstat = document.getElementById('wstat');
var totalsEl = document.getElementById('totals');
var whoInput = document.getElementById('who');
var fstat = document.getElementById('fstat');
var apiSel = document.getElementById('api');

try {
  var saved = localStorage.getItem('sapWorkerUrl');
  if (saved) workerInput.value = saved;
  var savedWho = localStorage.getItem('sapUserKey');
  if (savedWho) whoInput.value = savedWho;
  var savedApi = localStorage.getItem('sapApi');
  if (savedApi) apiSel.value = savedApi;
} catch (e) {}

function applyApi() {
  API = apiSel.value === 'local' ? location.origin : AWS_API;
  try { localStorage.setItem('sapApi', apiSel.value); } catch (e) {}
}
applyApi();
apiSel.addEventListener('change', function () { applyApi(); loadFacts(); });

var messages = [{ role: 'system', content: SYSTEM }];
var toolSpecs = [];
var knownFacts = '';     // 서버에 쌓인 사실 — 시스템 프롬프트에 실어 보낸다
var totals = { calls: 0, inTok: 0, outTok: 0, cost: 0, ms: 0, tools: 0 };

function workerUrl() { return workerInput.value.trim().replace(/\/+$/, ''); }

/** 서버가 받는 형식(영숫자·._@-, 3~64자)으로 맞춘다. 비었으면 익명으로 남긴다. */
function userKey() {
  var v = whoInput.value.trim().replace(/\s+/g, '-');
  try { localStorage.setItem('sapUserKey', whoInput.value.trim()); } catch (e) {}
  return /^[A-Za-z0-9._@-]{3,64}$/.test(v) ? v : 'local-test';
}

function systemPrompt() {
  return knownFacts ? SYSTEM + '\n\n' + knownFacts : SYSTEM;
}

function add(who, text, cls, meta) {
  var e = log.querySelector('.empty');
  if (e) e.remove();
  var d = document.createElement('div');
  d.className = 'msg ' + (cls || '');
  d.innerHTML = '<div class="who"></div><div class="body"></div>';
  d.querySelector('.who').textContent = who;
  d.querySelector('.body').textContent = text;
  if (meta) {
    var m = document.createElement('div');
    m.className = 'meta';
    meta.filter(Boolean).forEach(function (t) {
      var s = document.createElement('span'); s.textContent = t; m.appendChild(s);
    });
    d.appendChild(m);
  }
  log.appendChild(d);
  d.scrollIntoView({ block: 'end', behavior: 'smooth' });
  return d;
}

function showTotals() {
  totalsEl.textContent = '누적 ' + totals.calls + '회 호출 · 도구 ' + totals.tools + '회 · 입력 '
    + totals.inTok.toLocaleString() + ' · 출력 ' + totals.outTok.toLocaleString()
    + ' · ' + (totals.ms / 1000).toFixed(1) + '초 · 약 ' + Math.round(totals.cost * 1450) + '원';
}

/* ── 워커 연결 확인 ─────────────────────────────── */
function checkWorker() {
  dot.className = 'dot';
  wstat.textContent = '워커 확인 중…';
  try { localStorage.setItem('sapWorkerUrl', workerInput.value.trim()); } catch (e) {}
  return fetch(workerUrl() + '/tools')
    .then(function (r) { return r.json(); })
    .then(function (d) {
      toolSpecs = d.tools || [];
      dot.className = 'dot on';
      wstat.textContent = '워커 연결됨 · 도구 ' + toolSpecs.length + '개';
    })
    .catch(function () {
      toolSpecs = [];
      dot.className = 'dot off';
      wstat.textContent = '워커 없음 — PC 에서 python sap_worker.py 를 실행하세요';
    });
}
checkWorker();
document.getElementById('recheck').addEventListener('click', checkWorker);

/* ── 지식 저장소 (AWS DynamoDB) ─────────────────
   분석할 때마다 처음부터 다시 알아내지 않도록, 지금까지 정리된 사실을
   프롬프트에 싣고 끝나면 새로 알게 된 것만 뽑아 되돌려 보낸다.
   SAP 조회만 이 PC 에서 돌고, 지식은 모두가 보는 서버에 쌓인다. */
function loadFacts() {
  return fetch(API + '/sap/facts?userKey=' + encodeURIComponent(userKey()))
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var usable = (d.facts || []).filter(function (f) { return f.status !== 'rejected'; });
      if (!usable.length) {
        knownFacts = '';
        fstat.textContent = '지식 없음';
      } else {
        knownFacts = [
          '다음은 지금까지 이 시스템을 분석해 정리해 둔 사실입니다.',
          '(검수중) 은 아직 사람이 확인하지 않았으니 그대로 믿지 말고 조회로 확인하세요.',
          '',
        ].concat(usable.map(function (f) {
          return '- [' + f.subject + '] ' + f.body + (f.status === 'confirmed' ? '' : ' (검수중)');
        })).join('\n');
        fstat.textContent = '지식 ' + usable.length + '건 적용';
      }
      messages[0] = { role: 'system', content: systemPrompt() };
    })
    .catch(function () { knownFacts = ''; fstat.textContent = '지식 불러오기 실패'; });
}
loadFacts();

/* 추출에는 대화 전부를 보내지 않는다.
   도구 결과를 안 자르기로 한 뒤로 messages 가 수 MB 가 된다. 그대로 올리면
   API Gateway 가 Lambda 에 닿기 전에 끊고(10MB·29초), 그 응답에는 CORS 헤더가
   없어서 브라우저엔 "Failed to fetch" 로만 보인다 — 원인을 알 수 없는 실패다.
   사실은 조회 원문이 아니라 결론에 있으므로, 조회 결과는 앞부분만 보낸다. */
var EXTRACT_LIMIT = 300000;   // 보낼 전체 길이(자)
var TOOL_KEEP     = 1200;     // 조회 결과 하나당 보낼 길이(자)

function compactForExtract() {
  var out = [];
  for (var i = 0; i < messages.length; i++) {
    var m = messages[i];
    if (!m || m.role === 'system') continue;
    var c = typeof m.content === 'string' ? m.content : '';
    if (m.role === 'tool') {
      out.push({ role: 'tool', content: c.slice(0, TOOL_KEEP) + (c.length > TOOL_KEEP ? ' …' : '') });
    } else if (c.trim()) {
      out.push({ role: m.role, content: c });   // tool_calls 는 뺀다 — 결론만 필요하다
    }
  }
  // 그래도 크면 오래된 조회결과부터 버린다. 최근 것이 결론에 가깝다.
  for (var k = 0; k < out.length && JSON.stringify(out).length > EXTRACT_LIMIT; k++) {
    if (out[k].role === 'tool') out[k].content = '(생략)';
  }
  return out;
}

function extractFacts() {
  if (messages.length < 3) return Promise.resolve();
  var box = add('지식 정리', '이번 분석에서 알게 된 사실을 정리하는 중…', 'fact');
  var sent = compactForExtract();
  return fetch(API + '/sap/facts/extract', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ userKey: userKey(), messages: sent }),
  })
  .then(function (r) {
    // 본문이 JSON 이 아닐 수도 있다(게이트웨이가 만든 오류). 상태코드라도 남긴다.
    return r.json().catch(function () { return { error: 'HTTP ' + r.status }; });
  })
  .then(function (d) {
    if (d.error) {
      box.className = 'msg err';
      box.querySelector('.body').textContent = '지식 정리 실패: ' + d.error;
      retryButton(box);
      return;
    }
    var fs = d.facts || [];
    if (!fs.length) {
      box.querySelector('.body').textContent = d.note || d.skipped || '새로 쌓을 사실이 없습니다.';
      return;
    }
    box.querySelector('.body').textContent =
      fs.map(function (f) { return '• [' + f.subject + '] ' + f.body; }).join('\n')
      + '\n\n검수중으로 저장했습니다 — "지식 정리" 에서 고치거나 확인 처리하세요.';
    return loadFacts();
  })
  .catch(function (e) {
    box.className = 'msg err';
    // "Failed to fetch" 는 서버가 답을 못 준 것이다. 보통 대화가 너무 크거나
    // 추출이 29초를 넘긴 경우라, 그대로 보여주면 원인을 알 수 없다.
    var kb = Math.round(JSON.stringify(sent).length / 1024);
    box.querySelector('.body').textContent =
      '지식 정리 실패: ' + e.message + '\n'
      + '보낸 크기 ' + kb.toLocaleString() + 'KB · 서버가 응답하기 전에 끊겼습니다'
      + ' (대화가 너무 크거나 29초를 넘긴 경우).';
    retryButton(box);
  });
}

/** 실패한 정리를 분석 다시 안 하고 되돌릴 수 있게 한다. */
function retryButton(box) {
  if (box.querySelector('button')) return;
  var b = document.createElement('button');
  b.type = 'button';
  b.textContent = '지식 정리 다시 시도';
  b.style.marginTop = '8px';
  b.addEventListener('click', function () { box.remove(); extractFacts(); });
  box.appendChild(b);
}

/* ── 도구 실행 (로컬 워커) ──────────────────────── */
function runTool(name, argsJson) {
  var args;
  try { args = JSON.parse(argsJson || '{}'); } catch (e) { args = {}; }
  var started = Date.now();
  var box = add('도구 · ' + name, JSON.stringify(args, null, 0) + '\n\n조회 중…', 'tool');
  return fetch(workerUrl() + '/tool', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: name, arguments: args }),
  })
  .then(function (r) { return r.json(); })
  .then(function (d) {
    var out = d.result || d.error || '(빈 결과)';
    box.querySelector('.body').textContent = JSON.stringify(args) + '\n\n' + out;
    var m = document.createElement('div');
    m.className = 'meta';
    [((Date.now() - started) / 1000).toFixed(1) + '초', out.length.toLocaleString() + '자']
      .forEach(function (t) { var s = document.createElement('span'); s.textContent = t; m.appendChild(s); });
    box.appendChild(m);
    totals.tools += 1;
    return out;
  })
  .catch(function (e) {
    var msg = '워커 호출 실패: ' + e.message;
    box.querySelector('.body').textContent = msg;
    box.className = 'msg err';
    return msg;
  });
}

/* ── 한 스텝: 모델 호출 ─────────────────────────── */
function step() {
  return fetch(API + '/sap/raw', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      userKey: userKey(), messages: messages,
      tools: toolSpecs.length ? toolSpecs : undefined,
      model: modelSel.value,
    }),
  }).then(function (r) { return r.json(); });
}

function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

/* 속도 제한(429)은 잠시 뒤에 다시 하면 풀리는 일시적인 문제다. 그런데 20단계쯤
   조사한 뒤에 걸리면 분석 전체가 날아간다 — 다시 돌리면 같은 조회를 처음부터
   또 하게 되고 돈도 두 배로 든다. 그래서 여기서 기다렸다 다시 묻는다. */
async function stepWithRetry(onWait) {
  var waits = [20, 40, 60, 90];        // 초
  for (var n = 0; ; n++) {
    var d = await step();
    var msg = String((d && d.error) || '');
    var rateLimited = /\b429\b|rate limit|exceeded the rate/i.test(msg);
    if (!rateLimited || n >= waits.length) return d;

    for (var left = waits[n]; left > 0; left--) {
      if (stopped) return d;
      onWait(left, n + 1, waits.length);
      await sleep(1000);
    }
  }
}

/* ── 분석 루프 ──────────────────────────────────── */
async function analyze(text) {
  messages.push({ role: 'user', content: text });

  for (var i = 0; i < SAFETY_STEPS; i++) {
    if (stopped) { add('중단', '사용자가 중단했습니다.', 'err'); await extractFacts(); return; }

    var pending = add('AI', i === 0 ? '분석 중…' : '이어서 분석 중 (' + (i + 1) + '단계)…');
    var d;
    try {
      d = await stepWithRetry(function (left, nth, total) {
        pending.querySelector('.body').textContent =
          '속도 제한에 걸렸습니다 — ' + left + '초 뒤 다시 시도 (' + nth + '/' + total + ')'
          + '\n여기까지 조사한 내용은 그대로 있습니다. 중단을 누르면 멈춥니다.';
      });
    } catch (e) { pending.remove(); add('오류', e.message, 'err'); return; }
    pending.remove();

    if (d.error) {
      add('오류', d.error, 'err');
      await extractFacts();            // 여기까지 알아낸 것은 남긴다
      return;
    }

    var u = d.usage || {};
    totals.calls += 1;
    totals.inTok += u.prompt_tokens || 0;
    totals.outTok += u.completion_tokens || 0;
    totals.cost += u.cost || 0;
    totals.ms += d.latencyMs || 0;
    showTotals();

    var calls = d.toolCalls || [];

    // 모델의 이번 턴을 대화에 그대로 되돌려 넣어야 다음 턴이 이어진다
    messages.push({
      role: 'assistant',
      content: d.text || '',
      tool_calls: calls.length ? calls : undefined,
    });

    if (!calls.length) {
      add('AI', d.text || '(빈 응답)', '', [
        d.model, (d.latencyMs / 1000).toFixed(1) + '초',
        '입력 ' + (u.prompt_tokens || 0).toLocaleString() + ' 토큰',
        '출력 ' + (u.completion_tokens || 0).toLocaleString() + ' 토큰',
        (i + 1) + '단계 만에 완료',
      ]);
      await extractFacts();          // 분석 한 건이 끝났으니 사실만 뽑아 쌓는다
      return;
    }

    if (d.text) add('AI', d.text, '', [d.model, '도구 ' + calls.length + '개 요청']);

    for (var k = 0; k < calls.length; k++) {
      var c = calls[k];
      var fn = (c.function || {});
      var result = await runTool(fn.name, fn.arguments);
      messages.push({ role: 'tool', tool_call_id: c.id, content: String(result) });
    }
  }

  add('오류', SAFETY_STEPS + '단계를 넘었습니다 — 같은 호출을 반복하고 있을 수 있습니다.', 'err');
  await extractFacts();              // 중간에 끊겼어도 알아낸 것은 남긴다
}

document.getElementById('f').addEventListener('submit', function (ev) {
  ev.preventDefault();
  var text = q.value.trim();
  if (!text) return;
  add('나', text, 'me');
  q.value = '';
  stopped = false;
  send.disabled = true;
  stopBtn.hidden = false;
  stopBtn.disabled = false;
  stopBtn.textContent = '중단';
  analyze(text).then(function () {
    send.disabled = false;
    stopBtn.hidden = true;
    q.focus();
  });
});

stopBtn.addEventListener('click', function () {
  stopped = true;                    // 지금 돌고 있는 호출은 끝나고 멈춘다
  stopBtn.disabled = true;
  stopBtn.textContent = '중단하는 중…';
});

q.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) document.getElementById('f').requestSubmit();
});

document.getElementById('reset').addEventListener('click', function () {
  messages = [{ role: 'system', content: systemPrompt() }];
  totals = { calls: 0, inTok: 0, outTok: 0, cost: 0, ms: 0, tools: 0 };
  totalsEl.textContent = '';
  log.innerHTML = '<p class="empty">새 분석을 시작합니다.</p>';
  loadFacts();                       // 그 사이 누가 고쳤을 수 있다
  q.focus();
});
</script>
