<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAP 운영 문의 AI</title>
<style>
:root {
  --bg:#f6f7f6; --surface:#fff; --sunken:#eceeed; --line:#d6dad8;
  --fg:#16211f; --muted:#5c6a67; --accent:#15605b; --warn:#8a5a12;
  --b:"IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif;
  --m:ui-monospace,Consolas,monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#111816; --surface:#18211f; --sunken:#141c1a; --line:#2b3835;
          --fg:#e6ece9; --muted:#94a49f; --accent:#57b3aa; --warn:#d6a95f;
          color-scheme: dark; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--b);line-height:1.6}
.wrap{max-width:900px;margin:0 auto;padding:22px 16px 40px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:19px;margin:0;font-weight:600}
h1 small{display:block;font-size:11.5px;color:var(--muted);font-weight:400;font-family:var(--m);margin-top:2px}
.tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
select,button,input{font-family:var(--b);font-size:13px;color:var(--fg);background:var(--sunken);
  border:1px solid var(--line);border-radius:6px;padding:7px 10px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button:disabled{opacity:.5;cursor:default}
#convs{display:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:8px;margin-bottom:14px;max-height:230px;overflow:auto}
#convs .row{padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px;display:flex;
  justify-content:space-between;gap:10px}
#convs .row:hover{background:var(--sunken)}
#convs .row b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#convs .row span{color:var(--muted);font-family:var(--m);font-size:11px;flex:none}
#convs .none{color:var(--muted);font-size:13px;padding:12px;text-align:center}
#log{display:flex;flex-direction:column;gap:12px;margin-bottom:16px;min-height:110px}
.msg{border:1px solid var(--line);border-radius:10px;padding:12px 15px;background:var(--surface)}
.msg.me{background:var(--sunken)}
.who{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:5px}
.body{white-space:pre-wrap;word-break:break-word}
.meta{margin-top:9px;padding-top:8px;border-top:1px solid var(--line);font-family:var(--m);
  font-size:11px;color:var(--muted);display:flex;flex-wrap:wrap;gap:12px}
.msg.err{border-color:var(--warn)}
.msg.err .who{color:var(--warn)}
.msg.err .body{font-family:var(--m);font-size:12px}
.empty{color:var(--muted);font-size:13.5px;text-align:center;padding:30px 0}
form{display:flex;gap:9px;align-items:flex-end}
textarea{flex:1;min-width:0;font-family:var(--b);font-size:14.5px;color:var(--fg);background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:11px 13px;resize:vertical;min-height:56px;line-height:1.5}
textarea:focus-visible,select:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.hint{font-size:11.5px;color:var(--muted);margin-top:8px;font-family:var(--m)}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>SAP 운영 문의 AI<small id="info">준비 중…</small></h1>
    <div class="tools">
      <select id="model" title="모델">
        <option value="openai/gpt-6-luna">gpt-6-luna · 15원/건</option>
        <option value="openai/gpt-6-sol">gpt-6-sol · 290원/건</option>
        <option value="openai/gpt-6-astra">gpt-6-astra · 1,450원/건</option>
        <option value="anthropic/claude-haiku-5.5">claude-haiku-5.5 · 15원/건</option>
        <option value="anthropic/claude-sonnet-5.5">claude-sonnet-5.5 · 290원/건</option>
        <option value="anthropic/claude-opus-5">claude-opus-5 · 725원/건</option>
      </select>
      <button id="listBtn" type="button">대화 목록</button>
      <button id="shareBtn" type="button" title="이 대화 링크 복사">공유</button>
      <button id="reset" type="button">새 대화</button>
    </div>
  </header>

  <div id="convs"></div>

  <div id="log"><p class="empty">ABAP 소스를 붙여넣고 질문하면 분석 결과가 여기 표시됩니다.</p></div>

  <form id="f">
    <textarea id="q" placeholder="예) 아래 소스에서 거래처 필터가 안 먹는 이유는?"></textarea>
    <button class="primary" id="send" type="submit">보내기</button>
  </form>
  <p class="hint">Ctrl+Enter 전송 · 대화는 서버에 저장되어 다른 사람과 공유할 수 있습니다</p>

</div>

<script>
var API = 'https://erilyjnp21.execute-api.ap-southeast-2.amazonaws.com';

/* 로그인 연동 전까지는 브라우저가 만든 키로 "내 대화"를 구분한다.
   convId 를 아는 사람은 누구나 그 대화를 볼 수 있다(공유). */
var userKey = (function () {
  try {
    var v = localStorage.getItem('sapUserKey');
    if (!v) { v = 'web-' + Math.random().toString(36).slice(2, 10); localStorage.setItem('sapUserKey', v); }
    return v;
  } catch (e) { return 'web-anon'; }
})();

var convId = new URLSearchParams(location.search).get('conv') || null;

var log = document.getElementById('log');
var q = document.getElementById('q');
var send = document.getElementById('send');
var modelSel = document.getElementById('model');
var convs = document.getElementById('convs');
var info = document.getElementById('info');

function setInfo(t) { info.textContent = t; }
setInfo(userKey);

function add(who, text, cls, meta) {
  var e = log.querySelector('.empty');
  if (e) e.remove();
  var d = document.createElement('div');
  d.className = 'msg ' + (cls || '');
  d.innerHTML = '<div class="who"></div><div class="body"></div>';
  d.querySelector('.who').textContent = who;
  d.querySelector('.body').textContent = text;
  if (meta) {
    var m = document.createElement('div');
    m.className = 'meta';
    meta.filter(Boolean).forEach(function (t) {
      var s = document.createElement('span'); s.textContent = t; m.appendChild(s);
    });
    d.appendChild(m);
  }
  log.appendChild(d);
  d.scrollIntoView({ block: 'end', behavior: 'smooth' });
  return d;
}

function openConversation(id) {
  convId = id;
  convs.style.display = 'none';
  log.innerHTML = '<p class="empty">불러오는 중…</p>';
  fetch(API + '/sap/messages?convId=' + encodeURIComponent(id) + '&userKey=' + encodeURIComponent(userKey))
    .then(function (r) { return r.json(); })
    .then(function (d) {
      log.innerHTML = '';
      if (d.error) { add('오류', d.error, 'err'); return; }
      (d.messages || []).forEach(function (m) {
        add(m.role === 'user' ? '나' : 'AI', m.content, m.role === 'user' ? 'me' : '');
      });
      if (!(d.messages || []).length) log.innerHTML = '<p class="empty">빈 대화입니다.</p>';
      setInfo('대화 ' + id);
    })
    .catch(function (e) { log.innerHTML = ''; add('오류', e.message, 'err'); });
}

if (convId) openConversation(convId);

document.getElementById('f').addEventListener('submit', function (ev) {
  ev.preventDefault();
  var text = q.value.trim();
  if (!text) return;

  add('나', text, 'me');
  q.value = '';
  send.disabled = true;
  var pending = add('AI', '분석 중…');

  fetch(API + '/sap/ask', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ userKey: userKey, convId: convId, text: text, model: modelSel.value }),
  })
  .then(function (r) { return r.json(); })
  .then(function (d) {
    pending.remove();
    if (d.error) { add('오류', d.error, 'err'); return; }
    convId = d.convId;
    setInfo('대화 ' + convId);
    var u = d.usage || {};
    add('AI', d.text, '', [
      d.model,
      (d.latencyMs / 1000).toFixed(1) + '초',
      '입력 ' + (u.prompt_tokens != null ? u.prompt_tokens : '?') + ' 토큰',
      '출력 ' + (u.completion_tokens != null ? u.completion_tokens : '?') + ' 토큰',
      u.cost != null ? '약 ' + Math.max(1, Math.round(u.cost * 1450)) + '원' : '',
      d.continued ? '이어진 대화' : '새 대화',
    ]);
  })
  .catch(function (err) { pending.remove(); add('오류', err.message, 'err'); })
  .then(function () { send.disabled = false; q.focus(); });
});

q.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) document.getElementById('f').requestSubmit();
});

document.getElementById('listBtn').addEventListener('click', function () {
  if (convs.style.display === 'block') { convs.style.display = 'none'; return; }
  convs.innerHTML = '<p class="none">불러오는 중…</p>';
  convs.style.display = 'block';
  fetch(API + '/sap/conversations?userKey=' + encodeURIComponent(userKey))
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var list = d.conversations || [];
      if (!list.length) { convs.innerHTML = '<p class="none">아직 대화가 없습니다.</p>'; return; }
      convs.innerHTML = '';
      list.forEach(function (c) {
        var row = document.createElement('div');
        row.className = 'row';
        var b = document.createElement('b');
        b.textContent = c.title || '(제목 없음)';
        var s = document.createElement('span');
        s.textContent = String(c.lastAt || '').slice(0, 16).replace('T', ' ') + ' · ' + (c.msgCount || 0) + '개';
        row.appendChild(b); row.appendChild(s);
        row.addEventListener('click', function () { openConversation(c.convId); });
        convs.appendChild(row);
      });
    })
    .catch(function (e) { convs.innerHTML = '<p class="none">' + e.message + '</p>'; });
});

document.getElementById('shareBtn').addEventListener('click', function () {
  if (!convId) { alert('먼저 질문을 보내면 공유 링크가 생깁니다.'); return; }
  var url = location.origin + location.pathname + '?conv=' + encodeURIComponent(convId);
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url)
      .then(function () { setInfo('링크 복사됨'); })
      .catch(function () { prompt('이 링크를 복사하세요', url); });
  } else {
    prompt('이 링크를 복사하세요', url);
  }
});

document.getElementById('reset').addEventListener('click', function () {
  convId = null;
  history.replaceState(null, '', location.pathname);
  convs.style.display = 'none';
  log.innerHTML = '<p class="empty">새 대화를 시작합니다.</p>';
  setInfo(userKey);
  q.focus();
});
</script>
</body>
</html>
