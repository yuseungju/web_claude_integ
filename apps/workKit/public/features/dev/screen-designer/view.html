<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>화면 설계서 보기 – WorkKit</title>
  <link rel="stylesheet" href="../../../assets/css/common.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="sd-view-page">
  <div class="app-wrap" style="height:100vh;overflow:hidden">
    <header class="app-header">
      <div class="header-inner">
        <div class="header-left">
          <a href="../../../index.html" class="header-logo" style="text-decoration:none;color:inherit">
            <span class="logo-icon">⚙️</span><span class="logo-text">WorkKit</span>
          </a>
        </div>
      </div>
    </header>

    <!-- 작업 헤더 -->
    <div class="ws-header">
      <a href="index.html" class="ws-back">← 목록</a>
      <span id="viewTitle" class="ws-title-view">불러오는 중...</span>
      <span class="publish-badge">게시됨</span>
      <div style="flex:1"></div>
      <span id="viewAuthor" class="view-author-badge"></span>
      <button id="editBtn" class="ws-save-btn" style="display:none" onclick="goEdit()">✏️ 편집하기</button>
    </div>

    <div class="sd-workspace">
      <!-- 노드 트리 사이드바 -->
      <div class="sd-sidebar" id="sdSidebar">
        <div id="nodeTree" class="node-tree">
          <div class="node-tree-loading">불러오는 중...</div>
        </div>
      </div>
      <div class="sidebar-resize" id="sdSidebarResize"></div>

      <!-- 뷰어 영역 -->
      <div class="sd-center">
        <div id="nodeEmpty" class="node-empty-state">
          <span class="node-empty-icon">🖥️</span>
          <p>왼쪽에서 화면을 선택하세요</p>
        </div>

        <div id="nodePanel" style="display:none;flex:1;flex-direction:column;overflow:hidden">
          <div class="sd-panel-header view-panel-header">
            <span id="nodeTitle" class="view-node-title"></span>
            <span id="screenLink" class="screen-link-badge" title="화면 링크" style="cursor:pointer"></span>
          </div>
          <div class="sd-canvas-row" style="overflow:auto;flex:1">
            <div class="sd-canvas-scroll" id="sdCanvasScroll">
              <div class="sd-canvas view-canvas" id="sdCanvas"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 팝업 모달 -->
  <div id="sdPopup" class="sd-popup-overlay" style="display:none" onclick="if(event.target===this)closePopup()">
    <div class="sd-popup-modal">
      <div class="sd-popup-header">
        <span id="sdPopupTitle" class="sd-popup-title"></span>
        <button class="sd-popup-close" onclick="closePopup()">×</button>
      </div>
      <iframe id="sdPopupFrame" class="sd-popup-iframe" src="about:blank"></iframe>
      <div id="sdPopupNodeCanvas" class="sd-popup-canvas" style="display:none;position:relative;overflow:auto;flex:1;background:var(--bg-surface,#f5f5f5)"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="../../../assets/js/auth-header.js"></script>
  <script src="view.js"></script>
</body>
</html>
