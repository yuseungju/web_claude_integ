<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글 합치기 · 요약</title>
<link rel="stylesheet" href="../assets/theme.css">
<style>
.cols { display:grid; gap:12px; grid-template-columns:260px 1fr; align-items:start }
@media (max-width: 820px) { .cols { grid-template-columns:1fr } }

/* 왼쪽 목록 */
.list { display:flex; flex-direction:column; gap:6px; max-height:70vh; overflow:auto }
.doc { text-align:left; width:100%; background:var(--surface); border:1px solid var(--line);
       border-radius:8px; padding:8px 11px; cursor:pointer; font-size:12.5px }
.doc:hover { border-color:var(--accent) }
.doc.on { border-color:var(--accent); background:var(--sunken) }
.doc .t { font-weight:600; display:block; margin-bottom:2px }
.doc .m { font-family:var(--m); font-size:10.5px; color:var(--muted) }

/* 원문 카드 */
.src { border:1px solid var(--line); border-radius:9px; padding:9px 11px; margin-bottom:8px;
       background:var(--surface) }
.src .head { display:flex; gap:7px; align-items:center; margin-bottom:6px }
.src .head input { flex:1; font-size:12.5px; padding:4px 8px; background:transparent;
                   border:1px solid transparent }
.src .head input:hover { border-color:var(--line) }
.src .head input:focus { background:var(--sunken); border-color:var(--accent); outline:none }
.src .n { font-family:var(--m); font-size:11px; color:var(--muted); flex:none }
.src textarea { min-height:90px; background:transparent; border:1px solid transparent;
                padding:5px 7px; font-size:13px }
.src textarea:hover { border-color:var(--line) }
.src textarea:focus { background:var(--sunken); border-color:var(--accent); outline:none }

#body, #summary { min-height:200px; font-size:13.5px; background:var(--sunken) }
#summary { min-height:150px }
.drop { border:1px dashed var(--line); border-radius:9px; padding:14px; text-align:center;
        color:var(--muted); font-size:12.5px; margin-bottom:10px }
.drop.over { border-color:var(--accent); color:var(--accent) }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <h1><a href="../">Agent</a> › 글 합치기 · 요약<small>여러 글을 모아 하나로 — 요약은 헤르메스</small></h1>
    <div class="acts" id="acts"></div>
  </div>

  <div class="bar">
    <button id="new" type="button">새 문서</button>
    <button class="primary" id="save" type="button">저장</button>
    <button id="del" type="button">삭제</button>
    <span class="grow"></span>
    <span class="k" id="stat"></span>
  </div>

  <div class="cols">

    <div>
      <div class="panel">
        <h2>보관함</h2>
        <div class="list" id="list"><p class="empty">불러오는 중…</p></div>
      </div>
    </div>

    <div>
      <div class="panel">
        <h2>제목</h2>
        <input id="title" placeholder="제목" style="width:100%">
      </div>

      <div class="panel">
        <h2>원문 <span class="k" id="srcCount"></span></h2>
        <div class="drop" id="drop">
          텍스트 파일을 끌어다 놓거나 <b>원문 추가</b>로 직접 붙여넣으세요
          <br><span class="k">.txt · .md · .csv · .json · .abap 등 글자 파일</span>
        </div>
        <div id="srcs"></div>
        <div class="row">
          <button id="addSrc" type="button">원문 추가</button>
          <input type="file" id="file" multiple hidden
                 accept=".txt,.md,.csv,.json,.log,.abap,.sql,.yaml,.yml,text/*">
          <button id="pickFile" type="button">파일 선택</button>
          <span class="grow"></span>
          <button class="primary" id="merge" type="button">합치기</button>
        </div>
      </div>

      <div class="panel">
        <h2>합쳐진 글 <span class="k" id="bodyCount"></span></h2>
        <textarea id="body" placeholder="합치기를 누르면 여기에 이어 붙습니다. 직접 고쳐도 됩니다."></textarea>
        <div class="row">
          <input id="instruction" placeholder="요약 지시 (선택) — 예: 변경점 위주로" style="flex:1;min-width:160px">
          <button class="primary" id="sum" type="button">요약</button>
        </div>
      </div>

      <div class="panel">
        <h2>요약 <span class="k" id="sumMeta"></span></h2>
        <textarea id="summary" placeholder="요약이 여기 들어옵니다. 고쳐서 저장할 수 있습니다."></textarea>
      </div>
    </div>

  </div>
</div>

<script src="../assets/app.js"></script>
<script>
var listEl = document.getElementById('list');
var srcsEl = document.getElementById('srcs');
var titleEl = document.getElementById('title');
var bodyEl = document.getElementById('body');
var sumEl = document.getElementById('summary');
var statEl = document.getElementById('stat');

/* 지금 편집 중인 문서. docId 가 없으면 아직 저장 안 된 새 문서다.
   rev 는 저장할 때 조건으로 걸어, 다른 곳에서 먼저 저장했으면 덮어쓰지 않는다. */
var cur = { docId: null, rev: 0 };
var docs = [];

document.getElementById('acts').innerHTML = Agent.barHtml();
Agent.init({
  who: document.getElementById('who'),
  api: document.getElementById('api'),
  onApiChange: function () { loadList(); },
});

function say(text, cls) {
  statEl.className = 'k ' + (cls || '');
  statEl.textContent = text;
}

/* ── 원문 칸 ─────────────────────────────────────── */

function addSrc(title, text) {
  var box = document.createElement('div');
  box.className = 'src';

  var head = document.createElement('div');
  head.className = 'head';

  var n = document.createElement('span');
  n.className = 'n';
  head.appendChild(n);

  var t = document.createElement('input');
  t.placeholder = '원문 제목 (선택)';
  t.value = title || '';
  head.appendChild(t);

  var up = document.createElement('button');
  up.className = 'sm'; up.type = 'button'; up.textContent = '↑';
  up.title = '위로';
  up.addEventListener('click', function () {
    var prev = box.previousElementSibling;
    if (prev) { srcsEl.insertBefore(box, prev); renumber(); }
  });
  head.appendChild(up);

  var rm = document.createElement('button');
  rm.className = 'sm'; rm.type = 'button'; rm.textContent = '×';
  rm.title = '이 원문 빼기';
  rm.addEventListener('click', function () { box.remove(); renumber(); });
  head.appendChild(rm);

  box.appendChild(head);

  var ta = document.createElement('textarea');
  ta.placeholder = '본문을 붙여넣으세요';
  ta.value = text || '';
  ta.addEventListener('input', renumber);
  box.appendChild(ta);

  srcsEl.appendChild(box);
  renumber();
  if (!text) ta.focus();
  return box;
}

function renumber() {
  var boxes = srcsEl.querySelectorAll('.src');
  var chars = 0;
  Array.prototype.forEach.call(boxes, function (b, i) {
    b.querySelector('.n').textContent = (i + 1) + '.';
    chars += b.querySelector('textarea').value.length;
  });
  document.getElementById('srcCount').textContent =
    boxes.length ? boxes.length + '개 · ' + chars.toLocaleString() + '자' : '';
}

function readSrcs() {
  return Array.prototype.map.call(srcsEl.querySelectorAll('.src'), function (b) {
    return { title: b.querySelector('input').value, text: b.querySelector('textarea').value };
  }).filter(function (s) { return s.text.trim(); });
}

bodyEl.addEventListener('input', function () {
  document.getElementById('bodyCount').textContent =
    bodyEl.value ? bodyEl.value.length.toLocaleString() + '자' : '';
});

/* ── 파일 넣기 ───────────────────────────────────── */

function takeFiles(files) {
  Array.prototype.forEach.call(files, function (f) {
    var r = new FileReader();
    r.onload = function () { addSrc(f.name, String(r.result || '')); };
    // 글자 파일만 받는다. 엑셀·PDF 는 그대로 읽으면 깨진 글자가 들어간다.
    r.readAsText(f, 'utf-8');
  });
}

var drop = document.getElementById('drop');
['dragenter', 'dragover'].forEach(function (ev) {
  drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); });
});
['dragleave', 'drop'].forEach(function (ev) {
  drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); });
});
drop.addEventListener('drop', function (e) { takeFiles(e.dataTransfer.files); });

document.getElementById('pickFile').addEventListener('click', function () {
  document.getElementById('file').click();
});
document.getElementById('file').addEventListener('change', function (e) {
  takeFiles(e.target.files);
  e.target.value = '';
});
document.getElementById('addSrc').addEventListener('click', function () { addSrc('', ''); });

/* ── 합치기 · 요약 ───────────────────────────────── */

document.getElementById('merge').addEventListener('click', function () {
  var sources = readSrcs();
  if (!sources.length) { say('합칠 글이 없습니다', 'bad'); return; }
  if (bodyEl.value.trim() && !confirm('합쳐진 글을 새로 만듭니다. 지금 내용은 사라집니다.')) return;

  say('합치는 중…');
  Agent.call('/agent/merge', { method: 'POST', body: { sources: sources } })
    .then(function (d) {
      bodyEl.value = d.body;
      bodyEl.dispatchEvent(new Event('input'));
      say(d.count + '개 글 · ' + d.chars.toLocaleString() + '자로 합쳤습니다', 'ok');
    })
    .catch(function (e) { say('합치기 실패: ' + e.message, 'bad'); });
});

document.getElementById('sum').addEventListener('click', function () {
  var text = bodyEl.value.trim();
  var sources = readSrcs();
  if (!text && !sources.length) { say('요약할 내용이 없습니다', 'bad'); return; }

  var btn = this;
  btn.disabled = true;
  say('요약하는 중… (헤르메스 경유, 수십 초 걸릴 수 있습니다)');
  document.getElementById('sumMeta').textContent = '';

  Agent.call('/agent/summary', {
    method: 'POST',
    body: {
      body: text, sources: sources,
      instruction: document.getElementById('instruction').value,
    },
  })
    .then(function (d) {
      sumEl.value = d.summary || '(빈 응답)';
      var u = d.usage || {};
      document.getElementById('sumMeta').textContent =
        [d.model, (d.latencyMs / 1000).toFixed(1) + '초',
         '입력 ' + (u.prompt_tokens || 0).toLocaleString(),
         '출력 ' + (u.completion_tokens || 0).toLocaleString()].join(' · ');
      say('요약했습니다. 고쳐서 저장할 수 있습니다', 'ok');
    })
    .catch(function (e) { say('요약 실패: ' + e.message, 'bad'); })
    .then(function () { btn.disabled = false; });
});

/* ── 보관함 ─────────────────────────────────────── */

function loadList() {
  return Agent.call('/agent/docs', { query: { kind: 'merge' } })
    .then(function (d) {
      docs = d.docs || [];
      drawList();
    })
    .catch(function (e) {
      listEl.innerHTML = '';
      var p = document.createElement('p');
      p.className = 'empty';
      p.textContent = '불러오지 못했습니다: ' + e.message;
      listEl.appendChild(p);
    });
}

function drawList() {
  listEl.innerHTML = '';
  if (!docs.length) {
    var p = document.createElement('p');
    p.className = 'empty';
    p.textContent = '아직 저장한 글이 없습니다.';
    listEl.appendChild(p);
    return;
  }
  docs.forEach(function (d) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'doc' + (d.docId === cur.docId ? ' on' : '');
    var t = document.createElement('span');
    t.className = 't';
    t.textContent = d.title;
    var m = document.createElement('span');
    m.className = 'm';
    m.textContent = [
      d.sourceCount + '개 원문',
      d.bodyChars.toLocaleString() + '자',
      d.hasSummary ? '요약 있음' : '요약 없음',
      Agent.fmtTime(d.updatedAt),
    ].join(' · ');
    b.appendChild(t); b.appendChild(m);
    b.addEventListener('click', function () { open(d.docId); });
    listEl.appendChild(b);
  });
}

function open(docId) {
  say('불러오는 중…');
  Agent.call('/agent/doc', { query: { docId: docId } })
    .then(function (d) {
      var doc = d.doc;
      cur = { docId: doc.docId, rev: doc.rev };
      titleEl.value = doc.title || '';
      srcsEl.innerHTML = '';
      (doc.sources || []).forEach(function (s) { addSrc(s.title, s.text); });
      renumber();
      bodyEl.value = doc.body || '';
      bodyEl.dispatchEvent(new Event('input'));
      sumEl.value = doc.summary || '';
      drawList();
      say('rev ' + doc.rev + ' · ' + Agent.fmtTime(doc.updatedAt));
    })
    .catch(function (e) { say('불러오기 실패: ' + e.message, 'bad'); });
}

function reset() {
  cur = { docId: null, rev: 0 };
  titleEl.value = '';
  srcsEl.innerHTML = '';
  bodyEl.value = '';
  sumEl.value = '';
  document.getElementById('sumMeta').textContent = '';
  renumber();
  bodyEl.dispatchEvent(new Event('input'));
  drawList();
  say('새 문서');
  addSrc('', '');
}

document.getElementById('new').addEventListener('click', reset);

document.getElementById('save').addEventListener('click', function () {
  var payload = {
    kind: 'merge',
    title: titleEl.value,
    sources: readSrcs(),
    body: bodyEl.value,
    summary: sumEl.value,
  };
  if (!payload.body.trim() && !payload.sources.length) { say('저장할 내용이 없습니다', 'bad'); return; }
  if (cur.docId) { payload.docId = cur.docId; payload.rev = cur.rev; }

  var btn = this;
  btn.disabled = true;
  say('저장 중…');
  Agent.call('/agent/doc', { method: 'POST', body: payload })
    .then(function (d) {
      cur = { docId: d.doc.docId, rev: d.doc.rev };
      say('저장했습니다 · rev ' + d.doc.rev, 'ok');
      return loadList();
    })
    .catch(function (e) {
      if (e.status === 409 && e.payload && e.payload.doc) {
        // 덮어쓰지 않는다. 어느 쪽을 남길지는 사람이 정해야 한다.
        say('다른 곳에서 먼저 저장했습니다', 'bad');
        if (confirm('다른 곳에서 먼저 저장했습니다.\n\n확인: 서버의 최신 내용을 불러옵니다(지금 입력은 사라집니다)\n취소: 그대로 두고 직접 비교합니다')) {
          open(cur.docId);
        }
        return;
      }
      say('저장 실패: ' + e.message, 'bad');
    })
    .then(function () { btn.disabled = false; });
});

document.getElementById('del').addEventListener('click', function () {
  if (!cur.docId) { say('저장되지 않은 문서입니다', 'bad'); return; }
  if (!confirm('이 문서를 지웁니다. 되돌릴 수 없습니다.')) return;
  Agent.call('/agent/doc', { method: 'DELETE', body: { docId: cur.docId } })
    .then(function () { reset(); return loadList(); })
    .then(function () { say('지웠습니다', 'ok'); })
    .catch(function (e) { say('삭제 실패: ' + e.message, 'bad'); });
});

window.addEventListener('beforeunload', function (ev) {
  if (bodyEl.value.trim() || readSrcs().length) {
    // 저장 여부를 정확히 알 수 없으므로, 내용이 있으면 일단 물어본다
    ev.preventDefault(); ev.returnValue = '';
  }
});

addSrc('', '');
loadList();
</script>
</body>
</html>
