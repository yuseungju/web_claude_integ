version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci || npm install
    build:
      commands:
        # 1) apps/<앱>/public 을 dist/<경로>/ 로 조립 (디렉토리 구조 = URL 구조)
        - node scripts/build-site.js
        # 2) db/<앱>/*.sql 을 db/schema_all.sql 로 병합 (파괴적 구문이 있으면 여기서 실패)
        - node db/build-schema.js
        # 3) RDS 에 스키마 반영. DB_* 환경변수가 없으면 건너뛴다(프론트 배포는 계속 진행)
        - node db/migrate.js
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
