<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>기사 작성기</title>
  <link rel="stylesheet" href="assets/css/common.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg); }
    .auth-wrap { width: 100%; max-width: 420px; padding: 1rem; }
    .auth-logo { text-align: center; margin-bottom: 2rem; }
    .auth-logo .logo-icon { font-size: 2.5rem; display: block; margin-bottom: 0.5rem; }
    .auth-logo h1 { font-size: 1.5rem; font-weight: 800; color: var(--primary); }
    .auth-logo p  { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.3rem; }
    .auth-card { background: var(--bg-card); border-radius: var(--radius-md); border: 1px solid var(--border); box-shadow: var(--shadow-md); padding: 2rem; }
    .auth-tabs { display: flex; margin-bottom: 1.75rem; border-bottom: 2px solid var(--border); }
    .auth-tab {
      flex: 1; text-align: center; padding: 0.6rem;
      font-size: 0.92rem; font-weight: 700; cursor: pointer;
      color: var(--text-muted); border-bottom: 2.5px solid transparent;
      margin-bottom: -2px; transition: all 0.15s;
    }
    .auth-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .form-group { display: flex; flex-direction: column; gap: 0.9rem; }
    .field { display: flex; flex-direction: column; gap: 0.3rem; }
    .field label { font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); }
    .field input {
      padding: 0.65rem 0.9rem; border: 1.5px solid var(--border);
      border-radius: var(--radius-sm); font-size: 0.88rem;
      font-family: var(--font-sans); outline: none;
      background: var(--bg); color: var(--text-primary);
      transition: border-color 0.15s;
    }
    .field input:focus { border-color: var(--primary); background: #fff; }
    .field input.ok  { border-color: var(--success); }
    .field input.err { border-color: var(--danger); }
    .field-hint { font-size: 0.73rem; }
    .field-hint.ok  { color: #059669; }
    .field-hint.err { color: var(--danger); }
    .email-row { display: flex; gap: 0.4rem; }
    .email-row input { flex: 1; }
    .btn-check {
      padding: 0 0.9rem; white-space: nowrap;
      border: 1.5px solid var(--primary); background: #fff;
      border-radius: var(--radius-sm); font-size: 0.78rem;
      font-weight: 700; cursor: pointer; color: var(--primary);
      transition: all 0.15s; flex-shrink: 0;
    }
    .btn-check:hover { background: var(--primary); color: #fff; }
    .btn-submit {
      width: 100%; padding: 0.75rem; background: var(--primary);
      color: #fff; border: none; border-radius: var(--radius-sm);
      font-size: 0.92rem; font-weight: 700; cursor: pointer;
      transition: background 0.15s; margin-top: 0.5rem;
    }
    .btn-submit:hover:not(:disabled) { background: var(--primary-dark); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg-box { font-size: 0.82rem; text-align: center; padding: 0.5rem 0.7rem; border-radius: var(--radius-sm); display: none; }
    .msg-box.error   { background: var(--danger-light);  color: #991b1b; display: block; }
    .msg-box.success { background: var(--success-light); color: #065f46; display: block; }
    .pw-rules { display: none; flex-wrap: wrap; gap: 0.3rem; }
    .pw-rules.show { display: flex; }
    .pw-rule { font-size: 0.7rem; padding: 0.1rem 0.45rem; border-radius: 100px; background: #e2e8f0; color: var(--text-muted); transition: all 0.15s; }
    .pw-rule.pass { background: var(--success-light); color: #065f46; }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-logo">
      <span class="logo-icon">📰</span>
      <h1>기사 작성기</h1>
      <p>AI 기반 기사 작성 플랫폼</p>
    </div>

    <div class="auth-card">
      <div class="auth-tabs">
        <div class="auth-tab active" id="tabLogin" onclick="switchTab('login')">로그인</div>
        <div class="auth-tab" id="tabRegister" onclick="switchTab('register')">회원가입</div>
      </div>

      <div id="msgBox" class="msg-box"></div>

      <!-- 로그인 폼 -->
      <form id="loginForm" class="form-group" onsubmit="doLogin(event)">
        <div class="field">
          <label>이메일</label>
          <input type="email" id="loginEmail" placeholder="example@email.com" required />
        </div>
        <div class="field">
          <label>비밀번호</label>
          <input type="password" id="loginPw" placeholder="비밀번호" required />
        </div>
        <button type="submit" class="btn-submit" id="btnLogin">로그인</button>
      </form>

      <!-- 회원가입 폼 -->
      <form id="registerForm" class="form-group" style="display:none" onsubmit="doRegister(event)">
        <div class="field">
          <label>이름</label>
          <input type="text" id="regName" placeholder="홍길동" required />
        </div>
        <div class="field">
          <label>이메일</label>
          <div class="email-row">
            <input type="email" id="regEmail" placeholder="example@email.com" required oninput="resetEmailCheck()" />
            <button type="button" class="btn-check" onclick="checkEmailDup()">중복확인</button>
          </div>
          <span class="field-hint" id="emailHint"></span>
        </div>
        <div class="field">
          <label>비밀번호</label>
          <input type="password" id="regPw" placeholder="8자 이상" required oninput="updatePwRules()" />
          <div class="pw-rules" id="pwRules">
            <span class="pw-rule" id="r-len">8자 이상</span>
            <span class="pw-rule" id="r-upper">대문자</span>
            <span class="pw-rule" id="r-lower">소문자</span>
            <span class="pw-rule" id="r-num">숫자</span>
          </div>
        </div>
        <div class="field">
          <label>비밀번호 확인</label>
          <input type="password" id="regPwConfirm" placeholder="비밀번호 재입력" required oninput="checkPwMatch()" />
          <span class="field-hint" id="pwHint"></span>
        </div>
        <button type="submit" class="btn-submit" id="btnRegister">회원가입</button>
      </form>
    </div>
  </div>

  <script>
    const API = 'https://erilyjnp21.execute-api.ap-southeast-2.amazonaws.com';
    let emailChecked = false;

    // 이미 로그인 상태면 대시보드로
    if (localStorage.getItem('token')) window.location.href = 'dashboard.html';

    function switchTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('loginForm').style.display    = isLogin ? '' : 'none';
      document.getElementById('registerForm').style.display = isLogin ? 'none' : '';
      document.getElementById('tabLogin').classList.toggle('active', isLogin);
      document.getElementById('tabRegister').classList.toggle('active', !isLogin);
      clearMsg();
    }

    function showMsg(text, type) {
      const el = document.getElementById('msgBox');
      el.textContent = text; el.className = 'msg-box ' + type;
    }
    function clearMsg() {
      const el = document.getElementById('msgBox');
      el.textContent = ''; el.className = 'msg-box';
    }

    // 비밀번호 규칙
    function updatePwRules() {
      const pw = document.getElementById('regPw').value;
      document.getElementById('pwRules').classList.toggle('show', pw.length > 0);
      document.getElementById('r-len').classList.toggle('pass', pw.length >= 8);
      document.getElementById('r-upper').classList.toggle('pass', /[A-Z]/.test(pw));
      document.getElementById('r-lower').classList.toggle('pass', /[a-z]/.test(pw));
      document.getElementById('r-num').classList.toggle('pass', /[0-9]/.test(pw));
      checkPwMatch();
    }

    function checkPwMatch() {
      const pw = document.getElementById('regPw').value;
      const c  = document.getElementById('regPwConfirm').value;
      const hint = document.getElementById('pwHint');
      if (!c) { hint.className = 'field-hint'; hint.textContent = ''; return; }
      if (pw === c) {
        hint.className = 'field-hint ok'; hint.textContent = '비밀번호가 일치합니다.';
      } else {
        hint.className = 'field-hint err'; hint.textContent = '비밀번호가 일치하지 않습니다.';
      }
    }

    // 이메일 중복확인
    function resetEmailCheck() {
      emailChecked = false;
      const hint = document.getElementById('emailHint');
      hint.className = 'field-hint'; hint.textContent = '';
      document.getElementById('regEmail').className = '';
    }

    async function checkEmailDup() {
      const email = document.getElementById('regEmail').value.trim();
      const hint = document.getElementById('emailHint');
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        hint.className = 'field-hint err'; hint.textContent = '올바른 이메일을 입력하세요.'; return;
      }
      try {
        const res = await fetch(API + '/auth/check-email', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const data = await res.json();
        if (data.available) {
          emailChecked = true;
          hint.className = 'field-hint ok'; hint.textContent = '사용 가능한 이메일입니다.';
          document.getElementById('regEmail').className = 'ok';
        } else {
          emailChecked = false;
          hint.className = 'field-hint err'; hint.textContent = '이미 사용 중인 이메일입니다.';
          document.getElementById('regEmail').className = 'err';
        }
      } catch { hint.className = 'field-hint err'; hint.textContent = '확인 중 오류가 발생했습니다.'; }
    }

    // 로그인
    async function doLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      btn.disabled = true; btn.textContent = '로그인 중...';
      try {
        const res = await fetch(API + '/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('loginEmail').value,
            password: document.getElementById('loginPw').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) { showMsg(data.error || '로그인 실패', 'error'); return; }
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = 'dashboard.html';
      } catch { showMsg('서버 연결 오류', 'error'); }
      finally { btn.disabled = false; btn.textContent = '로그인'; }
    }

    // 회원가입
    async function doRegister(e) {
      e.preventDefault();
      if (!emailChecked) { showMsg('이메일 중복확인을 해주세요.', 'error'); return; }
      const pw  = document.getElementById('regPw').value;
      const pw2 = document.getElementById('regPwConfirm').value;
      if (pw !== pw2) { showMsg('비밀번호가 일치하지 않습니다.', 'error'); return; }
      if (pw.length < 8) { showMsg('비밀번호는 8자 이상이어야 합니다.', 'error'); return; }

      const btn = document.getElementById('btnRegister');
      btn.disabled = true; btn.textContent = '처리 중...';
      try {
        const res = await fetch(API + '/auth/register', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('regEmail').value,
            password: pw,
            name: document.getElementById('regName').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) { showMsg(data.error || '회원가입 실패', 'error'); return; }
        showMsg('회원가입 성공! 로그인해주세요.', 'success');
        setTimeout(() => switchTab('login'), 1500);
      } catch { showMsg('서버 연결 오류', 'error'); }
      finally { btn.disabled = false; btn.textContent = '회원가입'; }
    }
  </script>
</body>
</html>
