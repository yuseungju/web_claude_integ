<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 창작 플랫폼</title>
  <link rel="stylesheet" href="assets/css/common.css" />
  <style>
    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: var(--bg); padding: 1rem;
    }
    .landing-wrap { width: 100%; max-width: 520px; text-align: center; }

    .landing-logo { margin-bottom: 2.5rem; }
    .landing-logo .logo-icon { font-size: 2.8rem; display: block; margin-bottom: 0.5rem; }
    .landing-logo h1 {
      font-size: 1.6rem; font-weight: 900; color: var(--primary);
      letter-spacing: -0.5px;
    }
    .landing-logo p { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.35rem; }

    .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem; }

    .menu-card {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 0.75rem; padding: 2rem 1.2rem;
      background: var(--bg-card); border: 2px solid var(--border);
      border-radius: var(--radius-md); box-shadow: var(--shadow-sm);
      text-decoration: none; color: var(--text-primary);
      transition: all 0.18s; cursor: pointer;
    }
    .menu-card:hover {
      border-color: var(--primary); box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }
    .menu-card:hover .menu-icon { transform: scale(1.1); }

    .menu-icon { font-size: 2.4rem; transition: transform 0.18s; }
    .menu-title { font-size: 1.05rem; font-weight: 800; color: var(--text-primary); }
    .menu-desc  { font-size: 0.75rem; color: var(--text-muted); line-height: 1.4; }

    .menu-card.article { border-color: #c7d2fe; }
    .menu-card.article:hover { border-color: var(--primary); background: var(--primary-light); }

    .menu-card.novel { border-color: #fbcfe8; }
    .menu-card.novel:hover { border-color: #db2777; background: #fdf2f8; }
    .menu-card.novel .menu-title { color: #be185d; }
    .menu-card.novel:hover .menu-icon { color: #be185d; }

    .landing-footer {
      font-size: 0.72rem; color: var(--text-muted);
      border-top: 1px solid var(--border); padding-top: 1rem;
    }

    @media (max-width: 400px) {
      .menu-grid { grid-template-columns: 1fr; }
      .menu-card { padding: 1.5rem 1rem; }
    }
  </style>
</head>
<body>
  <div class="landing-wrap">
    <div class="landing-logo">
      <span class="logo-icon">✍️</span>
      <h1>AI 창작 플랫폼</h1>
      <p>기사 작성과 웹소설, 두 가지 창작을 AI와 함께</p>
    </div>

    <div class="menu-grid">
      <a class="menu-card article" href="article/issues.html">
        <span class="menu-icon">📋</span>
        <div class="menu-title">기사 작성</div>
        <div class="menu-desc">이슈 관리 · AI 기사 생성<br>뉴스 제보 및 편집</div>
      </a>
      <a class="menu-card novel" href="novel/novels.html">
        <span class="menu-icon">📖</span>
        <div class="menu-title">웹소설</div>
        <div class="menu-desc">AI 웹소설 집필 · 에피소드 관리<br>장르 소설 창작</div>
      </a>
    </div>

    <div class="landing-footer">
      <a href="mypage.html" style="color:var(--text-muted);text-decoration:none;">마이페이지</a>
      &nbsp;·&nbsp; AI 기반 창작 도구
    </div>
  </div>
</body>
</html>
