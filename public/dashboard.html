<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>대시보드 – 기사 작성기</title>
  <link rel="stylesheet" href="assets/css/common.css" />
  <style>
    .menu-hero { text-align: center; padding: 2.5rem 0 2rem; }
    .menu-hero h2 { font-size: 1.7rem; font-weight: 800; color: var(--text-primary); }
    .menu-hero p  { margin-top: 0.4rem; color: var(--text-secondary); font-size: 0.95rem; }
    .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; max-width: 700px; margin: 0 auto 3rem; }
    @media (max-width: 500px) { .menu-grid { grid-template-columns: 1fr; } }
    .menu-card {
      background: var(--bg-card); border-radius: var(--radius-md);
      padding: 2.5rem 1.5rem; text-align: center;
      border: 1.5px solid var(--border); text-decoration: none;
      color: inherit; display: block; transition: all 0.2s;
      box-shadow: var(--shadow-sm);
    }
    .menu-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 28px rgba(79,70,229,.18);
      border-color: var(--primary);
    }
    .menu-icon { font-size: 3rem; margin-bottom: 1rem; display: block; }
    .menu-name { font-weight: 700; font-size: 1.05rem; color: var(--text-primary); }
    .menu-desc { font-size: 0.82rem; color: var(--text-muted); margin-top: 0.4rem; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="app-wrap">
    <header class="app-header">
      <div class="header-inner">
        <div class="header-left">
          <div class="header-logo">
            <span class="logo-icon">📰</span>
            <span class="logo-text">기사 작성기</span>
          </div>
        </div>
        <div id="headerUser"></div>
      </div>
    </header>

    <main class="container">
      <div class="menu-hero">
        <h2>메뉴 선택</h2>
        <p>사용할 기능을 선택하세요</p>
      </div>
      <div class="menu-grid">
        <a href="articles.html" class="menu-card">
          <span class="menu-icon">📋</span>
          <div class="menu-name">작성한 기사 조회</div>
          <div class="menu-desc">내가 작성한 기사 목록 확인<br>제목 클릭으로 내용 열람</div>
        </a>
        <a href="write.html" class="menu-card">
          <span class="menu-icon">✍️</span>
          <div class="menu-name">기사 신규 작성</div>
          <div class="menu-desc">AI 주제 추천 또는 직접 입력<br>취재 결과 바탕으로 기사 생성</div>
        </a>
      </div>
    </main>

    <footer class="app-footer">
      <p>© 2025 기사 작성기 · Powered by Claude AI</p>
    </footer>
  </div>

  <script src="assets/js/auth.js"></script>
  <script>
    if (!requireAuth()) {}
    else renderHeader('#headerUser');
  </script>
</body>
</html>
