<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>마이페이지 – 뉴스 제보 / 기사 작성</title>
  <link rel="stylesheet" href="assets/css/common.css" />
  <style>
    main.container { max-width: 92%; width: 92%; padding: 1.25rem 1rem; }
    .sc {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-md); box-shadow: var(--shadow-sm);
      padding: 1.25rem 1.5rem; margin-bottom: 1.1rem;
    }
    .sc-title {
      font-size: 0.88rem; font-weight: 800; color: var(--text-primary);
      margin-bottom: 0.9rem; display: flex; align-items: center; gap: 0.4rem;
    }
    .profile-row { display: flex; gap: 1.5rem; flex-wrap: wrap; }
    .profile-field { display: flex; flex-direction: column; gap: 0.22rem; }
    .profile-label { font-size: 0.72rem; font-weight: 600; color: var(--text-muted); }
    .profile-value { font-size: 0.9rem; font-weight: 600; color: var(--text-primary); }

    /* 폴더 */
    .folder-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: .7rem; }
    .btn-new-folder {
      padding: .3rem .75rem; background: var(--primary); color: #fff;
      border: none; border-radius: var(--radius-sm); font-size: .78rem;
      font-weight: 700; cursor: pointer; font-family: var(--font-sans);
      transition: background .15s;
    }
    .btn-new-folder:hover { background: var(--primary-dark); }

    .folder-item {
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      margin-bottom: .55rem; overflow: hidden;
    }
    .folder-row {
      display: flex; align-items: center; gap: .5rem;
      padding: .5rem .85rem; background: #f8fafc; cursor: pointer;
      user-select: none;
    }
    .folder-row:hover { background: #f1f5f9; }
    .folder-name { font-size: .82rem; font-weight: 700; flex: 1; color: var(--text-primary); }
    .folder-count { font-size: .68rem; color: var(--text-muted); }
    .folder-toggle { font-size: .7rem; color: var(--text-muted); transition: transform .15s; }
    .folder-toggle.open { transform: rotate(90deg); }
    .btn-del-folder {
      padding: .14rem .38rem; border: 1px solid #fca5a5; border-radius: 3px;
      font-size: .65rem; color: #dc2626; cursor: pointer; background: none;
      font-family: var(--font-sans); transition: all .12s;
    }
    .btn-del-folder:hover { background: #dc2626; color: #fff; }

    .folder-body { display: none; padding: .5rem .85rem .65rem; background: var(--bg-card); }
    .folder-body.open { display: block; }

    .link-item {
      display: flex; align-items: center; gap: .45rem; padding: .28rem 0;
      border-bottom: 1px solid #f1f5f9; font-size: .78rem;
    }
    .link-item:last-of-type { border-bottom: none; }
    .link-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .link-title a { color: var(--primary); text-decoration: none; }
    .link-title a:hover { text-decoration: underline; }
    .btn-del-link {
      padding: .1rem .3rem; border: 1px solid #fca5a5; border-radius: 3px;
      font-size: .62rem; color: #dc2626; cursor: pointer; background: none;
      font-family: var(--font-sans); transition: all .12s; flex-shrink: 0;
    }
    .btn-del-link:hover { background: #dc2626; color: #fff; }

    .add-link-row {
      display: flex; gap: .3rem; align-items: center; margin-top: .5rem; flex-wrap: wrap;
    }
    .link-input {
      padding: .28rem .55rem; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      font-size: .76rem; font-family: var(--font-sans); outline: none;
      background: var(--bg); color: var(--text-primary); transition: border-color .15s;
    }
    .link-input:focus { border-color: var(--primary); }
    .link-url-in  { flex: 2; min-width: 160px; }
    .link-title-in { flex: 1; min-width: 100px; max-width: 180px; }
    .btn-add-link {
      padding: .28rem .65rem; background: var(--success); color: #fff;
      border: none; border-radius: var(--radius-sm); font-size: .74rem;
      font-weight: 700; cursor: pointer; font-family: var(--font-sans); white-space: nowrap;
      transition: background .12s;
    }
    .btn-add-link:hover { background: #059669; }

    .empty-folder { font-size: .76rem; color: var(--text-muted); padding: .3rem 0; }

    /* 폴더 이름 입력 인라인 */
    .new-folder-row {
      display: flex; gap: .3rem; align-items: center; margin-bottom: .6rem;
    }
    .new-folder-input {
      flex: 1; padding: .3rem .6rem; border: 1.5px solid var(--primary);
      border-radius: var(--radius-sm); font-size: .82rem; font-family: var(--font-sans);
      outline: none; background: #fff; color: var(--text-primary);
    }
    .btn-folder-save {
      padding: .3rem .7rem; background: var(--primary); color: #fff;
      border: none; border-radius: var(--radius-sm); font-size: .78rem;
      font-weight: 700; cursor: pointer; font-family: var(--font-sans);
    }
    .btn-folder-cancel {
      padding: .3rem .6rem; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      background: var(--bg-card); color: var(--text-secondary); font-size: .78rem;
      font-weight: 600; cursor: pointer; font-family: var(--font-sans);
    }

    @media (max-width: 600px) { .sc { padding: 1rem; } }
  </style>
</head>
<body>
  <div class="app-wrap">
    <header class="app-header">
      <div class="header-inner">
        <div class="header-left">
          <a href="index.html" class="back-link">
            <span>←</span>
            <span class="logo-text">홈</span>
          </a>
        </div>
        <div id="headerUser"></div>
      </div>
    </header>

    <main class="container">
      <div class="page-header">
        <a href="index.html" class="back-btn">← 홈으로</a>
        <span class="page-title">마이페이지</span>
      </div>

      <div id="pageContent" style="display:none">

        <!-- 프로필 -->
        <div class="sc">
          <div class="sc-title">👤 프로필</div>
          <div class="profile-row">
            <div class="profile-field">
              <span class="profile-label">이름</span>
              <span class="profile-value" id="profileName">—</span>
            </div>
            <div class="profile-field">
              <span class="profile-label">이메일</span>
              <span class="profile-value" id="profileEmail">—</span>
            </div>
          </div>
        </div>

        <!-- 내 기사 링크 -->
        <div class="sc">
          <div class="sc-title">🔖 내 기사 링크</div>

          <div class="folder-header">
            <span style="font-size:.74rem;color:var(--text-muted)">폴더를 만들고 기사 링크를 저장하세요</span>
            <button class="btn-new-folder" onclick="showNewFolderRow()">+ 폴더 만들기</button>
          </div>

          <div id="newFolderRow" style="display:none" class="new-folder-row">
            <input type="text" id="newFolderName" class="new-folder-input" placeholder="폴더 이름 입력..." maxlength="50" />
            <button class="btn-folder-save" onclick="createFolder()">만들기</button>
            <button class="btn-folder-cancel" onclick="hideNewFolderRow()">취소</button>
          </div>

          <div id="folderList"></div>
        </div>

      </div>
      <div id="loadMsg" style="padding:3rem 1rem;text-align:center;color:var(--text-muted);font-size:.82rem">불러오는 중...</div>
    </main>

    <footer class="app-footer">
      <p>핫이슈 조회 · Powered by 유승주</p>
    </footer>
  </div>
  <div class="toast" id="toast"></div>

  <script src="assets/js/auth.js"></script>
  <script>
    if (!requireAuth()) throw new Error('auth');
    renderHeader('#headerUser');

    let foldersData = [];

    loadMypage();

    async function loadMypage() {
      try {
        const [mpRes, bkRes] = await Promise.all([api('/mypage'), api('/bookmarks')]);
        const mp = await mpRes.json();
        const bk = await bkRes.json();
        document.getElementById('profileName').textContent  = mp.profile?.name  || '—';
        document.getElementById('profileEmail').textContent = mp.profile?.email || '—';
        foldersData = bk.folders || [];
        renderFolders();
        document.getElementById('loadMsg').style.display = 'none';
        document.getElementById('pageContent').style.display = '';
      } catch {
        document.getElementById('loadMsg').textContent = '데이터를 불러오지 못했습니다.';
      }
    }

    function renderFolders() {
      const el = document.getElementById('folderList');
      if (!foldersData.length) {
        el.innerHTML = '<p style="font-size:.78rem;color:var(--text-muted);padding:.3rem 0">아직 폴더가 없습니다.</p>';
        return;
      }
      el.innerHTML = foldersData.map(f => `
        <div class="folder-item" id="folder-${f.id}">
          <div class="folder-row" onclick="toggleFolder(${f.id})">
            <span class="folder-toggle" id="ftog-${f.id}">▶</span>
            <span class="folder-name">📁 ${escHtml(f.name)}</span>
            <span class="folder-count">${f.links.length}개</span>
            <button class="btn-del-folder" onclick="event.stopPropagation();deleteFolder(${f.id})" title="폴더 삭제">🗑</button>
          </div>
          <div class="folder-body" id="fbody-${f.id}">
            ${f.links.length
              ? f.links.map(l => `
                <div class="link-item" id="link-${l.id}">
                  <div class="link-title">
                    <a href="${l.url.replace(/"/g,'&quot;')}" target="_blank" rel="noopener" title="${escHtml(l.url)}">${escHtml(l.title || l.url)}</a>
                  </div>
                  <button class="btn-del-link" onclick="deleteLink(${l.id}, ${f.id})" title="삭제">✕</button>
                </div>`).join('')
              : '<p class="empty-folder">링크가 없습니다.</p>'}
            <div class="add-link-row">
              <input type="url" class="link-input link-url-in" id="lurl-${f.id}" placeholder="https://..." />
              <input type="text" class="link-input link-title-in" id="ltitle-${f.id}" placeholder="제목(선택)" />
              <button class="btn-add-link" onclick="addLink(${f.id})">+ 추가</button>
            </div>
          </div>
        </div>`).join('');
    }

    function toggleFolder(id) {
      const body = document.getElementById(`fbody-${id}`);
      const tog  = document.getElementById(`ftog-${id}`);
      const open = body.classList.toggle('open');
      tog.classList.toggle('open', open);
    }

    function showNewFolderRow() {
      document.getElementById('newFolderRow').style.display = 'flex';
      document.getElementById('newFolderName').focus();
    }
    function hideNewFolderRow() {
      document.getElementById('newFolderRow').style.display = 'none';
      document.getElementById('newFolderName').value = '';
    }

    async function createFolder() {
      const name = document.getElementById('newFolderName').value.trim();
      if (!name) { showToast('폴더 이름을 입력하세요.', 'error'); return; }
      try {
        const res = await api('/bookmarks/folders', { method: 'POST', body: JSON.stringify({ name }) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        foldersData.push(data.folder);
        renderFolders();
        hideNewFolderRow();
        showToast(`"${name}" 폴더가 생성됐습니다.`, 'success');
      } catch (e) { showToast(e.message || '생성 실패', 'error'); }
    }

    async function deleteFolder(id) {
      const f = foldersData.find(x => x.id === id);
      if (!confirm(`"${f?.name}" 폴더와 링크 ${f?.links.length}개를 모두 삭제하시겠습니까?`)) return;
      try {
        const res = await api(`/bookmarks/folders/${id}`, { method: 'DELETE' });
        if (!res.ok) throw new Error();
        foldersData = foldersData.filter(x => x.id !== id);
        renderFolders();
        showToast('폴더가 삭제됐습니다.', 'success');
      } catch { showToast('삭제 실패', 'error'); }
    }

    async function addLink(folderId) {
      const url   = document.getElementById(`lurl-${folderId}`)?.value.trim();
      const title = document.getElementById(`ltitle-${folderId}`)?.value.trim();
      if (!url || !/^https?:\/\//i.test(url)) { showToast('올바른 URL을 입력하세요.', 'error'); return; }
      try {
        const res = await api(`/bookmarks/folders/${folderId}/links`, {
          method: 'POST', body: JSON.stringify({ url, title }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        const folder = foldersData.find(f => f.id === folderId);
        if (folder) folder.links.push(data.link);
        renderFolders();
        // 해당 폴더 펼치기
        const body = document.getElementById(`fbody-${folderId}`);
        const tog  = document.getElementById(`ftog-${folderId}`);
        if (body && !body.classList.contains('open')) { body.classList.add('open'); tog?.classList.add('open'); }
        showToast('링크가 추가됐습니다.', 'success');
      } catch (e) { showToast(e.message || '추가 실패', 'error'); }
    }

    async function deleteLink(linkId, folderId) {
      try {
        const res = await api(`/bookmarks/links/${linkId}`, { method: 'DELETE' });
        if (!res.ok) throw new Error();
        const folder = foldersData.find(f => f.id === folderId);
        if (folder) folder.links = folder.links.filter(l => l.id !== linkId);
        renderFolders();
        const body = document.getElementById(`fbody-${folderId}`);
        const tog  = document.getElementById(`ftog-${folderId}`);
        if (body) { body.classList.add('open'); tog?.classList.add('open'); }
        showToast('링크가 삭제됐습니다.', 'success');
      } catch { showToast('삭제 실패', 'error'); }
    }

    function escHtml(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    let toastTimer;
    function showToast(msg, type = 'info') {
      const el = document.getElementById('toast');
      el.textContent = msg; el.className = `toast ${type} show`;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.className = `toast ${type}`, 2800);
    }

    document.getElementById('newFolderName')?.addEventListener('keydown', e => {
      if (e.key === 'Enter') createFolder();
      if (e.key === 'Escape') hideNewFolderRow();
    });
  </script>
</body>
</html>
