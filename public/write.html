<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>기사 작성 – 기사 작성기</title>
  <link rel="stylesheet" href="assets/css/common.css" />
  <style>
    .write-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; align-items: start; }
    @media (max-width: 900px) { .write-layout { grid-template-columns: 1fr; } }

    .section-label {
      font-size: 0.78rem; font-weight: 700; color: var(--text-secondary);
      text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.5rem;
    }
    .title-input {
      width: 100%; padding: 0.75rem 1rem; border: 1.5px solid var(--border);
      border-radius: var(--radius-md); font-size: 1rem; font-weight: 600;
      font-family: var(--font-sans); outline: none; background: var(--bg-card);
      color: var(--text-primary); transition: border-color 0.15s; margin-bottom: 1.25rem;
    }
    .title-input:focus { border-color: var(--primary); }
    .title-input::placeholder { font-weight: 400; color: var(--text-muted); }

    .input-sections { display: flex; flex-direction: column; gap: 1rem; }
    .input-section { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; }
    .section-header {
      padding: 0.65rem 1rem; background: var(--bg);
      border-bottom: 1px solid var(--border);
      font-size: 0.82rem; font-weight: 700; color: var(--text-secondary);
      display: flex; align-items: center; gap: 0.4rem;
    }
    .section-textarea {
      width: 100%; padding: 0.85rem 1rem; border: none; outline: none;
      font-size: 0.88rem; font-family: var(--font-sans);
      color: var(--text-primary); background: var(--bg-card);
      resize: vertical; min-height: 100px; line-height: 1.7;
    }
    .section-textarea::placeholder { color: var(--text-muted); }

    /* 이미지 붙여넣기 */
    .image-zone {
      min-height: 100px; padding: 0.85rem 1rem;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 0.4rem;
      cursor: pointer; color: var(--text-muted); font-size: 0.85rem;
      outline: none;
    }
    .image-zone:focus, .image-zone:hover { background: var(--primary-light); }
    .image-zone.has-image { padding: 0; }
    .image-preview { max-width: 100%; max-height: 200px; display: block; object-fit: contain; }

    .action-btns { display: flex; gap: 0.6rem; margin-top: 1.25rem; }
    .btn-gen {
      flex: 1; padding: 0.8rem; background: var(--primary); color: #fff;
      border: none; border-radius: var(--radius-md);
      font-size: 0.92rem; font-weight: 700; cursor: pointer; transition: background 0.15s;
    }
    .btn-gen:hover:not(:disabled) { background: var(--primary-dark); }
    .btn-gen:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-save {
      padding: 0.8rem 1.5rem; border: 1.5px solid var(--primary);
      background: #fff; color: var(--primary); border-radius: var(--radius-md);
      font-size: 0.92rem; font-weight: 700; cursor: pointer; transition: all 0.15s;
    }
    .btn-save:hover:not(:disabled) { background: var(--primary); color: #fff; }
    .btn-save:disabled { opacity: 0.6; cursor: not-allowed; }

    /* 결과 패널 */
    .result-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); min-height: 500px; display: flex; flex-direction: column; }
    .result-header { padding: 0.85rem 1.1rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .result-title { font-weight: 700; font-size: 0.92rem; }
    .result-meta  { font-size: 0.75rem; color: var(--text-muted); }
    .btn-copy {
      padding: 0.28rem 0.75rem; border: 1.5px solid var(--border);
      background: var(--bg); border-radius: var(--radius-sm);
      font-size: 0.75rem; font-weight: 600; cursor: pointer;
      color: var(--text-secondary); transition: all 0.15s;
    }
    .btn-copy:hover { border-color: var(--primary); color: var(--primary); }
    .btn-copy:disabled { opacity: 0.4; cursor: not-allowed; }

    .result-body { flex: 1; padding: 1.25rem; font-size: 0.92rem; line-height: 1.85; white-space: pre-wrap; overflow-y: auto; }
    .result-body.empty { display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 0.6rem; color: var(--text-muted); font-size: 0.88rem; }
    .result-body .empty-icon { font-size: 2.5rem; }
    .cursor { display: inline-block; width: 2px; height: 1em; background: var(--primary); margin-left: 1px; animation: blink 0.8s step-end infinite; vertical-align: text-bottom; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>
  <div class="app-wrap">
    <header class="app-header">
      <div class="header-inner">
        <div class="header-left">
          <div class="header-logo">
            <span class="logo-icon">📰</span>
            <span class="logo-text">기사 작성기</span>
          </div>
        </div>
        <div id="headerUser"></div>
      </div>
    </header>

    <main class="container">
      <div class="page-header">
        <a href="articles.html" class="back-btn">← 목록</a>
        <h1 class="page-title" id="pageTitle">✍️ 기사 작성</h1>
      </div>

      <div class="write-layout">
        <!-- 입력 패널 -->
        <div>
          <div class="section-label">제목</div>
          <input type="text" id="titleInput" class="title-input" placeholder="기사 제목을 입력하세요" />

          <div class="input-sections">
            <div class="input-section">
              <div class="section-header">📝 취재 결과</div>
              <textarea class="section-textarea" id="investigation" rows="5" placeholder="취재한 내용, 인터뷰, 현장 정보 등을 입력하세요"></textarea>
            </div>
            <div class="input-section">
              <div class="section-header">🖼️ 이미지</div>
              <div class="image-zone" id="imageZone" tabindex="0"
                onclick="document.getElementById('imageFile').click()">
                <span>클릭하거나 이미지를 붙여넣으세요 (Ctrl+V)</span>
                <span style="font-size:0.75rem">JPG, PNG, GIF 지원</span>
              </div>
              <input type="file" id="imageFile" accept="image/*" style="display:none" onchange="handleImageFile(this)" />
            </div>
            <div class="input-section">
              <div class="section-header">📎 추가 자료</div>
              <textarea class="section-textarea" id="additionalInfo" rows="4" placeholder="참고 자료, 통계, 배경 정보 등을 입력하세요"></textarea>
            </div>
          </div>

          <div class="action-btns">
            <button class="btn-gen" id="btnGenerate" onclick="generateArticle()">✨ 기사 생성</button>
            <button class="btn-save" id="btnSave" onclick="saveArticle()">💾 저장</button>
          </div>
        </div>

        <!-- 결과 패널 -->
        <div class="result-card">
          <div class="result-header">
            <span class="result-title">생성된 기사</span>
            <div style="display:flex;align-items:center;gap:0.6rem">
              <span class="result-meta" id="resultMeta"></span>
              <button class="btn-copy" id="btnCopy" onclick="copyArticle()" disabled>복사</button>
            </div>
          </div>
          <div class="result-body empty" id="resultBody">
            <span class="empty-icon">📄</span>
            <span>취재 결과를 입력하고 기사 생성을 누르세요</span>
          </div>
        </div>
      </div>
    </main>

    <footer class="app-footer">
      <p>© 2025 기사 작성기 · Powered by Claude AI</p>
    </footer>
  </div>

  <div class="toast" id="toast"></div>

  <script src="assets/js/auth.js"></script>
  <script>
    let articleId   = null;
    let imageData   = null;
    let generatedArticle = '';

    if (!requireAuth()) {}
    else {
      renderHeader('#headerUser');
      init();
    }

    function init() {
      const params = new URLSearchParams(location.search);
      articleId = params.get('id');
      if (articleId) loadArticle(articleId);

      // 이미지 붙여넣기
      document.addEventListener('paste', (e) => {
        for (const item of e.clipboardData.items) {
          if (item.type.startsWith('image/')) {
            const file = item.getAsFile();
            readImage(file);
            break;
          }
        }
      });
    }

    async function loadArticle(id) {
      try {
        const res = await api('/articles/' + id);
        if (!res.ok) return;
        const { article } = await res.json();
        document.getElementById('titleInput').value       = article.title || '';
        document.getElementById('investigation').value    = article.investigation || '';
        document.getElementById('additionalInfo').value   = article.additional_info || '';
        if (article.image_data) {
          imageData = article.image_data;
          showImagePreview(article.image_data);
        }
        if (article.generated_article) {
          generatedArticle = article.generated_article;
          showResult(article.generated_article);
        }
        document.getElementById('pageTitle').textContent = '✍️ 기사 편집';
      } catch {}
    }

    // 이미지 처리
    function handleImageFile(input) {
      if (input.files[0]) readImage(input.files[0]);
    }

    function readImage(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        imageData = e.target.result;
        showImagePreview(imageData);
      };
      reader.readAsDataURL(file);
    }

    function showImagePreview(src) {
      const zone = document.getElementById('imageZone');
      zone.innerHTML = `<img src="${src}" class="image-preview" alt="첨부 이미지" />`;
      zone.classList.add('has-image');
    }

    // 기사 생성
    async function generateArticle() {
      const title = document.getElementById('titleInput').value.trim();
      if (!title) { showToast('제목을 입력해주세요.', 'error'); return; }

      const btn = document.getElementById('btnGenerate');
      btn.disabled = true; btn.textContent = '⏳ 생성 중...';

      const resultBody = document.getElementById('resultBody');
      resultBody.className = 'result-body';
      resultBody.textContent = '';
      let cursorEl = document.createElement('span');
      cursorEl.className = 'cursor';
      resultBody.appendChild(cursorEl);

      generatedArticle = '';
      let startTime = Date.now();

      try {
        const res = await api('/generate', {
          method: 'POST',
          body: JSON.stringify({
            title,
            investigation: document.getElementById('investigation').value,
            additional_info: document.getElementById('additionalInfo').value,
          }),
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        generatedArticle = data.article;
        const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
        showResult(generatedArticle, elapsed);
      } catch (e) {
        resultBody.className = 'result-body empty';
        resultBody.innerHTML = `<span class="empty-icon">⚠️</span><span>${e.message}</span>`;
        showToast('기사 생성 실패', 'error');
      } finally {
        btn.disabled = false; btn.textContent = '✨ 기사 생성';
      }
    }

    function showResult(text, elapsed) {
      const body = document.getElementById('resultBody');
      body.className = 'result-body';
      body.textContent = text;
      document.getElementById('resultMeta').textContent =
        `${text.length.toLocaleString()}자${elapsed ? ` · ${elapsed}초` : ''}`;
      document.getElementById('btnCopy').disabled = false;
    }

    // 저장
    async function saveArticle() {
      const title = document.getElementById('titleInput').value.trim();
      if (!title) { showToast('제목을 입력해주세요.', 'error'); return; }

      const btn = document.getElementById('btnSave');
      btn.disabled = true; btn.textContent = '저장 중...';

      try {
        const res = await api('/articles/save', {
          method: 'POST',
          body: JSON.stringify({
            id: articleId ? Number(articleId) : undefined,
            title,
            investigation: document.getElementById('investigation').value,
            image_data: imageData,
            additional_info: document.getElementById('additionalInfo').value,
            generated_article: generatedArticle,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        if (!articleId) {
          articleId = data.id;
          history.replaceState({}, '', `write.html?id=${articleId}`);
        }
        showToast('저장됐습니다.', 'success');
      } catch (e) {
        showToast(e.message || '저장 실패', 'error');
      } finally {
        btn.disabled = false; btn.textContent = '💾 저장';
      }
    }

    // 복사
    async function copyArticle() {
      try {
        await navigator.clipboard.writeText(generatedArticle);
        showToast('클립보드에 복사됐습니다.', 'success');
      } catch { showToast('복사 실패', 'error'); }
    }

    let toastTimer;
    function showToast(msg, type = 'info') {
      const el = document.getElementById('toast');
      el.textContent = msg; el.className = `toast ${type} show`;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.className = `toast ${type}`, 2800);
    }
  </script>
</body>
</html>
