<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>이슈 작성 – 이슈보드</title>
  <link rel="stylesheet" href="assets/css/common.css" />
  <style>
    .issue-header {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 1rem 1.25rem;
      margin-bottom: 1.25rem; display: flex; align-items: center; gap: 0.75rem;
    }
    .title-field {
      flex: 1; padding: 0.6rem 0.9rem; border: 1.5px solid var(--border);
      border-radius: var(--radius-sm); font-size: 1rem; font-weight: 700;
      font-family: var(--font-sans); outline: none; background: var(--bg);
      color: var(--text-primary); transition: border-color 0.15s;
    }
    .title-field:focus { border-color: var(--primary); background: #fff; }
    .title-field:read-only { background: var(--bg); color: var(--text-primary); cursor: default; border-color: transparent; }
    .title-field::placeholder { font-weight: 400; color: var(--text-muted); }
    .title-meta { font-size: 0.78rem; color: var(--text-muted); white-space: nowrap; }

    .sections-wrap { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.25rem; }
    .section-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; }
    .section-label {
      padding: 0.55rem 1rem; background: var(--bg); border-bottom: 1px solid var(--border);
      font-size: 0.78rem; font-weight: 700; color: var(--text-secondary);
      display: flex; align-items: center; gap: 0.4rem; user-select: none;
    }
    .section-num {
      display: inline-flex; align-items: center; justify-content: center;
      width: 1.3rem; height: 1.3rem; background: var(--primary); color: #fff;
      border-radius: 50%; font-size: 0.7rem; font-weight: 800; flex-shrink: 0;
    }
    .section-textarea {
      width: 100%; padding: 0.85rem 1rem; border: none; outline: none;
      font-size: 0.88rem; font-family: var(--font-sans);
      color: var(--text-primary); background: var(--bg-card);
      resize: vertical; min-height: 110px; line-height: 1.75;
    }
    .section-textarea::placeholder { color: var(--text-muted); }
    .section-textarea:read-only { background: var(--bg); cursor: default; }

    /* 액션 버튼 영역 */
    .action-bar {
      display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem;
    }
    .btn {
      padding: 0.6rem 1.1rem; border-radius: var(--radius-sm);
      font-size: 0.86rem; font-weight: 700; cursor: pointer;
      border: 1.5px solid var(--border); background: var(--bg-card);
      color: var(--text-secondary); transition: all 0.15s; font-family: var(--font-sans);
    }
    .btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
    .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn.primary:hover:not(:disabled) { background: var(--primary-dark); border-color: var(--primary-dark); }
    .btn.ai { background: #7c3aed; border-color: #7c3aed; color: #fff; }
    .btn.ai:hover:not(:disabled) { background: #6d28d9; border-color: #6d28d9; }
    .btn.danger { background: #fff; border-color: var(--danger); color: var(--danger); }
    .btn.danger:hover:not(:disabled) { background: var(--danger); color: #fff; }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-spacer { flex: 1; }

    /* AI 결과 패널 */
    .ai-result {
      background: var(--bg-card); border: 1.5px solid #7c3aed33;
      border-radius: var(--radius-md); overflow: hidden;
    }
    .ai-result-header {
      padding: 0.65rem 1rem; background: #f5f3ff;
      border-bottom: 1px solid #7c3aed22;
      display: flex; align-items: center; justify-content: space-between;
      font-size: 0.82rem; font-weight: 700; color: #5b21b6;
    }
    .ai-result-body {
      padding: 1.25rem; font-size: 0.9rem; line-height: 1.9;
      white-space: pre-wrap; color: var(--text-primary); min-height: 120px;
    }
    .ai-result-body.empty {
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); font-size: 0.85rem; min-height: 100px;
    }
    .btn-copy-ai {
      padding: 0.2rem 0.65rem; border: 1px solid #7c3aed44;
      background: #fff; border-radius: var(--radius-sm);
      font-size: 0.73rem; font-weight: 600; cursor: pointer;
      color: #7c3aed; transition: all 0.15s;
    }
    .btn-copy-ai:hover { background: #7c3aed; color: #fff; }
    .btn-copy-ai:disabled { opacity: 0.4; cursor: not-allowed; }

    .readonly-notice {
      display: inline-block; font-size: 0.75rem; padding: 0.2rem 0.6rem;
      background: var(--warning-light); color: #92400e; border-radius: 100px;
      font-weight: 600; margin-left: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="app-wrap">
    <header class="app-header">
      <div class="header-inner">
        <div class="header-left">
          <div class="header-logo">
            <a href="issues.html" class="back-link">
              <span class="logo-icon">📋</span>
              <span class="logo-text">이슈보드</span>
            </a>
          </div>
        </div>
        <div id="headerUser"></div>
      </div>
    </header>

    <main class="container">
      <div class="page-header">
        <a href="issues.html" class="back-btn">← 목록</a>
        <h1 class="page-title" id="pageTitle">이슈 작성</h1>
      </div>

      <!-- 제목 -->
      <div class="issue-header">
        <input type="text" id="titleInput" class="title-field" placeholder="이슈 제목을 입력하세요" maxlength="200" />
        <span class="title-meta" id="titleMeta"></span>
      </div>

      <!-- 5개 섹션 -->
      <div class="sections-wrap" id="sectionsWrap">
        <!-- JS로 렌더링 -->
      </div>

      <!-- 액션 바 -->
      <div class="action-bar" id="actionBar" style="display:none">
        <button class="btn ai" id="btnGenerate" onclick="generateArticle()">✨ AI로 관련 글 정리하기</button>
        <button class="btn" id="btnTempSave" onclick="tempSave()">📌 임시저장</button>
        <div class="btn-spacer"></div>
        <button class="btn" onclick="location.href='issues.html'">취소</button>
        <button class="btn primary" id="btnSave" onclick="saveIssue()">💾 저장</button>
      </div>
      <div id="readonlyBar" style="display:none; margin-bottom:1.5rem">
        <a href="issues.html" class="btn" style="text-decoration:none">← 목록으로</a>
        <button class="btn ai" id="btnGenerateRO" onclick="generateArticle()" style="margin-left:0.5rem">✨ AI로 관련 글 정리하기</button>
      </div>

      <!-- AI 결과 -->
      <div class="ai-result" id="aiResult" style="display:none">
        <div class="ai-result-header">
          <span>✨ AI 정리 결과</span>
          <button class="btn-copy-ai" id="btnCopyAI" onclick="copyAI()" disabled>복사</button>
        </div>
        <div class="ai-result-body empty" id="aiBody">
          AI 정리하기 버튼을 눌러 기사를 생성하세요.
        </div>
      </div>
    </main>

    <footer class="app-footer">
      <p>© 2025 이슈보드 · Powered by Claude AI</p>
    </footer>
  </div>

  <div class="toast" id="toast"></div>

  <script src="assets/js/auth.js"></script>
  <script>
    const SECTION_LABELS = ['배경 / 발단', '주요 내용', '인터뷰 / 현장', '관련 자료', '결론 / 전망'];
    const SECTION_HINTS  = [
      '이슈가 발생한 배경과 발단을 입력하세요',
      '핵심 사건이나 주요 내용을 입력하세요',
      '현장 취재, 인터뷰 내용을 입력하세요',
      '통계, 참고자료, 관련 데이터를 입력하세요',
      '결론, 전망, 향후 계획을 입력하세요',
    ];

    let issueId   = null;
    let isAuthor  = false;
    let aiArticle = '';

    if (!requireAuth()) { /* redirected */ }
    else {
      renderHeader('#headerUser');
      init();
    }

    function init() {
      const params = new URLSearchParams(location.search);
      issueId = params.get('id');
      renderSections(isAuthor);
      if (issueId) loadIssue(issueId);
      else {
        isAuthor = true;
        renderSections(true);
        document.getElementById('actionBar').style.display = 'flex';
        document.getElementById('pageTitle').textContent = '새 이슈';
        loadCookie();
      }
    }

    function renderSections(editable) {
      document.getElementById('sectionsWrap').innerHTML = SECTION_LABELS.map((label, i) => `
        <div class="section-card">
          <div class="section-label">
            <span class="section-num">${i + 1}</span>${label}
          </div>
          <textarea id="sec${i+1}" class="section-textarea"
            placeholder="${SECTION_HINTS[i]}" rows="4"
            ${editable ? '' : 'readonly'}></textarea>
        </div>`).join('');
    }

    async function loadIssue(id) {
      try {
        const res = await api('/issues/' + id);
        if (!res.ok) throw new Error();
        const { issue, sections } = await res.json();

        document.getElementById('titleInput').value = issue.title || '';
        document.getElementById('titleMeta').textContent = `작성자: ${issue.author}`;

        const currentUser = getUser();
        isAuthor = currentUser && issue.user_id === currentUser.id;

        renderSections(isAuthor);
        sections.forEach((s, i) => {
          document.getElementById(`sec${i+1}`).value = s;
        });

        document.getElementById('titleInput').readOnly = !isAuthor;

        if (isAuthor) {
          document.getElementById('actionBar').style.display = 'flex';
          document.getElementById('pageTitle').textContent = '이슈 편집';
          loadCookie();
        } else {
          document.getElementById('readonlyBar').style.display = 'block';
          document.getElementById('pageTitle').innerHTML =
            '이슈 보기 <span class="readonly-notice">읽기 전용</span>';
        }
      } catch {
        showToast('이슈를 불러오지 못했습니다.', 'error');
      }
    }

    function getSections() {
      return [1,2,3,4,5].map(i => document.getElementById(`sec${i}`)?.value || '');
    }

    // 임시저장 (쿠키)
    function tempSave() {
      if (!issueId) { showToast('먼저 저장하세요.', 'error'); return; }
      const data = { title: document.getElementById('titleInput').value, sections: getSections() };
      document.cookie = `draft_${issueId}=${encodeURIComponent(JSON.stringify(data))};max-age=86400;path=/`;
      showToast('임시저장됐습니다.', 'info');
    }

    function loadCookie() {
      if (!issueId) return false;
      const match = document.cookie.match(new RegExp(`draft_${issueId}=([^;]+)`));
      if (!match) return false;
      try {
        const data = JSON.parse(decodeURIComponent(match[1]));
        if (data.title) document.getElementById('titleInput').value = data.title;
        data.sections?.forEach((s, i) => {
          const el = document.getElementById(`sec${i+1}`);
          if (el && s) el.value = s;
        });
        showToast('임시저장된 내용을 불러왔습니다.', 'info');
        return true;
      } catch { return false; }
    }

    function clearCookie() {
      if (issueId) document.cookie = `draft_${issueId}=;max-age=0;path=/`;
    }

    // 저장
    async function saveIssue() {
      const title = document.getElementById('titleInput').value.trim();
      if (!title) { showToast('제목을 입력하세요.', 'error'); return; }

      const btn = document.getElementById('btnSave');
      btn.disabled = true; btn.textContent = '저장 중...';

      try {
        // 신규 이슈면 먼저 생성
        if (!issueId) {
          const res = await api('/issues', { method: 'POST', body: JSON.stringify({ title }) });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error);
          issueId = data.issue.id;
          history.replaceState({}, '', `write.html?id=${issueId}`);
        } else {
          // 제목 업데이트
          await api(`/issues/${issueId}`, { method: 'PUT', body: JSON.stringify({ title }) });
        }

        // 섹션 저장
        const res2 = await api(`/issues/${issueId}/sections`, {
          method: 'POST',
          body: JSON.stringify({ sections: getSections(), is_draft: false }),
        });
        const data2 = await res2.json();
        if (!res2.ok) throw new Error(data2.error);

        clearCookie();
        showToast('저장됐습니다.', 'success');
      } catch (e) {
        showToast(e.message || '저장 실패', 'error');
      } finally {
        btn.disabled = false; btn.textContent = '💾 저장';
      }
    }

    // AI 기사 생성
    async function generateArticle() {
      const title = document.getElementById('titleInput').value.trim();
      if (!title) { showToast('제목을 입력하세요.', 'error'); return; }

      const btnIds = ['btnGenerate', 'btnGenerateRO'];
      btnIds.forEach(id => {
        const el = document.getElementById(id);
        if (el) { el.disabled = true; el.textContent = '⏳ AI 정리 중...'; }
      });

      document.getElementById('aiResult').style.display = 'block';
      document.getElementById('aiBody').className = 'ai-result-body empty';
      document.getElementById('aiBody').textContent = 'AI가 글을 정리하고 있습니다...';
      document.getElementById('btnCopyAI').disabled = true;

      try {
        const res = await api('/generate', {
          method: 'POST',
          body: JSON.stringify({ title, sections: getSections() }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        aiArticle = data.article;
        document.getElementById('aiBody').className = 'ai-result-body';
        document.getElementById('aiBody').textContent = aiArticle;
        document.getElementById('btnCopyAI').disabled = false;
        document.getElementById('aiResult').scrollIntoView({ behavior: 'smooth', block: 'start' });
      } catch (e) {
        document.getElementById('aiBody').className = 'ai-result-body empty';
        document.getElementById('aiBody').textContent = '생성 실패: ' + e.message;
        showToast('AI 정리 실패', 'error');
      } finally {
        btnIds.forEach(id => {
          const el = document.getElementById(id);
          if (el) { el.disabled = false; el.textContent = '✨ AI로 관련 글 정리하기'; }
        });
      }
    }

    async function copyAI() {
      try {
        await navigator.clipboard.writeText(aiArticle);
        showToast('클립보드에 복사됐습니다.', 'success');
      } catch { showToast('복사 실패', 'error'); }
    }

    let toastTimer;
    function showToast(msg, type = 'info') {
      const el = document.getElementById('toast');
      el.textContent = msg; el.className = `toast ${type} show`;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.className = `toast ${type}`, 2800);
    }
  </script>
</body>
</html>
