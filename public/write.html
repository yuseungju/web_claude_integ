<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>이슈 – 이슈보드</title>
  <link rel="stylesheet" href="assets/css/common.css" />
  <style>
    /* ── 페이지 너비 ── */
    main.container { max-width: 92%; width: 92%; padding: 1.25rem 1rem; }

    /* ── 공통 버튼 ── */
    .btn {
      padding: 0.55rem 1rem; border-radius: var(--radius-sm); font-size: 0.84rem;
      font-weight: 700; cursor: pointer; border: 1.5px solid var(--border);
      background: var(--bg-card); color: var(--text-secondary);
      transition: all 0.15s; font-family: var(--font-sans); white-space: nowrap;
    }
    .btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
    .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn.primary:hover:not(:disabled) { background: var(--primary-dark); }
    .btn.ai { background: #7c3aed; border-color: #7c3aed; color: #fff; }
    .btn.ai:hover:not(:disabled) { background: #6d28d9; }
    .btn.success { background: var(--success); border-color: var(--success); color: #fff; }
    .btn.success:hover:not(:disabled) { background: #059669; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── 이슈 헤더 ── */
    .issue-meta {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 0.9rem 1.1rem;
      margin-bottom: 1rem; display: flex; align-items: flex-start;
      justify-content: space-between; gap: 0.75rem; flex-wrap: wrap;
    }
    .issue-title-view {
      font-size: 0.98rem; font-weight: 800; color: var(--text-primary);
      line-height: 1.4; flex: 1;
    }
    .issue-title-input {
      flex: 1; padding: 0.5rem 0.8rem; border: 1.5px solid var(--primary);
      border-radius: var(--radius-sm); font-size: 1rem; font-weight: 700;
      font-family: var(--font-sans); outline: none; background: #fff;
      color: var(--text-primary); width: 100%;
    }
    .issue-sub { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.3rem; }

    /* ── 섹션 카드 ── */
    .sections-wrap { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 1.1rem; }
    .section-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); overflow: visible; }
    .section-label {
      padding: 0.5rem 0.9rem; background: #f8fafc; border-bottom: 1px solid var(--border);
      font-size: 0.75rem; font-weight: 700; color: var(--text-secondary);
      display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap; min-height: 2.2rem;
    }
    .sec-num {
      display: inline-flex; align-items: center; justify-content: center;
      width: 1.2rem; height: 1.2rem; background: var(--primary); color: #fff;
      border-radius: 50%; font-size: 0.65rem; font-weight: 800; flex-shrink: 0;
    }
    .sec-name { flex: 1; }

    /* 섹션 본문 – 조회 */
    .section-body-view {
      padding: 0.9rem 1rem; font-size: 0.88rem; line-height: 1.8;
      color: var(--text-primary); white-space: pre-wrap; min-height: 60px;
    }
    .section-body-view.empty { color: var(--text-muted); font-style: italic; }

    /* 섹션 본문 – 편집 */
    .section-textarea {
      width: 100%; padding: 0.8rem 1rem; border: none; outline: none;
      font-size: 0.88rem; font-family: var(--font-sans);
      color: var(--text-primary); background: var(--bg-card);
      resize: vertical; min-height: 100px; line-height: 1.75;
    }
    .section-textarea::placeholder { color: var(--text-muted); }
    .section-textarea[readonly] { background: #f8fafc; cursor: default; }

    /* 편집자 지정 UI */
    .editor-zone { margin-left: auto; display: flex; align-items: center; gap: 0.35rem; flex-wrap: wrap; }
    .editor-chip {
      font-size: 0.67rem; padding: 0.1rem 0.45rem; border-radius: 100px; font-weight: 600;
      background: var(--primary-light); color: var(--primary); display: flex; align-items: center; gap: 0.25rem;
    }
    .editor-chip.none { background: #f1f5f9; color: var(--text-muted); }
    .btn-ed {
      font-size: 0.67rem; padding: 0.1rem 0.42rem; border-radius: 3px;
      border: 1px solid var(--border); background: var(--bg-card); cursor: pointer;
      color: var(--text-secondary); font-family: var(--font-sans); transition: all 0.12s;
    }
    .btn-ed:hover { border-color: var(--primary); color: var(--primary); }
    .btn-ed.del-ed { border-color: #fca5a5; color: #dc2626; }
    .btn-ed.del-ed:hover { background: #dc2626; color: #fff; }
    .editor-form {
      padding: 0.5rem 0.9rem; background: #eef2ff; border-top: 1px solid #c7d2fe;
      display: none; align-items: center; gap: 0.4rem; flex-wrap: wrap;
    }
    .editor-form.open { display: flex; }
    .editor-email-in {
      flex: 1; min-width: 160px; padding: 0.35rem 0.6rem;
      border: 1.5px solid var(--primary); border-radius: var(--radius-sm);
      font-size: 0.8rem; font-family: var(--font-sans); outline: none;
    }
    .btn-assign {
      padding: 0.33rem 0.75rem; background: var(--primary); color: #fff;
      border: none; border-radius: var(--radius-sm); font-size: 0.78rem;
      font-weight: 700; cursor: pointer; font-family: var(--font-sans);
    }
    .btn-assign:hover { background: var(--primary-dark); }
    .btn-cancel-ed {
      padding: 0.33rem 0.6rem; background: var(--bg-card); color: var(--text-secondary);
      border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      font-size: 0.78rem; font-weight: 600; cursor: pointer; font-family: var(--font-sans);
    }

    .my-sec-badge {
      font-size: 0.64rem; padding: 0.08rem 0.4rem; border-radius: 100px;
      background: #d1fae5; color: #065f46; font-weight: 700;
    }

    /* ── 액션바 ── */
    .action-bar { display: flex; gap: 0.45rem; flex-wrap: wrap; margin-bottom: 1.25rem; align-items: center; }
    .btn-spacer { flex: 1; }

    /* ── 기사 본문 패널 ── */
    .ai-panel {
      background: var(--bg-card); border: 1.5px solid #c4b5fd;
      border-radius: var(--radius-md); overflow: hidden; margin-bottom: 1.25rem;
    }
    .ai-panel-header {
      padding: 0.55rem 1rem; background: #f5f3ff; border-bottom: 1px solid #ddd6fe;
      display: flex; align-items: center; justify-content: space-between;
      font-size: 0.8rem; font-weight: 700; color: #5b21b6; gap: 0.4rem; flex-wrap: wrap;
    }
    .ai-panel-acts { display: flex; gap: 0.35rem; align-items: center; flex-wrap: wrap; }
    .ai-panel-body {
      width: 100%; padding: 1.1rem; font-size: 0.88rem; line-height: 1.9;
      color: var(--text-primary); min-height: 180px; border: none; outline: none;
      font-family: var(--font-sans); resize: vertical; background: var(--bg-card);
      display: block;
    }
    .ai-panel-body::placeholder { color: var(--text-muted); font-style: italic; }
    .ai-panel-body[readonly] {
      background: #fafafa; cursor: default;
      color: var(--text-primary); font-size: 0.92rem; line-height: 2;
    }
    .btn-panel-sm {
      padding: 0.2rem 0.6rem; border: 1px solid #c4b5fd; background: #fff;
      border-radius: var(--radius-sm); font-size: 0.7rem; font-weight: 600;
      cursor: pointer; color: #7c3aed; transition: all 0.15s; font-family: var(--font-sans);
    }
    .btn-panel-sm:hover:not(:disabled) { background: #7c3aed; color: #fff; }
    .btn-panel-sm:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-panel-sm.import { border-color: #a7f3d0; color: #065f46; background: #fff; }
    .btn-panel-sm.import:hover { background: #10b981; color: #fff; border-color: #10b981; }

    /* ── 기사 조회 뷰 ── */
    .ai-panel.view-mode {
      border-color: var(--border);
      border-width: 1px;
    }
    .ai-panel.view-mode .ai-panel-header {
      background: var(--bg-card);
      border-bottom-color: var(--border);
      color: var(--text-secondary);
      font-size: 0.75rem;
      font-weight: 600;
    }
    .article-view-body {
      padding: 1.5rem 1.75rem 2rem;
      font-size: 1rem;
      line-height: 2.1;
      color: var(--text-primary);
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ── 참고자료 패널 ── */
    .ref-panel {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 0.7rem 1rem;
      margin-bottom: 1rem; box-shadow: var(--shadow-sm);
    }
    .ref-panel-title {
      font-size: 0.73rem; font-weight: 700; color: var(--text-secondary);
      margin-bottom: 0.45rem; display: flex; align-items: center; gap: 0.3rem;
    }
    .ref-list {
      list-style: none; display: flex; flex-direction: column; gap: 0.18rem;
      max-height: 200px; overflow-y: auto;
    }
    .ref-list li { display: flex; align-items: baseline; gap: 0.3rem; }
    .ref-list li::before {
      content: '•'; color: var(--text-muted); font-size: 0.65rem; flex-shrink: 0;
    }
    .ref-list a {
      font-size: 0.75rem; color: var(--primary); text-decoration: none;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      flex: 1; min-width: 0; transition: opacity 0.12s;
    }
    .ref-list a:hover { text-decoration: underline; opacity: 0.75; }

    /* ── 댓글 섹션 ── */
    .comments-section {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 1.1rem 1.25rem;
      margin-bottom: 1.25rem; box-shadow: var(--shadow-sm);
    }
    .comments-header {
      font-size: 0.88rem; font-weight: 800; color: var(--text-primary);
      margin-bottom: 1rem; display: flex; align-items: center; gap: 0.4rem;
      padding-bottom: 0.65rem; border-bottom: 1px solid var(--border);
    }
    .comment-count-badge {
      font-size: 0.7rem; padding: 0.06rem 0.4rem; border-radius: 100px;
      background: var(--primary-light); color: var(--primary); font-weight: 700;
    }
    .comment-item {
      padding: 0.78rem 0; border-bottom: 1px solid #f1f5f9;
    }
    .comment-item:last-child { border-bottom: none; padding-bottom: 0; }
    .comment-meta {
      display: flex; align-items: center; gap: 0.45rem; margin-bottom: 0.3rem;
    }
    .comment-author { font-size: 0.78rem; font-weight: 700; color: var(--text-primary); }
    .comment-date   { font-size: 0.68rem; color: var(--text-muted); }
    .comment-body {
      font-size: 0.85rem; line-height: 1.7; color: var(--text-primary);
      white-space: pre-wrap; word-break: break-word; margin-bottom: 0.42rem;
    }
    .comment-actions { display: flex; align-items: center; gap: 0.28rem; }
    .react-btn {
      padding: 0.15rem 0.5rem; border: 1px solid var(--border); border-radius: 100px;
      font-size: 0.7rem; font-weight: 600; cursor: pointer; background: var(--bg);
      color: var(--text-secondary); font-family: var(--font-sans);
      transition: all 0.12s; display: inline-flex; align-items: center; gap: 0.18rem;
    }
    .react-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
    .react-btn.active-like    { background: #dbeafe; border-color: #93c5fd; color: #1d4ed8; }
    .react-btn.active-dislike { background: #fee2e2; border-color: #fca5a5; color: #dc2626; }
    .comment-del-btn {
      margin-left: auto; padding: 0.15rem 0.45rem; border: 1px solid #fca5a5;
      border-radius: var(--radius-sm); font-size: 0.66rem; color: #dc2626;
      cursor: pointer; background: none; font-family: var(--font-sans); transition: all 0.12s;
    }
    .comment-del-btn:hover { background: #dc2626; color: #fff; }
    .empty-comments {
      text-align: center; padding: 1.5rem; color: var(--text-muted); font-size: 0.8rem;
    }
    .comment-form { margin-top: 0.9rem; display: flex; flex-direction: column; gap: 0.42rem; }
    .comment-textarea {
      width: 100%; padding: 0.65rem 0.85rem; border: 1.5px solid var(--border);
      border-radius: var(--radius-sm); font-size: 0.85rem; font-family: var(--font-sans);
      resize: vertical; min-height: 70px; outline: none; background: var(--bg);
      color: var(--text-primary); line-height: 1.6; transition: border-color 0.15s;
    }
    .comment-textarea:focus { border-color: var(--primary); }
    .comment-submit-row { display: flex; justify-content: flex-end; }
    .btn-comment-submit {
      padding: 0.42rem 1.05rem; background: var(--primary); color: #fff;
      border: none; border-radius: var(--radius-sm); font-size: 0.82rem;
      font-weight: 700; cursor: pointer; font-family: var(--font-sans); transition: background 0.15s;
    }
    .btn-comment-submit:hover:not(:disabled) { background: var(--primary-dark); }
    .btn-comment-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .comment-login-notice {
      margin-top: 0.85rem; text-align: center; padding: 0.72rem; font-size: 0.78rem;
      color: var(--text-muted); border: 1px dashed var(--border);
      border-radius: var(--radius-sm); cursor: pointer; transition: all 0.12s;
    }
    .comment-login-notice:hover { border-color: var(--primary); color: var(--primary); }

    /* ── 섹션 2칸 레이아웃 (편집 모드) ── */
    .section-body-2col {
      display: grid; grid-template-columns: 1fr 1fr;
    }
    .section-ai-side {
      background: #f8fafc; border-left: 1px solid var(--border);
      display: flex; flex-direction: column; min-height: 100px; position: relative;
    }
    .section-ai-content {
      flex: 1; padding: 0.8rem 1rem; font-size: 0.85rem; line-height: 1.75;
      color: var(--text-primary); white-space: pre-wrap; word-break: break-word;
    }
    .ai-side-placeholder { font-size: 0.74rem; color: var(--text-muted); font-style: italic; }
    .sec-ai-copy-btn {
      align-self: flex-end; margin: 0 0.5rem 0.4rem;
      padding: 0.15rem 0.5rem; border: 1px solid #c4b5fd; border-radius: var(--radius-sm);
      font-size: 0.67rem; font-weight: 600; cursor: pointer; color: #7c3aed;
      background: #fff; font-family: var(--font-sans); transition: all 0.12s;
    }
    .sec-ai-copy-btn:hover { background: #7c3aed; color: #fff; }
    .sec-guide-wrap {
      display: flex; align-items: center; gap: 0.28rem; flex: 1; min-width: 0;
    }
    .sec-guide-input {
      flex: 1; min-width: 70px; max-width: 180px; padding: 0.16rem 0.45rem;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-size: 0.67rem; font-family: var(--font-sans); background: var(--bg);
      color: var(--text-primary); outline: none; transition: border-color 0.15s;
    }
    .sec-guide-input:focus { border-color: var(--primary); }
    .btn-ai-sec {
      padding: 0.16rem 0.5rem; background: #7c3aed; color: #fff;
      border: none; border-radius: var(--radius-sm); font-size: 0.67rem; font-weight: 700;
      cursor: pointer; font-family: var(--font-sans); white-space: nowrap; transition: background 0.12s;
    }
    .btn-ai-sec:hover:not(:disabled) { background: #6d28d9; }
    .btn-ai-sec:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── 관련글 패널 ── */
    .related-panel {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 0.7rem 1rem;
      margin-bottom: 1rem; box-shadow: var(--shadow-sm);
    }
    .related-panel-header {
      font-size: 0.73rem; font-weight: 700; color: var(--text-secondary);
      margin-bottom: 0.45rem; display: flex; align-items: center; justify-content: space-between; gap: 0.3rem;
    }

    /* ── 반응형 ── */
    @media (max-width: 768px) {
      .issue-meta { padding: 0.75rem 1rem; }
      .section-label { padding: 0.45rem 0.85rem; }
      .section-body-view, .section-textarea { padding: 0.75rem 0.85rem; }
      .editor-form { padding: 0.45rem 0.85rem; }
      .ai-panel-body { padding: 0.85rem; }
      .section-body-2col { grid-template-columns: 1fr; }
      .section-ai-side { border-left: none; border-top: 1px solid var(--border); }
    }
    @media (max-width: 600px) {
      .view-headline { font-size: 1.2rem !important; }
      .article-view-body { padding: 1rem 1rem 1.5rem; font-size: 0.95rem; }
      .issue-meta { flex-direction: column; gap: 0.5rem; }
      .btn { padding: 0.5rem 0.85rem; font-size: 0.82rem; min-height: 40px; }
      .issue-title-view { font-size: 0.98rem; }
      .issue-title-input { font-size: 16px; }
      .section-textarea { font-size: 16px; min-height: 90px; }
      .action-bar { gap: 0.4rem; }
      .btn-spacer { display: none; }
      .action-bar .btn.success { order: -1; width: 100%; }
      .editor-email-in { font-size: 16px; width: 100%; }
      .section-label { flex-wrap: wrap; gap: 0.35rem; }
      .editor-zone { margin-left: 0; width: 100%; }
      .ai-panel-body { font-size: 16px; }
    }
    @media (max-width: 380px) {
      .btn { font-size: 0.78rem; padding: 0.45rem 0.65rem; }
    }
  </style>
</head>
<body>
  <div class="app-wrap">
    <header class="app-header">
      <div class="header-inner">
        <div class="header-left">
          <div class="header-logo">
            <a href="issues.html" class="back-link">
              <span class="logo-icon">📋</span>
              <span class="logo-text">이슈보드</span>
            </a>
          </div>
        </div>
        <div id="headerUser"></div>
      </div>
    </header>

    <main class="container">
      <div class="page-header">
        <a href="issues.html" class="back-btn">← 목록</a>
        <h1 class="page-title" id="pageTitle">이슈</h1>
      </div>

      <!-- 이슈 헤더 -->
      <div class="issue-meta" id="issueMeta">
        <div style="flex:1;min-width:0">
          <div id="titleArea"></div>
          <div class="issue-sub" id="issueSub"></div>
          <div id="issueReactBar" style="display:none;margin-top:0.45rem;display:flex;gap:0.3rem;align-items:center"></div>
        </div>
        <div id="topActions" style="display:flex;gap:0.4rem;flex-shrink:0;flex-wrap:wrap"></div>
      </div>

      <!-- 참고자료 패널 (편집 모드) -->
      <div class="ref-panel" id="refPanel" style="display:none"></div>

      <!-- 관련글 검색 패널 (편집 모드) -->
      <div class="related-panel" id="relatedPanel" style="display:none"></div>

      <!-- 섹션 -->
      <div class="sections-wrap" id="sectionsWrap"></div>

      <!-- 하단 액션바 -->
      <div class="action-bar" id="actionBar" style="display:none"></div>

      <!-- 기사 본문 -->
      <div class="ai-panel" id="aiPanel">
        <div class="ai-panel-header">
          <span>✨ 기사 본문</span>
          <div class="ai-panel-acts" id="aiPanelActs"></div>
        </div>
        <textarea id="aiBody" class="ai-panel-body"
          placeholder="AI로 정리하거나, 가져오기로 섹션 내용을 불러오거나, 직접 입력하세요."></textarea>
      </div>

      <!-- 댓글 -->
      <div class="comments-section" id="commentsSection" style="display:none">
        <div class="comments-header">
          💬 댓글
          <span class="comment-count-badge" id="commentCountBadge">0</span>
        </div>
        <div id="commentList"></div>
        <div id="commentFormWrap"></div>
      </div>
    </main>

    <footer class="app-footer">
      <p>핫이슈 조회 · Powered by 유승주</p>
    </footer>
  </div>
  <div class="toast" id="toast"></div>

  <script src="assets/js/auth.js"></script>
  <script>
    const LABELS = ['배경 / 발단', '주요 내용', '인터뷰 / 현장', '관련 자료', '결론 / 전망'];
    const HINTS  = [
      '이슈가 발생한 배경과 발단을 입력하세요',
      '핵심 사건이나 주요 내용을 입력하세요',
      '현장 취재, 인터뷰 내용을 입력하세요',
      '통계, 참고자료, 관련 데이터를 입력하세요',
      '결론, 전망, 향후 계획을 입력하세요',
    ];

    const params      = new URLSearchParams(location.search);
    const issueId     = params.get('id');
    const isEditMode  = params.get('mode') === 'edit';
    const isLoggedIn  = !!getToken();
    const me          = getUser();

    let isAuthor         = false;
    let editableSections = [];
    let editors          = [null, null, null, null, null];
    let sectionsData     = ['', '', '', '', ''];
    let guideData        = ['', '', '', '', ''];
    let aiData           = ['', '', '', '', ''];

    renderHeader('#headerUser');

    if (!issueId) {
      if (!isLoggedIn) { location.href = 'index.html'; }
      else { isAuthor = true; editableSections = [1,2,3,4,5]; renderNewPage(); }
    } else {
      loadIssue();
    }

    /* ── 신규 ── */
    function renderNewPage() {
      document.getElementById('pageTitle').textContent = '새 이슈';
      document.getElementById('titleArea').innerHTML =
        `<input id="titleInput" class="issue-title-input" placeholder="이슈 제목을 입력하세요" maxlength="200" />`;
      document.getElementById('issueSub').textContent = '';
      renderSections();
      renderActionBar();
      renderAiPanelActs();
    }

    /* ── 불러오기 ── */
    async function loadIssue() {
      try {
        const headers = isLoggedIn ? { Authorization: `Bearer ${getToken()}` } : {};
        const res = await fetch(API + '/issues/' + issueId, { headers });
        if (res.status === 403) { location.href = 'index.html'; return; }
        if (!res.ok) throw new Error();
        const { issue, sections, editors: eds, sectionGuides: sg, sectionAiContents: sa } = await res.json();

        sectionsData = sections;
        guideData    = sg  || ['', '', '', '', ''];
        aiData       = sa  || ['', '', '', '', ''];
        editors      = eds;
        isAuthor     = isLoggedIn && me && issue.user_id === me.id;

        if (!isAuthor && isLoggedIn && me) {
          editableSections = eds
            .map((e, i) => e && e.user_id === me.id ? i + 1 : null)
            .filter(Boolean);
        } else if (isAuthor) {
          editableSections = [1, 2, 3, 4, 5];
        }

        if (isEditMode && (isAuthor || editableSections.length)) {
          document.getElementById('pageTitle').textContent = '이슈 편집';
          document.getElementById('titleArea').innerHTML = isAuthor
            ? `<input id="titleInput" class="issue-title-input" value="${escHtml(issue.title)}" maxlength="200" />`
            : `<div class="issue-title-view">${escHtml(issue.title)}</div>`;
        } else {
          document.getElementById('pageTitle').textContent = '이슈 조회';
          document.getElementById('titleArea').innerHTML =
            `<div class="issue-title-view">${escHtml(issue.title)}</div>`;
        }

        document.getElementById('issueSub').textContent =
          `작성자: ${issue.author} · ${new Date(issue.created_at).toLocaleDateString('ko-KR')} · 조회 ${issue.view_count ?? 0}`;

        renderTopActions(issue);
        if (!isEditMode) renderIssueReactBar(issue);
        renderRefLinks(issue.reference_links);
        renderSections();
        renderActionBar();

        // 기사 본문 로드
        const articleContent = issue.article_content || '';
        document.getElementById('aiBody').value = articleContent;
        renderAiPanelActs();

        if (isEditMode && isAuthor) loadCookie();
        if (!isEditMode) loadComments();
      } catch {
        showToast('이슈를 불러오지 못했습니다.', 'error');
      }
    }

    /* ── 상단 버튼 ── */
    function renderTopActions(issue) {
      const div = document.getElementById('topActions');
      const btns = [];
      if (!isEditMode && issueId) {
        if (isAuthor || editableSections.length > 0) {
          btns.push(`<a href="write.html?id=${issueId}&mode=edit" class="btn primary" style="text-decoration:none">✏️ 편집</a>`);
        }
        if (isAuthor) {
          btns.push(`<button class="btn" style="border-color:#fca5a5;color:#dc2626" onclick="confirmDelete()">🗑 삭제</button>`);
        }
      }
      div.innerHTML = btns.join('');
    }

    function renderIssueReactBar(issue) {
      const bar = document.getElementById('issueReactBar');
      if (!bar) return;
      bar.style.display = 'flex';
      const likeClass    = issue.my_reaction === 'like'    ? ' active-like'    : '';
      const dislikeClass = issue.my_reaction === 'dislike' ? ' active-dislike' : '';
      bar.innerHTML = `
        <button class="react-btn${likeClass}"    id="issLikeBtn"    onclick="reactIssue('like')">👍 <span id="issLikes">${issue.likes || 0}</span></button>
        <button class="react-btn${dislikeClass}" id="issDislikeBtn" onclick="reactIssue('dislike')">👎 <span id="issDislikes">${issue.dislikes || 0}</span></button>`;
    }

    async function reactIssue(reaction) {
      if (!isLoggedIn) { openLoginModal(); return; }
      try {
        const res = await api(`/issues/${issueId}/react`, { method: 'POST', body: JSON.stringify({ reaction }) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        document.getElementById('issLikes').textContent    = data.likes;
        document.getElementById('issDislikes').textContent = data.dislikes;
        document.getElementById('issLikeBtn').className    = `react-btn${data.my_reaction === 'like'    ? ' active-like'    : ''}`;
        document.getElementById('issDislikeBtn').className = `react-btn${data.my_reaction === 'dislike' ? ' active-dislike' : ''}`;
      } catch (e) { showToast(e.message || '처리 실패', 'error'); }
    }

    /* ── 관련글 검색 ── */
    async function searchRelatedArticles() {
      const panel = document.getElementById('relatedPanel');
      panel.style.display = '';
      panel.innerHTML = `<div class="related-panel-header">🔍 관련 최신글 <span style="font-size:.67rem;color:var(--text-muted);font-weight:400">검색 중...</span></div>`;
      try {
        const res = await api(`/issues/${issueId}/search-related`, { method: 'POST' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        const items = data.items || [];
        if (!items.length) { panel.innerHTML = `<div class="related-panel-header">🔍 관련 최신글</div><div style="font-size:.74rem;color:var(--text-muted);padding:.3rem 0">관련 기사를 찾지 못했습니다.</div>`; return; }
        panel.innerHTML = `
          <div class="related-panel-header">🔍 관련 최신글 (${items.length}건)</div>
          <ul class="ref-list">
            ${items.map(l => `<li><a href="${l.url.replace(/"/g,'&quot;')}" target="_blank" rel="noopener noreferrer">${escHtml(l.title)}</a></li>`).join('')}
          </ul>`;
      } catch (e) {
        panel.innerHTML = `<div class="related-panel-header">🔍 관련 최신글</div><div style="font-size:.74rem;color:var(--danger)">${escHtml(e.message || '검색 실패')}</div>`;
      }
    }

    /* ── 섹션 AI 작성 ── */
    async function aiWriteSection(n) {
      const content = document.getElementById(`sec${n}`)?.value || '';
      const guide   = document.getElementById(`guide${n}`)?.value || '';
      const btn     = document.getElementById(`btnAiSec${n}`);
      if (btn) { btn.disabled = true; btn.textContent = '⏳...'; }
      const contentDiv = document.getElementById(`aiSecContent${n}`);
      if (contentDiv) contentDiv.innerHTML = '<div class="ai-side-placeholder">AI가 작성 중...</div>';
      try {
        const res = await api(`/issues/${issueId}/sections/${n}/ai-write`, {
          method: 'POST', body: JSON.stringify({ content, guide }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        const side = document.getElementById(`aisec${n}`);
        if (side) {
          side.innerHTML = `
            <div class="section-ai-content" id="aiSecContent${n}">${escHtml(data.ai_content)}</div>
            <button class="sec-ai-copy-btn" onclick="copySectionAI(${n})">📋 복사</button>`;
        }
        aiData[n - 1] = data.ai_content;
        showToast(`섹션 ${n} AI 작성 완료`, 'success');
      } catch (e) {
        if (contentDiv) contentDiv.innerHTML = '<div class="ai-side-placeholder">AI 작성 실패</div>';
        showToast(e.message || 'AI 작성 실패', 'error');
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = '✨ AI작성'; }
      }
    }

    function copySectionAI(n) {
      const el = document.getElementById(`aiSecContent${n}`);
      const text = el?.textContent?.trim() || '';
      if (!text) { showToast('복사할 내용이 없습니다.', 'error'); return; }
      navigator.clipboard.writeText(text)
        .then(() => showToast('복사됐습니다.', 'success'))
        .catch(() => showToast('복사 실패', 'error'));
    }

    function renderRefLinks(links) {
      const panel = document.getElementById('refPanel');
      if (!panel) return;
      const editMode = isEditMode || !issueId;
      if (!editMode || !Array.isArray(links) || !links.length) { panel.style.display = 'none'; return; }
      panel.style.display = '';
      panel.innerHTML = `
        <div class="ref-panel-title">📎 참고자료 (${links.length}건)</div>
        <ul class="ref-list">
          ${links.map(l => `<li><a href="${l.url.replace(/"/g, '&quot;')}" target="_blank" rel="noopener noreferrer">${escHtml(l.title)}</a></li>`).join('')}
        </ul>`;
    }

    async function confirmDelete() {
      if (!confirm('이 이슈를 삭제하시겠습니까?')) return;
      try {
        const res = await api(`/issues/${issueId}`, { method: 'DELETE' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        location.href = 'issues.html';
      } catch (e) { showToast(e.message || '삭제 실패', 'error'); }
    }

    /* ── 기사 본문 패널 버튼 ── */
    function renderAiPanelActs() {
      const editMode = isEditMode || !issueId;
      const acts = document.getElementById('aiPanelActs');
      const panel = document.getElementById('aiPanel');
      const textarea = document.getElementById('aiBody');
      if (!acts || !panel || !textarea) return;

      textarea.readOnly = !editMode;

      // 조회 모드: 기사 본문을 진짜 기사 형식으로 표시
      if (!editMode) {
        const content = textarea.value.trim();
        if (!content) {
          panel.style.display = 'none';
          return;
        }
        panel.style.display = '';
        panel.classList.add('view-mode');
        textarea.style.display = 'none';

        const oldView = panel.querySelector('.article-view-body');
        if (oldView) oldView.remove();
        const viewDiv = document.createElement('div');
        viewDiv.className = 'article-view-body';
        viewDiv.textContent = content;
        panel.appendChild(viewDiv);

        acts.innerHTML = `<button class="btn-panel-sm" onclick="copyAI()">복사</button>`;
        return;
      }

      // 편집 모드: 가져오기 + AI 정리 + 복사
      panel.style.display = '';
      let html = `<button class="btn-panel-sm import" onclick="importSections()">📥 가져오기</button>`;
      if (isLoggedIn) {
        html += `<button class="btn-panel-sm" id="btnGenerate" onclick="generateArticle()">🤖 AI 정리</button>`;
      }
      html += `<button class="btn-panel-sm" onclick="copyAI()">복사</button>`;
      acts.innerHTML = html;
    }

    /* ── 섹션 렌더링 ── */
    function renderSections() {
      const editMode = isEditMode || !issueId;
      if (!editMode) {
        document.getElementById('sectionsWrap').style.display = 'none';
        return;
      }
      document.getElementById('sectionsWrap').innerHTML = LABELS.map((label, i) => {
        const n         = i + 1;
        const editable  = editableSections.includes(n);
        const editor    = editors[i];
        const isMyEdit  = !isAuthor && editable;
        const content   = sectionsData[i] || '';
        const guide     = guideData[i]    || '';
        const aiContent = aiData[i]       || '';

        let editorZone = '';
        if (isAuthor && issueId) {
          const chip  = editor ? `<span class="editor-chip">✏️ ${escHtml(editor.name)}</span>` : `<span class="editor-chip none">편집자 미지정</span>`;
          const rmBtn = editor ? `<button class="btn-ed del-ed" onclick="removeEditor(${n})">해제</button>` : '';
          editorZone  = `<div class="editor-zone">${chip}<button class="btn-ed" onclick="toggleEditorForm(${n})">지정</button>${rmBtn}</div>`;
        }

        const myBadge   = isMyEdit ? `<span class="my-sec-badge">내 편집 구역</span>` : '';
        const guideRow  = editable
          ? `<div class="sec-guide-wrap">
               <input type="text" class="sec-guide-input" id="guide${n}" placeholder="작성 가이드..." value="${escHtml(guide)}" />
               <button class="btn-ai-sec" id="btnAiSec${n}" onclick="aiWriteSection(${n})">✨ AI작성</button>
             </div>` : '';

        const aiSide = `
          <div class="section-ai-side" id="aisec${n}">
            <div class="section-ai-content" id="aiSecContent${n}">${
              aiContent ? escHtml(aiContent) : '<div class="ai-side-placeholder">✨ AI작성 버튼으로 내용을 생성하세요</div>'
            }</div>
            ${aiContent ? `<button class="sec-ai-copy-btn" onclick="copySectionAI(${n})">📋 복사</button>` : ''}
          </div>`;

        const bodyHtml = editable
          ? `<div class="section-body-2col"><textarea id="sec${n}" class="section-textarea" placeholder="${HINTS[i]}" rows="4">${escHtml(content)}</textarea>${aiSide}</div>`
          : `<div class="section-body-2col"><textarea id="sec${n}" class="section-textarea" readonly placeholder="${HINTS[i]}" rows="4">${escHtml(content)}</textarea>${aiSide}</div>`;

        const edFormHtml = (isAuthor && issueId)
          ? `<div class="editor-form" id="eform${n}">
               <input type="email" class="editor-email-in" id="eEmail${n}" placeholder="편집자 이메일 입력" />
               <button class="btn-assign" onclick="assignEditor(${n})">지정</button>
               <button class="btn-cancel-ed" onclick="toggleEditorForm(${n})">닫기</button>
             </div>` : '';

        return `
          <div class="section-card">
            <div class="section-label">
              <span class="sec-num">${n}</span>
              <span class="sec-name">${label}</span>
              ${myBadge}
              ${guideRow}
              ${editorZone}
            </div>
            ${edFormHtml}
            ${bodyHtml}
          </div>`;
      }).join('');
    }

    /* ── 하단 액션바 ── */
    function renderActionBar() {
      const bar      = document.getElementById('actionBar');
      const editMode = isEditMode || !issueId;
      if (!editMode) { bar.style.display = 'none'; return; }

      const canSave = isAuthor || editableSections.length > 0;
      if (!canSave) { bar.style.display = 'none'; return; }
      bar.style.display = 'flex';

      let html = '';
      if (issueId) {
        html += `<button class="btn" onclick="searchRelatedArticles()">🔍 관련글 검색</button>`;
      }
      html += `<div class="btn-spacer"></div>`;
      if (canSave) {
        html += `<button class="btn primary" id="btnSave" onclick="saveIssue(true)">📌 임시저장</button>`;
      }
      if (isAuthor && issueId) {
        html += `<button class="btn success" id="btnComplete" onclick="saveIssue(false)">✅ 기사 작성 완료</button>`;
      }
      bar.innerHTML = html;
    }

    /* ── 편집자 ── */
    function toggleEditorForm(n) {
      const f = document.getElementById(`eform${n}`);
      if (!f) return;
      f.classList.toggle('open');
      if (f.classList.contains('open')) document.getElementById(`eEmail${n}`).focus();
    }

    async function assignEditor(n) {
      const email = document.getElementById(`eEmail${n}`)?.value.trim();
      if (!email) { showToast('이메일을 입력하세요.', 'error'); return; }
      try {
        const res = await api(`/issues/${issueId}/editors`, {
          method: 'POST',
          body: JSON.stringify({ section_no: n, email }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        editors[n - 1] = data.editor;
        saveSectionsSnapshot();
        renderSections();
        restoreSectionsSnapshot();
        showToast(`섹션 ${n} 편집자: ${data.editor.name}`, 'success');
      } catch (e) { showToast(e.message || '지정 실패', 'error'); }
    }

    async function removeEditor(n) {
      try {
        const res = await api(`/issues/${issueId}/editors/${n}`, { method: 'DELETE' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        editors[n - 1] = null;
        saveSectionsSnapshot();
        renderSections();
        restoreSectionsSnapshot();
        showToast(`섹션 ${n} 편집자 해제`, 'success');
      } catch (e) { showToast(e.message || '해제 실패', 'error'); }
    }

    let _snap = [];
    function saveSectionsSnapshot() { _snap = [1,2,3,4,5].map(i => document.getElementById(`sec${i}`)?.value || ''); }
    function restoreSectionsSnapshot() { _snap.forEach((v, i) => { const el = document.getElementById(`sec${i+1}`); if (el) el.value = v; }); }

    /* ── 임시저장 ── */
    function tempSave() {
      if (!issueId) { showToast('먼저 저장하세요.', 'error'); return; }
      const d = { title: document.getElementById('titleInput')?.value, sections: getSections() };
      document.cookie = `draft_${issueId}=${encodeURIComponent(JSON.stringify(d))};max-age=86400;path=/`;
      showToast('임시저장됐습니다.', 'info');
    }
    function loadCookie() {
      if (!issueId) return;
      const m = document.cookie.match(new RegExp(`draft_${issueId}=([^;]+)`));
      if (!m) return;
      try {
        const d = JSON.parse(decodeURIComponent(m[1]));
        if (d.title) { const el = document.getElementById('titleInput'); if (el) el.value = d.title; }
        d.sections?.forEach((s, i) => { const el = document.getElementById(`sec${i+1}`); if (el && s) el.value = s; });
        showToast('임시저장 내용을 불러왔습니다.', 'info');
      } catch {}
    }
    function clearCookie() { if (issueId) document.cookie = `draft_${issueId}=;max-age=0;path=/`; }

    function getSections() { return [1,2,3,4,5].map(i => document.getElementById(`sec${i}`)?.value || ''); }
    function getArticleContent() { return document.getElementById('aiBody')?.value || ''; }

    /* ── 저장 ── */
    async function saveIssue(isDraft = true) {
      if (!isDraft && getArticleContent().trim().length < 10) {
        showToast('기사 본문을 10자 이상 입력해야 완료할 수 있습니다.', 'error');
        return;
      }
      const saveBtn    = document.getElementById('btnSave');
      const completeBtn = document.getElementById('btnComplete');
      const activeBtn  = isDraft ? saveBtn : completeBtn;
      if (activeBtn) { activeBtn.disabled = true; activeBtn.textContent = isDraft ? '저장 중...' : '처리 중...'; }
      try {
        if (isAuthor) {
          const title = document.getElementById('titleInput')?.value.trim();
          if (!title) { showToast('제목을 입력하세요.', 'error'); return; }
          if (!issueId) {
            const r = await api('/issues', { method: 'POST', body: JSON.stringify({ title }) });
            const d = await r.json();
            if (!r.ok) throw new Error(d.error);
            history.replaceState({}, '', `write.html?id=${d.issue.id}&mode=edit`);
            location.reload();
            return;
          }
          await api(`/issues/${issueId}`, { method: 'PUT', body: JSON.stringify({ title }) });
          const r2 = await api(`/issues/${issueId}/sections`, {
            method: 'POST',
            body: JSON.stringify({
              sections: getSections(),
              guides: [1,2,3,4,5].map(j => document.getElementById(`guide${j}`)?.value || ''),
              is_draft: isDraft,
              article_content: getArticleContent(),
            }),
          });
          if (!r2.ok) { const d2 = await r2.json(); throw new Error(d2.error); }
        } else {
          for (const n of editableSections) {
            const content = document.getElementById(`sec${n}`)?.value || '';
            const r = await api(`/issues/${issueId}/sections/${n}`, {
              method: 'PUT', body: JSON.stringify({ content }),
            });
            if (!r.ok) { const d = await r.json(); throw new Error(d.error); }
          }
        }
        clearCookie();
        const msg = isDraft ? '저장됐습니다.' : '기사 작성이 완료됐습니다.';
        showToast(msg, 'success');
        setTimeout(() => location.href = `write.html?id=${issueId}`, 800);
      } catch (e) {
        showToast(e.message || '저장 실패', 'error');
      } finally {
        if (activeBtn) {
          activeBtn.disabled = false;
          activeBtn.textContent = isDraft ? '📌 임시저장' : '✅ 기사 작성 완료';
        }
      }
    }

    /* ── 가져오기: 5개 섹션 → 기사 본문 ── */
    function importSections() {
      const parts = getSections().filter(s => s.trim());
      if (!parts.length) { showToast('섹션 내용을 먼저 입력하세요.', 'error'); return; }
      document.getElementById('aiBody').value = parts.join('\n\n');
      showToast('섹션 내용을 가져왔습니다.', 'success');
    }

    /* ── AI 정리 ── */
    async function generateArticle() {
      const title = document.getElementById('titleInput')?.value.trim()
        || document.querySelector('.issue-title-view')?.textContent.trim();
      if (!title) { showToast('제목이 필요합니다.', 'error'); return; }

      const btn = document.getElementById('btnGenerate');
      if (btn) { btn.disabled = true; btn.textContent = '⏳ AI 정리 중...'; }

      const textarea = document.getElementById('aiBody');
      textarea.value = 'AI가 기사를 정리하고 있습니다...';

      try {
        const sections = (isEditMode || !issueId) ? getSections() : sectionsData;
        const res = await api('/generate', {
          method: 'POST',
          body: JSON.stringify({ title, sections }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        textarea.value = data.article;
        textarea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      } catch (e) {
        textarea.value = '';
        showToast('AI 정리 실패: ' + e.message, 'error');
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = '🤖 AI 정리'; }
      }
    }

    async function copyAI() {
      const text = document.getElementById('aiBody')?.value || '';
      if (!text) { showToast('복사할 내용이 없습니다.', 'error'); return; }
      try { await navigator.clipboard.writeText(text); showToast('복사됐습니다.', 'success'); }
      catch { showToast('복사 실패', 'error'); }
    }

    /* ── 댓글 ── */
    async function loadComments() {
      const sec = document.getElementById('commentsSection');
      if (!sec || !issueId) return;
      sec.style.display = '';
      try {
        const headers = isLoggedIn ? { Authorization: `Bearer ${getToken()}` } : {};
        const res = await fetch(API + `/issues/${issueId}/comments`, { headers });
        if (!res.ok) throw new Error();
        const { comments } = await res.json();
        renderCommentList(comments);
        renderCommentForm();
      } catch {
        document.getElementById('commentList').innerHTML = '<div class="empty-comments">댓글을 불러오지 못했습니다.</div>';
      }
    }

    function renderCommentList(comments) {
      document.getElementById('commentCountBadge').textContent = comments.length;
      document.getElementById('commentList').innerHTML = comments.length
        ? comments.map(renderCommentItem).join('')
        : '<div class="empty-comments">첫 댓글을 작성해보세요.</div>';
    }

    function renderCommentItem(c) {
      const date = new Date(c.created_at).toLocaleDateString('ko-KR', { year:'2-digit', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
      const isMyComment  = isLoggedIn && me && c.user_id === me.id;
      const likeClass    = c.my_reaction === 'like'    ? ' active-like'    : '';
      const dislikeClass = c.my_reaction === 'dislike' ? ' active-dislike' : '';
      const delBtn = isMyComment
        ? `<button class="comment-del-btn" onclick="removeComment(${c.id})">삭제</button>` : '';
      return `
        <div class="comment-item" id="comment-${c.id}">
          <div class="comment-meta">
            <span class="comment-author">${escHtml(c.author)}</span>
            <span class="comment-date">${date}</span>
            ${delBtn}
          </div>
          <div class="comment-body">${escHtml(c.content)}</div>
          <div class="comment-actions">
            <button class="react-btn${likeClass}" onclick="reactComment(${c.id},'like')">👍 <span id="like-${c.id}">${c.likes}</span></button>
            <button class="react-btn${dislikeClass}" onclick="reactComment(${c.id},'dislike')">👎 <span id="dislike-${c.id}">${c.dislikes}</span></button>
          </div>
        </div>`;
    }

    function renderCommentForm() {
      const wrap = document.getElementById('commentFormWrap');
      if (!wrap) return;
      if (!isLoggedIn) {
        wrap.innerHTML = `<div class="comment-login-notice" onclick="openLoginModal()">🔒 로그인하면 댓글을 작성할 수 있습니다</div>`;
        return;
      }
      wrap.innerHTML = `
        <div class="comment-form">
          <textarea id="commentInput" class="comment-textarea" placeholder="댓글을 입력하세요..." rows="3"></textarea>
          <div class="comment-submit-row">
            <button class="btn-comment-submit" id="btnCommentSubmit" onclick="submitComment()">댓글 등록</button>
          </div>
        </div>`;
    }

    async function submitComment() {
      const input = document.getElementById('commentInput');
      const content = input?.value.trim();
      if (!content) { showToast('댓글 내용을 입력하세요.', 'error'); return; }
      const btn = document.getElementById('btnCommentSubmit');
      btn.disabled = true; btn.textContent = '등록 중...';
      try {
        const res = await api(`/issues/${issueId}/comments`, { method: 'POST', body: JSON.stringify({ content }) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        input.value = '';
        const list = document.getElementById('commentList');
        list.querySelector('.empty-comments')?.remove();
        list.insertAdjacentHTML('beforeend', renderCommentItem(data.comment));
        const badge = document.getElementById('commentCountBadge');
        badge.textContent = parseInt(badge.textContent || '0') + 1;
        showToast('댓글이 등록됐습니다.', 'success');
      } catch (e) { showToast(e.message || '등록 실패', 'error'); }
      finally { btn.disabled = false; btn.textContent = '댓글 등록'; }
    }

    async function reactComment(commentId, reaction) {
      if (!isLoggedIn) { openLoginModal(); return; }
      try {
        const res = await api(`/comments/${commentId}/react`, { method: 'POST', body: JSON.stringify({ reaction }) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        document.getElementById(`like-${commentId}`).textContent    = data.likes;
        document.getElementById(`dislike-${commentId}`).textContent = data.dislikes;
        const item = document.getElementById(`comment-${commentId}`);
        const [likeBtn, dislikeBtn] = item.querySelectorAll('.react-btn');
        likeBtn.className    = `react-btn${data.my_reaction === 'like'    ? ' active-like'    : ''}`;
        dislikeBtn.className = `react-btn${data.my_reaction === 'dislike' ? ' active-dislike' : ''}`;
      } catch (e) { showToast(e.message || '처리 실패', 'error'); }
    }

    async function removeComment(commentId) {
      if (!confirm('댓글을 삭제하시겠습니까?')) return;
      try {
        const res = await api(`/comments/${commentId}`, { method: 'DELETE' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        document.getElementById(`comment-${commentId}`)?.remove();
        const badge = document.getElementById('commentCountBadge');
        badge.textContent = Math.max(0, parseInt(badge.textContent || '1') - 1);
        if (!document.querySelector('.comment-item')) {
          document.getElementById('commentList').innerHTML = '<div class="empty-comments">첫 댓글을 작성해보세요.</div>';
        }
        showToast('댓글이 삭제됐습니다.', 'success');
      } catch (e) { showToast(e.message || '삭제 실패', 'error'); }
    }

    function escHtml(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    let toastTimer;
    function showToast(msg, type = 'info') {
      const el = document.getElementById('toast');
      el.textContent = msg; el.className = `toast ${type} show`;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.className = `toast ${type}`, 2800);
    }
  </script>
</body>
</html>
