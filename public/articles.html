<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>기사 목록 – 기사 작성기</title>
  <link rel="stylesheet" href="assets/css/common.css" />
  <style>
    .page-toolbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.75rem;
    }
    .page-toolbar h2 { font-size: 1.2rem; font-weight: 700; }
    .toolbar-btns { display: flex; gap: 0.5rem; }
    .btn {
      padding: 0.5rem 1.1rem; border-radius: var(--radius-sm);
      font-size: 0.85rem; font-weight: 700; cursor: pointer;
      border: 1.5px solid var(--border); background: var(--bg-card);
      color: var(--text-secondary); transition: all 0.15s;
    }
    .btn:hover { border-color: var(--primary); color: var(--primary); }
    .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn.primary:hover { background: var(--primary-dark); }
    .btn.ai { background: #7c3aed; border-color: #7c3aed; color: #fff; }
    .btn.ai:hover { background: #6d28d9; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .article-list { display: flex; flex-direction: column; gap: 0.6rem; }
    .article-item {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 1rem 1.25rem;
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; cursor: pointer; transition: all 0.15s;
      text-decoration: none; color: inherit;
    }
    .article-item:hover { border-color: var(--primary); box-shadow: var(--shadow-sm); }
    .article-info { flex: 1; min-width: 0; }
    .article-title {
      font-weight: 700; font-size: 0.95rem; color: var(--text-primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .article-meta { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem; }
    .article-badge {
      font-size: 0.7rem; padding: 0.15rem 0.55rem; border-radius: 100px; font-weight: 700; flex-shrink: 0;
    }
    .badge-draft { background: var(--warning-light); color: #92400e; }
    .badge-done  { background: var(--success-light); color: #065f46; }

    .empty-state { text-align: center; padding: 4rem 1rem; color: var(--text-muted); }
    .empty-state .empty-icon { font-size: 3rem; display: block; margin-bottom: 1rem; }
    .empty-state p { font-size: 0.9rem; }

    .loading { text-align: center; padding: 3rem; color: var(--text-muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="app-wrap">
    <header class="app-header">
      <div class="header-inner">
        <div class="header-left">
          <div class="header-logo">
            <a href="dashboard.html" class="back-link">
              <span class="logo-icon">📰</span>
              <span class="logo-text">기사 작성기</span>
            </a>
          </div>
        </div>
        <div id="headerUser"></div>
      </div>
    </header>

    <main class="container">
      <div class="page-toolbar">
        <h2>📋 내 기사 목록</h2>
        <div class="toolbar-btns">
          <button class="btn ai" id="btnAI" onclick="addAITopic()">🤖 AI 주제 추가</button>
          <button class="btn primary" onclick="location.href='write.html'">✍️ 신규 작성</button>
        </div>
      </div>

      <div id="articleList" class="loading">불러오는 중...</div>
    </main>

    <footer class="app-footer">
      <p>© 2025 기사 작성기 · Powered by Claude AI</p>
    </footer>
  </div>

  <div class="toast" id="toast"></div>

  <script src="assets/js/auth.js"></script>
  <script>
    if (!requireAuth()) {}
    else {
      renderHeader('#headerUser');
      loadArticles();
    }

    async function loadArticles() {
      const container = document.getElementById('articleList');
      try {
        const res = await api('/articles');
        if (!res.ok) throw new Error();
        const { articles } = await res.json();

        if (!articles.length) {
          container.innerHTML = `
            <div class="empty-state">
              <span class="empty-icon">📄</span>
              <p>작성한 기사가 없습니다.<br>AI 주제 추가 또는 신규 작성으로 시작하세요.</p>
            </div>`;
          return;
        }

        container.innerHTML = '<div class="article-list">' +
          articles.map(a => `
            <a href="write.html?id=${a.id}" class="article-item">
              <div class="article-info">
                <div class="article-title">${escHtml(a.title || '(제목 없음)')}</div>
                <div class="article-meta">
                  작성자: ${escHtml(a.author)} &nbsp;·&nbsp;
                  ${new Date(a.created_at).toLocaleDateString('ko-KR')}
                </div>
              </div>
              <span class="article-badge ${a.is_draft ? 'badge-draft' : 'badge-done'}">
                ${a.is_draft ? '작성 중' : '완료'}
              </span>
            </a>`).join('') + '</div>';
      } catch {
        container.innerHTML = '<div class="empty-state"><span class="empty-icon">⚠️</span><p>목록을 불러오지 못했습니다.</p></div>';
      }
    }

    async function addAITopic() {
      const btn = document.getElementById('btnAI');
      btn.disabled = true; btn.textContent = '⏳ AI 검색 중...';
      try {
        const res = await api('/topics/ai', { method: 'POST' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        showToast(`주제 추가됨: ${data.title}`, 'success');
        loadArticles();
      } catch (e) {
        showToast(e.message || 'AI 주제 추가 실패', 'error');
      } finally {
        btn.disabled = false; btn.textContent = '🤖 AI 주제 추가';
      }
    }

    function escHtml(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    let toastTimer;
    function showToast(msg, type = 'info') {
      const el = document.getElementById('toast');
      el.textContent = msg; el.className = `toast ${type} show`;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.className = `toast ${type}`, 2800);
    }
  </script>
</body>
</html>
