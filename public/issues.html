<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>이슈보드</title>
  <link rel="stylesheet" href="assets/css/common.css" />
  <style>
    /* ── Toolbar ── */
    .toolbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 0.6rem; flex-wrap: wrap; gap: 0.5rem;
    }
    .toolbar-title { font-size: 1rem; font-weight: 800; }
    .toolbar-btns  { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; }

    .btn {
      padding: 0.38rem 0.85rem; border-radius: var(--radius-sm);
      font-size: 0.78rem; font-weight: 700; cursor: pointer;
      border: 1.5px solid var(--border); background: var(--bg-card);
      color: var(--text-secondary); transition: all 0.15s; font-family: var(--font-sans);
      white-space: nowrap;
    }
    .btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
    .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn.primary:hover:not(:disabled) { background: var(--primary-dark); }
    .btn.ai { background: #7c3aed; border-color: #7c3aed; color: #fff; }
    .btn.ai:hover:not(:disabled) { background: #6d28d9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── 필터 바 ── */
    .filter-bar {
      display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap;
      margin-bottom: 0.75rem; padding: 0.55rem 0.85rem;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-md); box-shadow: var(--shadow-sm);
    }
    .f-input {
      padding: 0.3rem 0.58rem; border: 1.5px solid var(--border);
      border-radius: var(--radius-sm); font-size: 0.76rem;
      font-family: var(--font-sans); outline: none;
      background: var(--bg); color: var(--text-primary); transition: border-color 0.15s;
    }
    .f-input:focus { border-color: var(--primary); }
    .f-q      { min-width: 130px; flex: 1; max-width: 220px; }
    .f-date   { width: 128px; }
    .f-author { width: 82px; }
    .f-search {
      padding: 0.3rem 0.72rem; background: var(--primary); color: #fff;
      border: none; border-radius: var(--radius-sm); font-size: 0.76rem;
      font-weight: 700; cursor: pointer; font-family: var(--font-sans);
      white-space: nowrap; transition: background 0.15s;
    }
    .f-search:hover { background: var(--primary-dark); }
    .f-toggle {
      padding: 0.28rem 0.62rem; border: 1.5px solid var(--border);
      border-radius: var(--radius-sm); font-size: 0.72rem; font-weight: 700;
      cursor: pointer; background: var(--bg-card); color: var(--text-secondary);
      font-family: var(--font-sans); white-space: nowrap; transition: all 0.15s;
    }
    .f-toggle.on { background: var(--primary); border-color: var(--primary); color: #fff; }
    .f-toggle:hover:not(.on) { border-color: var(--primary); color: var(--primary); }
    .f-reset {
      padding: 0.28rem 0.55rem; border: 1px solid var(--border);
      border-radius: var(--radius-sm); font-size: 0.72rem; font-weight: 600;
      cursor: pointer; background: none; color: var(--text-muted);
      font-family: var(--font-sans); transition: all 0.12s;
    }
    .f-reset:hover { color: var(--danger); border-color: #fca5a5; }

    /* ── 테이블 ── */
    .issue-table {
      width: 100%; border-collapse: collapse;
      background: var(--bg-card); border-radius: var(--radius-md);
      overflow: hidden; box-shadow: var(--shadow-sm); border: 1px solid var(--border);
      font-size: 0.82rem;
    }
    .issue-table th {
      padding: 0.5rem 0.75rem; text-align: left; font-size: 0.72rem; font-weight: 700;
      color: var(--text-secondary); background: #f1f5f9;
      border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    .issue-table td {
      padding: 0.35rem 0.65rem; border-bottom: 1px solid #f1f5f9;
      vertical-align: middle; line-height: 1.4;
    }
    .issue-table tr:last-child td { border-bottom: none; }
    .issue-table tbody tr:not(.inline-row):hover { background: #f8f9fe; }

    .col-no     { width: 42px; color: var(--text-muted); font-size: 0.72rem; text-align: center; }
    .col-title  { width: auto; }
    .col-author { width: 80px; white-space: nowrap; color: var(--text-secondary); font-size: 0.75rem; }
    .col-date   { width: 82px; white-space: nowrap; color: var(--text-muted); font-size: 0.72rem; }
    .col-status { width: 58px; text-align: center; white-space: nowrap; }
    .col-action { width: 86px; text-align: right; white-space: nowrap; }

    .title-cell { display: flex; align-items: center; gap: 0.4rem; min-width: 0; }
    .title-link {
      color: var(--text-primary); text-decoration: none; font-weight: 500;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;
    }
    .title-link:hover { color: var(--primary); text-decoration: underline; }

    .badge { display: inline-block; font-size: 0.62rem; padding: 0.1rem 0.4rem; border-radius: 100px; font-weight: 700; white-space: nowrap; }
    .badge-draft { background: var(--warning-light); color: #92400e; }
    .badge-done  { background: var(--success-light);  color: #065f46; }

    .act-btn {
      padding: 0.18rem 0.5rem; font-size: 0.68rem; font-weight: 700;
      border-radius: 3px; cursor: pointer; border: 1px solid var(--border);
      background: var(--bg-card); color: var(--text-secondary);
      font-family: var(--font-sans); transition: all 0.12s;
    }
    .act-btn:hover { border-color: var(--primary); color: var(--primary); }
    .act-btn.del { border-color: #fca5a5; color: #dc2626; }
    .act-btn.del:hover { background: #dc2626; color: #fff; border-color: #dc2626; }

    /* 인라인 입력 */
    .inline-row td { background: #eef2ff; padding: 0.4rem 0.75rem; }
    .inline-input {
      width: 100%; padding: 0.38rem 0.6rem; border: 1.5px solid var(--primary);
      border-radius: var(--radius-sm); font-size: 0.82rem; font-family: var(--font-sans);
      background: #fff; outline: none; color: var(--text-primary);
    }
    .inline-acts { display: flex; gap: 0.3rem; justify-content: flex-end; }
    .btn-sm {
      padding: 0.25rem 0.6rem; border-radius: 3px; font-size: 0.72rem;
      font-weight: 700; cursor: pointer; border: 1px solid var(--border);
      background: var(--bg-card); color: var(--text-secondary); font-family: var(--font-sans); transition: all 0.12s;
    }
    .btn-sm.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn-sm.primary:hover { background: var(--primary-dark); }

    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-muted); }
    .empty-state .ei { font-size: 2rem; display: block; margin-bottom: 0.6rem; }
    .empty-state p { font-size: 0.82rem; }
    .loading { text-align: center; padding: 2.5rem; color: var(--text-muted); font-size: 0.82rem; }

    /* ── 페이지네이션 ── */
    .pagination {
      display: flex; align-items: center; justify-content: center;
      gap: 0.28rem; margin-top: 0.85rem; flex-wrap: wrap;
    }
    .pg-btn {
      padding: 0.26rem 0.58rem; border: 1px solid var(--border);
      border-radius: var(--radius-sm); font-size: 0.74rem; font-weight: 600;
      cursor: pointer; background: var(--bg-card); color: var(--text-secondary);
      font-family: var(--font-sans); transition: all 0.12s; min-width: 30px; text-align: center;
    }
    .pg-btn:hover:not(:disabled):not(.active) { border-color: var(--primary); color: var(--primary); }
    .pg-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; cursor: default; }
    .pg-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .pg-info { font-size: 0.7rem; color: var(--text-muted); padding: 0 0.25rem; }

    .login-notice {
      font-size: 0.75rem; color: var(--text-muted);
      padding: 0.25rem 0.6rem; border: 1px dashed var(--border); border-radius: var(--radius-sm);
    }

    @media (max-width: 768px) {
      .btn { padding: 0.42rem 0.75rem; font-size: 0.78rem; }
      .issue-table { font-size: 0.8rem; }
      .issue-table td, .issue-table th { padding: 0.42rem 0.6rem; }
      .filter-bar { padding: 0.5rem 0.75rem; }
    }
    @media (max-width: 600px) {
      .col-author, .col-date, .col-no { display: none; }
      .toolbar { gap: 0.4rem; }
      .toolbar-title { font-size: 0.92rem; }
      .act-btn { padding: 0.22rem 0.45rem; font-size: 0.66rem; }
      .inline-input { font-size: 16px; }
      .f-input { font-size: 16px; }
      .f-date { width: 110px; }
      .f-author { display: none; }
    }
    @media (max-width: 380px) {
      .col-status { display: none; }
      .toolbar-btns { width: 100%; }
      .btn.ai, .btn.primary { flex: 1; text-align: center; justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="app-wrap">
    <header class="app-header">
      <div class="header-inner">
        <div class="header-left">
          <div class="header-logo">
            <span class="logo-icon">📋</span>
            <span class="logo-text">이슈보드</span>
          </div>
        </div>
        <div id="headerUser"></div>
      </div>
    </header>

    <main class="container">
      <div class="toolbar">
        <span class="toolbar-title">이슈 목록</span>
        <div class="toolbar-btns" id="toolbarBtns"></div>
      </div>

      <!-- 필터 바 -->
      <div class="filter-bar">
        <input type="text"  id="fQ"      class="f-input f-q"      placeholder="제목 검색..." />
        <input type="date"  id="fDate"   class="f-input f-date"   />
        <input type="text"  id="fAuthor" class="f-input f-author" placeholder="작성자" />
        <div id="filterToggles" style="display:flex;gap:0.3rem;flex-wrap:wrap"></div>
        <button class="f-reset" onclick="resetFilters()">초기화</button>
        <button class="f-search" onclick="doSearch()">검색</button>
      </div>

      <div id="tableWrap" class="loading">불러오는 중...</div>
      <div id="pagination"></div>
    </main>

    <footer class="app-footer">
      <p>© 2025 이슈보드 · Powered by Claude AI</p>
    </footer>
  </div>
  <div class="toast" id="toast"></div>

  <script src="assets/js/auth.js"></script>
  <script>
    const isLoggedIn = !!getToken();
    const me = getUser();

    renderHeader('#headerUser');

    // 로그인 상태 툴바
    if (isLoggedIn) {
      document.getElementById('toolbarBtns').innerHTML = `
        <button class="btn ai" id="btnAI" onclick="addAIIssue()">🤖 AI 이슈 만들기</button>
        <button class="btn primary" onclick="addInlineRow()">✏️ 이슈 만들기</button>`;
    } else {
      document.getElementById('toolbarBtns').innerHTML =
        '<span class="login-notice">🔒 로그인하면 이슈를 만들 수 있습니다</span>';
    }

    // 로그인 시 토글 버튼 추가
    if (isLoggedIn) {
      document.getElementById('filterToggles').innerHTML = `
        <button class="f-toggle" id="tMine"  onclick="toggleFilter('mine')">내 글</button>
        <button class="f-toggle" id="tDraft" onclick="toggleFilter('draft')">작성중</button>`;
    }

    // 필터 상태
    let fState = { mine: false, draft: false };
    let curPage = 1;
    let totalCount = 0;
    let totalPages = 1;
    const LIMIT = 30;

    // Enter 키 검색
    ['fQ','fAuthor'].forEach(id => {
      document.getElementById(id)?.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
    });

    loadIssues(1);

    function toggleFilter(key) {
      fState[key] = !fState[key];
      document.getElementById(key === 'mine' ? 'tMine' : 'tDraft')
        ?.classList.toggle('on', fState[key]);
      doSearch();
    }

    function doSearch() {
      loadIssues(1);
    }

    function resetFilters() {
      document.getElementById('fQ').value = '';
      document.getElementById('fDate').value = '';
      document.getElementById('fAuthor').value = '';
      fState = { mine: false, draft: false };
      document.getElementById('tMine')?.classList.remove('on');
      document.getElementById('tDraft')?.classList.remove('on');
      loadIssues(1);
    }

    async function loadIssues(page = 1) {
      curPage = page;
      const q      = document.getElementById('fQ')?.value.trim() || '';
      const date   = document.getElementById('fDate')?.value || '';
      const author = document.getElementById('fAuthor')?.value.trim() || '';

      const params = new URLSearchParams({ page });
      if (q)               params.set('q', q);
      if (date)            params.set('date', date);
      if (author)          params.set('author', author);
      if (fState.mine)     params.set('mine', '1');
      if (fState.draft)    params.set('draft', '1');

      document.getElementById('tableWrap').innerHTML =
        '<div class="loading">불러오는 중...</div>';
      document.getElementById('pagination').innerHTML = '';

      try {
        const res = isLoggedIn
          ? await api('/issues?' + params)
          : await fetch(API + '/issues?' + params);
        if (!res.ok) throw new Error();
        const { issues, total, pages } = await res.json();
        totalCount = total;
        totalPages = pages;
        renderTable(issues, page, total);
        renderPagination(page, pages, total);
      } catch {
        document.getElementById('tableWrap').innerHTML =
          '<div class="empty-state"><span class="ei">⚠️</span><p>목록을 불러오지 못했습니다.</p></div>';
      }
    }

    function renderTable(issues, page, total) {
      const offset = (page - 1) * LIMIT;
      document.getElementById('tableWrap').innerHTML = `
        <table class="issue-table">
          <thead><tr>
            <th class="col-no">번호</th>
            <th class="col-title">제목</th>
            <th class="col-author">작성자</th>
            <th class="col-date">작성일</th>
            <th class="col-status">상태</th>
            <th class="col-action"></th>
          </tr></thead>
          <tbody id="issueBody">
            ${issues.length === 0
              ? `<tr><td colspan="6"><div class="empty-state"><span class="ei">📄</span><p>이슈가 없습니다.</p></div></td></tr>`
              : issues.map((issue, idx) => renderRow(issue, total - offset - idx)).join('')}
          </tbody>
        </table>`;
    }

    function renderPagination(page, pages, total) {
      const el = document.getElementById('pagination');
      if (pages <= 1) { el.innerHTML = ''; return; }

      const startNum = (page - 1) * LIMIT + 1;
      const endNum   = Math.min(page * LIMIT, total);
      let html = `<span class="pg-info">${startNum}–${endNum} / 전체 ${total}건</span>`;

      html += `<button class="pg-btn" onclick="loadIssues(${page - 1})" ${page <= 1 ? 'disabled' : ''}>‹ 이전</button>`;

      const start = Math.max(1, page - 2);
      const end   = Math.min(pages, page + 2);
      for (let p = start; p <= end; p++) {
        html += `<button class="pg-btn${p === page ? ' active' : ''}" onclick="loadIssues(${p})">${p}</button>`;
      }

      html += `<button class="pg-btn" onclick="loadIssues(${page + 1})" ${page >= pages ? 'disabled' : ''}>다음 ›</button>`;
      el.innerHTML = html;
    }

    function renderRow(issue, num) {
      const date = new Date(issue.created_at).toLocaleDateString('ko-KR', { year:'2-digit', month:'2-digit', day:'2-digit' });
      const badge = issue.is_draft
        ? '<span class="badge badge-draft">작성중</span>'
        : '<span class="badge badge-done">완료</span>';
      const isMyPost = isLoggedIn && me && issue.user_id === me.id;
      const actions = isMyPost ? `
        <button class="act-btn" onclick="event.stopPropagation();editIssue(${issue.id})">편집</button>
        <button class="act-btn del" onclick="event.stopPropagation();deleteIssue(${issue.id}, this)">삭제</button>` : '';
      return `<tr>
        <td class="col-no">${num}</td>
        <td class="col-title">
          <div class="title-cell">
            <a href="write.html?id=${issue.id}" class="title-link">${escHtml(issue.title)}</a>
          </div>
        </td>
        <td class="col-author">${escHtml(issue.author)}</td>
        <td class="col-date">${date}</td>
        <td class="col-status">${badge}</td>
        <td class="col-action">${actions}</td>
      </tr>`;
    }

    function editIssue(id) { location.href = `write.html?id=${id}&mode=edit`; }

    async function deleteIssue(id, btn) {
      if (!confirm('이 이슈를 삭제하시겠습니까?')) return;
      btn.disabled = true;
      try {
        const res = await api(`/issues/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        showToast('삭제됐습니다.', 'success');
        loadIssues(curPage);
      } catch (e) { showToast(e.message || '삭제 실패', 'error'); btn.disabled = false; }
    }

    function addInlineRow() {
      if (!isLoggedIn) { showToast('로그인이 필요합니다.', 'error'); return; }
      if (document.getElementById('inlineRow')) { document.getElementById('inlineTitle').focus(); return; }
      if (!document.querySelector('.issue-table')) renderTable([], 1, 0);
      const tbody = document.getElementById('issueBody');
      const tr = document.createElement('tr');
      tr.id = 'inlineRow'; tr.className = 'inline-row';
      tr.innerHTML = `
        <td></td>
        <td class="col-title" colspan="3">
          <input type="text" id="inlineTitle" class="inline-input" placeholder="이슈 제목 입력 후 Enter" maxlength="200" />
        </td>
        <td></td>
        <td class="col-action">
          <div class="inline-acts">
            <button class="btn-sm primary" onclick="saveInlineIssue()">저장</button>
            <button class="btn-sm" onclick="cancelInlineRow()">취소</button>
          </div>
        </td>`;
      tbody.insertBefore(tr, tbody.firstChild);
      const inp = document.getElementById('inlineTitle');
      inp.focus();
      inp.addEventListener('keydown', e => {
        if (e.key === 'Enter') saveInlineIssue();
        if (e.key === 'Escape') cancelInlineRow();
      });
    }

    function cancelInlineRow() { document.getElementById('inlineRow')?.remove(); }

    async function saveInlineIssue() {
      const title = document.getElementById('inlineTitle')?.value.trim();
      if (!title) { showToast('제목을 입력하세요.', 'error'); return; }
      try {
        const res = await api('/issues', { method: 'POST', body: JSON.stringify({ title }) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        cancelInlineRow();
        showToast('이슈가 추가됐습니다.', 'success');
        loadIssues(1);
      } catch (e) { showToast(e.message || '저장 실패', 'error'); }
    }

    async function addAIIssue() {
      const btn = document.getElementById('btnAI');
      btn.disabled = true; btn.textContent = '⏳ AI 생성 중...';
      try {
        const res = await api('/topics/ai', { method: 'POST' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        showToast(`AI 이슈 추가: ${data.issue.title}`, 'success');
        loadIssues(1);
      } catch (e) { showToast(e.message || 'AI 이슈 추가 실패', 'error'); }
      finally { btn.disabled = false; btn.textContent = '🤖 AI 이슈 만들기'; }
    }

    function escHtml(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    let toastTimer;
    function showToast(msg, type = 'info') {
      const el = document.getElementById('toast');
      el.textContent = msg; el.className = `toast ${type} show`;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.className = `toast ${type}`, 2800);
    }
  </script>
</body>
</html>
