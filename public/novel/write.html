<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>소설 – AI 창작 플랫폼</title>
  <link rel="stylesheet" href="../assets/css/common.css" />
  <style>
    :root { --primary: #db2777; --primary-dark: #be185d; --primary-light: #fdf2f8; }

    /* ── 공통 버튼 ── */
    .btn {
      padding: 0.5rem 0.95rem; border-radius: var(--radius-sm); font-size: 0.83rem;
      font-weight: 700; cursor: pointer; border: 1.5px solid var(--border);
      background: var(--bg-card); color: var(--text-secondary);
      transition: all 0.15s; font-family: var(--font-sans); white-space: nowrap;
    }
    .btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
    .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn.primary:hover:not(:disabled) { background: var(--primary-dark); }
    .btn.success { background: var(--success); border-color: var(--success); color: #fff; }
    .btn.success:hover:not(:disabled) { background: #059669; }
    .btn.sm { padding: 0.35rem 0.7rem; font-size: 0.77rem; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── 편집 워크스페이스 (고정 높이) ── */
    body.edit-mode { overflow: hidden; }
    .edit-workspace {
      display: flex; flex-direction: column;
      height: calc(100vh - 3.4rem);
    }

    /* ── 조회 워크스페이스 (자연 흐름) ── */
    .view-workspace {
      display: flex; flex-direction: column;
    }

    /* ── 공통: 워크스페이스 헤더 ── */
    .ws-header {
      flex-shrink: 0;
      padding: 0.5rem 1rem;
      background: var(--bg-card); border-bottom: 1.5px solid var(--border);
      display: flex; align-items: center; gap: 0.6rem;
      box-shadow: var(--shadow-sm);
    }
    .ws-back { font-size: 0.78rem; font-weight: 600; color: var(--text-muted); text-decoration: none; white-space: nowrap; }
    .ws-back:hover { color: var(--primary); }
    .ws-title-input {
      flex: 1; min-width: 0;
      padding: 0.42rem 0.75rem;
      border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      font-size: 0.9rem; font-weight: 700; font-family: var(--font-sans);
      outline: none; background: var(--bg); color: var(--text-primary);
      transition: border-color 0.15s;
    }
    .ws-title-input:focus { border-color: var(--primary); }
    .view-title-txt { font-size: 0.95rem; font-weight: 800; color: var(--text-primary); flex: 1; min-width: 0; }
    .view-title-sub { font-size: 0.72rem; color: var(--text-muted); white-space: nowrap; }

    /* ── 공통: 워크스페이스 바디 ── */
    .ws-body { flex: 1; display: flex; overflow: hidden; }
    .view-workspace .ws-body { overflow: visible; min-height: 420px; }

    /* ── 사이드바 ── */
    .ws-sidebar {
      width: 240px; flex-shrink: 0;
      background: var(--bg-card); border-right: 1.5px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .view-workspace .ws-sidebar { overflow: visible; }
    .sidebar-top { padding: 0.55rem; border-bottom: 1px solid var(--border); }
    .btn-refinfo {
      width: 100%; padding: 0.46rem 0.75rem;
      background: var(--primary-light); border: 1px solid #fbcfe8;
      border-radius: var(--radius-sm); font-size: 0.77rem; font-weight: 700;
      color: #be185d; cursor: pointer; text-align: left;
      font-family: var(--font-sans); transition: all 0.15s;
    }
    .btn-refinfo:hover, .btn-refinfo.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .menu-tree { flex: 1; overflow-y: auto; padding: 0.3rem; }
    .view-workspace .menu-tree { overflow-y: visible; }
    .sidebar-bottom { padding: 0.5rem; border-top: 1px solid var(--border); }
    .btn-add-menu {
      width: 100%; padding: 0.4rem 0.75rem;
      background: none; border: 1.5px dashed var(--border);
      border-radius: var(--radius-sm); font-size: 0.75rem; font-weight: 700;
      color: var(--text-muted); cursor: pointer; font-family: var(--font-sans); transition: all 0.15s;
    }
    .btn-add-menu:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }

    /* ── 트리 노드 ── */
    .tree-node { margin: 1px 0; }
    .tree-row {
      display: flex; align-items: center; gap: 0.2rem;
      padding: 0.28rem 0.4rem; border-radius: var(--radius-sm);
      cursor: pointer; transition: background 0.1s; user-select: none; min-height: 1.9rem;
    }
    .tree-row:hover { background: var(--primary-light); }
    .tree-row.selected { background: var(--primary); }
    .tree-expand {
      width: 1rem; height: 1rem; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.52rem; color: var(--text-muted); cursor: pointer;
    }
    .tree-row.selected .tree-expand { color: rgba(255,255,255,0.6); }
    .tree-title {
      flex: 1; font-size: 0.77rem; font-weight: 600; color: var(--text-primary);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .tree-row.selected .tree-title { color: #fff; }
    .tree-btns { display: flex; gap: 0.1rem; flex-shrink: 0; opacity: 0; transition: opacity 0.1s; }
    .tree-row:hover .tree-btns, .tree-row.selected .tree-btns { opacity: 1; }
    .tree-btn {
      width: 1.15rem; height: 1.15rem; border: none;
      background: rgba(0,0,0,0.06); cursor: pointer; font-size: 0.6rem;
      display: flex; align-items: center; justify-content: center;
      border-radius: 3px; color: var(--text-secondary); transition: all 0.1s;
      font-family: var(--font-sans);
    }
    .tree-btn:hover { background: rgba(0,0,0,0.15); }
    .tree-row.selected .tree-btn { background: rgba(255,255,255,0.2); color: #fff; }
    .tree-row.selected .tree-btn:hover { background: rgba(255,255,255,0.35); }
    .tree-btn.vis-on  { color: #db2777; }
    .tree-row.selected .tree-btn.vis-on { color: #fce7f3; }
    .tree-children { margin-left: 1rem; border-left: 1px dashed #e2e8f0; padding-left: 0.15rem; }

    /* ── 메인 패널 ── */
    .ws-main { flex: 1; overflow-y: auto; background: var(--bg); }
    .view-workspace .ws-main { overflow-y: visible; }
    .main-empty {
      height: 100%; display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); font-size: 0.83rem; text-align: center; padding: 2rem;
      flex-direction: column; gap: 0.5rem;
    }
    .main-empty strong { color: var(--text-secondary); font-size: 0.9rem; }

    /* ── 노드 편집 / 조회 패널 ── */
    .node-panel, .ref-panel, .view-node-panel {
      padding: 1.2rem 1.5rem; max-width: 820px;
      display: flex; flex-direction: column; gap: 0.9rem;
    }
    .panel-heading {
      font-size: 0.82rem; font-weight: 700; color: var(--text-secondary);
      border-bottom: 1.5px solid var(--primary-light); padding-bottom: 0.45rem;
    }
    .node-title-input {
      width: 100%; padding: 0.52rem 0.8rem;
      border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      font-size: 0.93rem; font-weight: 700; font-family: var(--font-sans);
      outline: none; background: var(--bg-card); color: var(--text-primary);
      transition: border-color 0.15s;
    }
    .node-title-input:focus { border-color: var(--primary); }
    .node-content-ta {
      width: 100%; padding: 0.8rem 0.95rem;
      border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      font-size: 0.87rem; line-height: 1.85; font-family: var(--font-sans);
      outline: none; background: var(--bg-card); color: var(--text-primary);
      resize: vertical; min-height: 260px; transition: border-color 0.15s;
    }
    .node-content-ta:focus { border-color: var(--primary); }
    .node-content-ta::placeholder { color: var(--text-muted); }

    /* 조회 전용: 내용 표시 */
    .view-node-title {
      font-size: 1rem; font-weight: 800; color: var(--text-primary);
      border-bottom: 2px solid var(--primary-light); padding-bottom: 0.5rem;
    }
    .view-node-body {
      font-size: 0.9rem; line-height: 2; color: var(--text-primary);
      white-space: pre-wrap; word-break: break-word; min-height: 120px;
    }
    .view-node-empty { color: var(--text-muted); font-style: italic; font-size: 0.85rem; }

    /* 하위메뉴 가져오기 바 */
    .import-bar {
      display: flex; align-items: center; gap: 0.6rem; padding: 0.55rem 0.8rem;
      background: #f0fdf4; border: 1px solid #86efac; border-radius: var(--radius-sm);
      flex-wrap: wrap;
    }
    .import-hint { font-size: 0.7rem; color: #15803d; }

    /* AI 다듬기 섹션 */
    .ai-section {
      background: var(--bg-card); border: 1.5px solid #fbcfe8;
      border-radius: var(--radius-md); overflow: hidden;
    }
    .ai-sec-head {
      padding: 0.45rem 0.85rem; background: var(--primary-light);
      border-bottom: 1px solid #fbcfe8;
      font-size: 0.76rem; font-weight: 700; color: #be185d;
    }
    .ai-bar { padding: 0.55rem 0.85rem; display: flex; gap: 0.5rem; align-items: center; }
    .ai-guide-input {
      flex: 1; padding: 0.42rem 0.7rem;
      border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      font-size: 0.82rem; font-family: var(--font-sans);
      outline: none; background: var(--bg); color: var(--text-primary); transition: border-color 0.15s;
    }
    .ai-guide-input:focus { border-color: var(--primary); }
    .ai-guide-input::placeholder { color: var(--text-muted); font-style: italic; }
    .polish-result { padding: 0.85rem; border-top: 1px solid #fbcfe8; display: none; }
    .polish-label { font-size: 0.7rem; font-weight: 700; color: #be185d; margin-bottom: 0.45rem; }
    .polish-text {
      font-size: 0.85rem; line-height: 1.85; color: var(--text-primary); white-space: pre-wrap;
      background: #fff; padding: 0.7rem 0.85rem; border-radius: var(--radius-sm);
      border: 1px solid #fbcfe8; margin-bottom: 0.5rem; word-break: break-word;
    }
    .polish-acts { display: flex; gap: 0.4rem; }
    .node-save-bar { display: flex; justify-content: flex-end; gap: 0.4rem; }

    /* ── 기준정보 패널 ── */
    .ref-panel-title {
      font-size: 1rem; font-weight: 800; color: #be185d;
      border-bottom: 2px solid #fbcfe8; padding-bottom: 0.5rem; margin-bottom: 0.2rem;
    }
    .ref-group { display: flex; flex-direction: column; gap: 0.28rem; }
    .ref-label { font-size: 0.76rem; font-weight: 700; color: var(--text-secondary); }
    .ref-textarea {
      width: 100%; padding: 0.6rem 0.8rem;
      border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      font-size: 0.84rem; line-height: 1.7; font-family: var(--font-sans);
      outline: none; background: var(--bg-card); color: var(--text-primary);
      resize: vertical; min-height: 80px; transition: border-color 0.15s;
    }
    .ref-textarea:focus { border-color: var(--primary); }
    .ref-textarea::placeholder { color: var(--text-muted); }
    .file-row { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .ref-summary-box {
      background: var(--primary-light); border: 1px solid #fbcfe8;
      border-radius: var(--radius-sm); padding: 0.8rem;
    }
    .ref-summary-lbl { font-size: 0.7rem; font-weight: 700; color: #be185d; margin-bottom: 0.4rem; }
    .ref-summary-txt { font-size: 0.82rem; line-height: 1.7; color: var(--text-primary); white-space: pre-wrap; word-break: break-word; }

    /* ── 반응 / 댓글 (조회 하단) ── */
    main.container { max-width: 92%; width: 92%; padding: 1.25rem 1rem; }
    .react-btn {
      padding: 0.14rem 0.48rem; border: 1px solid var(--border); border-radius: 100px;
      font-size: 0.7rem; font-weight: 600; cursor: pointer; background: var(--bg);
      color: var(--text-secondary); font-family: var(--font-sans);
      transition: all 0.12s; display: inline-flex; align-items: center; gap: 0.18rem;
    }
    .react-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
    .react-btn.active-like    { background: #dbeafe; border-color: #93c5fd; color: #1d4ed8; }
    .react-btn.active-dislike { background: #fee2e2; border-color: #fca5a5; color: #dc2626; }
    .comments-section {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 1.1rem 1.25rem; margin-bottom: 1.25rem;
    }
    .comments-header {
      font-size: 0.88rem; font-weight: 800; color: var(--text-primary);
      margin-bottom: 1rem; display: flex; align-items: center; gap: 0.4rem;
      padding-bottom: 0.65rem; border-bottom: 1px solid var(--border);
    }
    .comment-count-badge {
      font-size: 0.7rem; padding: 0.06rem 0.4rem; border-radius: 100px;
      background: var(--primary-light); color: var(--primary); font-weight: 700;
    }
    .comment-item { padding: 0.78rem 0; border-bottom: 1px solid #f1f5f9; }
    .comment-item:last-child { border-bottom: none; }
    .comment-meta { display: flex; align-items: center; gap: 0.45rem; margin-bottom: 0.3rem; }
    .comment-author { font-size: 0.72rem; font-weight: 700; }
    .comment-date   { font-size: 0.64rem; color: var(--text-muted); }
    .comment-body   { font-size: 0.76rem; line-height: 1.65; white-space: pre-wrap; word-break: break-word; margin-bottom: 0.38rem; }
    .comment-actions { display: flex; align-items: center; gap: 0.28rem; }
    .comment-del-btn {
      margin-left: auto; padding: 0.15rem 0.45rem; border: 1px solid #fca5a5;
      border-radius: var(--radius-sm); font-size: 0.66rem; color: #dc2626;
      cursor: pointer; background: none; font-family: var(--font-sans); transition: all 0.12s;
    }
    .comment-del-btn:hover { background: #dc2626; color: #fff; }
    .empty-comments { text-align: center; padding: 1.5rem; color: var(--text-muted); font-size: 0.8rem; }
    .comment-form { margin-top: 0.9rem; display: flex; flex-direction: column; gap: 0.42rem; }
    .comment-textarea {
      width: 100%; padding: 0.65rem 0.85rem; border: 1.5px solid var(--border);
      border-radius: var(--radius-sm); font-size: 0.85rem; font-family: var(--font-sans);
      resize: vertical; min-height: 70px; outline: none; background: var(--bg);
      color: var(--text-primary); line-height: 1.6; transition: border-color 0.15s;
    }
    .comment-textarea:focus { border-color: var(--primary); }
    .comment-submit-row { display: flex; justify-content: flex-end; }
    .btn-comment-submit {
      padding: 0.42rem 1.05rem; background: var(--primary); color: #fff;
      border: none; border-radius: var(--radius-sm); font-size: 0.82rem;
      font-weight: 700; cursor: pointer; font-family: var(--font-sans); transition: background 0.15s;
    }
    .btn-comment-submit:hover:not(:disabled) { background: var(--primary-dark); }
    .btn-comment-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .comment-login-notice {
      margin-top: 0.85rem; text-align: center; padding: 0.72rem; font-size: 0.78rem;
      color: var(--text-muted); border: 1px dashed var(--border); border-radius: var(--radius-sm);
      cursor: pointer; transition: all 0.12s;
    }
    .comment-login-notice:hover { border-color: var(--primary); color: var(--primary); }
  </style>
</head>
<body>
  <div class="app-wrap">
    <header class="app-header">
      <div class="header-inner">
        <div class="header-left">
          <div class="header-logo">
            <a href="../index.html" class="back-link">
              <span class="logo-icon">✍️</span>
              <span class="logo-text">창작플랫폼</span>
            </a>
          </div>
        </div>
        <div id="headerUser"></div>
      </div>
    </header>

    <!-- ── 편집 워크스페이스 ── -->
    <div id="editWorkspace" class="edit-workspace" style="display:none">
      <div class="ws-header">
        <a href="novels.html" class="ws-back">← 목록</a>
        <input id="wsTitleInput" class="ws-title-input" placeholder="소설 제목을 입력하세요" maxlength="200" />
        <button class="btn sm" id="btnWsSave" onclick="saveNovelTitle()">📌 임시저장</button>
        <button class="btn success sm" id="btnWsComplete" onclick="publishNovel()">✅ 소설 완성</button>
      </div>
      <div class="ws-body">
        <div class="ws-sidebar">
          <div class="sidebar-top">
            <button id="btnRefInfo" class="btn-refinfo" onclick="showRefPanel()">⚙️ 기준정보 설정</button>
          </div>
          <div class="menu-tree" id="menuTree">
            <div style="text-align:center;padding:1.5rem;font-size:.75rem;color:var(--text-muted)">
              아래 버튼으로 메뉴를 추가하세요
            </div>
          </div>
          <div class="sidebar-bottom">
            <button class="btn-add-menu" onclick="addRootNode()">+ 최상위 메뉴 추가</button>
          </div>
        </div>
        <div class="ws-main" id="wsMain">
          <div id="mainEmpty" class="main-empty">
            <strong>메뉴를 선택하거나 추가하세요</strong>
            <span>왼쪽에서 메뉴를 선택하면 내용을 작성할 수 있습니다.</span>
          </div>
          <div id="nodePanel" style="display:none"></div>
          <div id="refPanel"  style="display:none"></div>
        </div>
      </div>
    </div>

    <!-- ── 조회 워크스페이스 ── -->
    <div id="viewWorkspace" class="view-workspace" style="display:none">
      <div class="ws-header">
        <a href="novels.html" class="ws-back">← 목록</a>
        <div style="flex:1;min-width:0">
          <div id="viewNovelTitle" class="view-title-txt"></div>
        </div>
        <div id="viewNovelSub" class="view-title-sub"></div>
        <div id="viewReactBar"   style="display:flex;gap:.3rem;align-items:center"></div>
        <div id="viewTopActions" style="display:flex;gap:.4rem;flex-shrink:0"></div>
      </div>
      <div class="ws-body">
        <div class="ws-sidebar">
          <div class="menu-tree" id="viewMenuTree">
            <div style="text-align:center;padding:1.5rem;font-size:.75rem;color:var(--text-muted)">
              노출된 메뉴가 없습니다
            </div>
          </div>
        </div>
        <div class="ws-main" id="viewMain">
          <div id="viewEmpty" class="main-empty">
            <strong>메뉴를 선택하세요</strong>
            <span>왼쪽에서 메뉴를 선택하면 내용을 볼 수 있습니다.</span>
          </div>
          <div id="viewNodePanel" style="display:none"></div>
        </div>
      </div>
    </div>

    <!-- ── 조회 하단: 반응 + 댓글 ── -->
    <main class="container" id="viewFooter" style="display:none">
      <div id="novelReactSection" style="margin-bottom:.75rem;display:flex;gap:.3rem;align-items:center"></div>
      <div class="comments-section" id="commentsSection" style="display:none">
        <div class="comments-header">
          💬 댓글 <span class="comment-count-badge" id="commentCountBadge">0</span>
        </div>
        <div id="commentList"></div>
        <div id="commentFormWrap"></div>
      </div>
    </main>

    <footer class="app-footer" id="appFooter">
      <p>웹소설 창작 · Powered by 유승주</p>
    </footer>
  </div>
  <div class="toast" id="toast"></div>

  <script src="../assets/js/auth.js"></script>
  <script>
    const params     = new URLSearchParams(location.search);
    const novelId    = params.get('id');
    const isEditMode = params.get('mode') === 'edit';
    const isLoggedIn = !!getToken();
    const me         = getUser();

    let isAuthor = false;
    let nodes    = [];
    let expanded = new Set();
    let selId    = null;
    let refInfo  = {};
    let refSummary = '';
    let refFiles = [];
    let polishedText = null;

    // 조회 모드용
    let viewNodes  = [];
    let viewExpanded = new Set();
    let viewSelId  = null;

    renderHeader('#headerUser');

    if (!novelId) {
      if (!isLoggedIn) { openLoginModal(); }
      else { isAuthor = true; showEditWorkspace({ title: '', id: null }); }
    } else {
      loadNovel();
    }

    /* ═══════════════════════════════════════════
       소설 불러오기
    ═══════════════════════════════════════════ */
    async function loadNovel() {
      try {
        const hdrs = isLoggedIn ? { Authorization: `Bearer ${getToken()}` } : {};
        const res = await fetch(API + '/novel/novels/' + novelId, { headers: hdrs });
        if (res.status === 403) { location.href = '../index.html'; return; }
        if (!res.ok) throw new Error();
        const { novel } = await res.json();
        isAuthor = isLoggedIn && me && novel.user_id === me.id;

        if (isEditMode && isAuthor) showEditWorkspace(novel);
        else                        showViewMode(novel);
      } catch { showToast('소설을 불러오지 못했습니다.', 'error'); }
    }

    /* ═══════════════════════════════════════════
       편집 워크스페이스
    ═══════════════════════════════════════════ */
    async function showEditWorkspace(novel) {
      document.getElementById('editWorkspace').style.display = 'flex';
      document.getElementById('viewWorkspace').style.display = 'none';
      document.getElementById('viewFooter').style.display    = 'none';
      document.getElementById('appFooter').style.display     = 'none';
      document.body.classList.add('edit-mode');
      document.getElementById('wsTitleInput').value = novel.title || '';
      if (novelId) {
        await loadNodes();
        await loadRefInfo();
      }
    }

    async function loadNodes() {
      try {
        const res = await api(`/novel/novels/${novelId}/nodes`);
        const d = await res.json();
        if (!res.ok) throw new Error(d.error);
        nodes = d.nodes;
        renderTree();
      } catch (e) { showToast(e.message || '메뉴를 불러오지 못했습니다.', 'error'); }
    }

    /* ── 편집 트리 렌더링 ── */
    function renderTree() {
      document.getElementById('menuTree').innerHTML = buildEditTreeHtml(null, 0) ||
        '<div style="text-align:center;padding:1.5rem;font-size:.75rem;color:var(--text-muted)">아래 버튼으로 메뉴를 추가하세요</div>';
    }

    function buildEditTreeHtml(parentId, depth) {
      const children = nodes
        .filter(n => (n.parent_id ?? null) === parentId)
        .sort((a, b) => a.position - b.position);
      if (!children.length) return '';

      return children.map(n => {
        const hasKids = nodes.some(c => (c.parent_id ?? null) === n.id);
        const isExp   = expanded.has(n.id);
        const isSel   = selId === n.id;
        const pl      = 0.4 + depth * 0.9;
        const visClass = n.is_visible ? 'tree-btn vis-on' : 'tree-btn';
        const visTitle = n.is_visible ? '노출중 (클릭시 숨김)' : '숨김 (클릭시 노출)';
        const visIcon  = n.is_visible ? '👁' : '🙈';
        return `
          <div class="tree-node" data-id="${n.id}">
            <div class="tree-row${isSel ? ' selected' : ''}" style="padding-left:${pl}rem"
                 onclick="selectNode(${n.id})">
              <span class="tree-expand" onclick="event.stopPropagation();toggleExpand(${n.id})">
                ${hasKids ? (isExp ? '▼' : '▶') : '·'}
              </span>
              <span class="tree-title">${escHtml(n.title || '(제목 없음)')}</span>
              <div class="tree-btns">
                <button class="tree-btn" onclick="event.stopPropagation();addChildNode(${n.id})" title="하위 메뉴 추가">+</button>
                <button class="${visClass}" onclick="event.stopPropagation();toggleVisibility(${n.id})" title="${visTitle}">${visIcon}</button>
                <button class="tree-btn" onclick="event.stopPropagation();confirmDeleteNode(${n.id})" title="삭제">×</button>
              </div>
            </div>
            <div id="tc-${n.id}" style="display:${isExp ? 'block' : 'none'}">
              <div class="tree-children">${buildEditTreeHtml(n.id, depth + 1)}</div>
            </div>
          </div>`;
      }).join('');
    }

    function toggleExpand(id) {
      if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
      renderTree();
    }

    /* ── 노출 토글 ── */
    async function toggleVisibility(nodeId) {
      const node = nodes.find(n => n.id === nodeId);
      if (!node) return;
      const newVal = !node.is_visible;
      try {
        const res = await api(`/novel/nodes/${nodeId}`, {
          method: 'PUT', body: JSON.stringify({ is_visible: newVal })
        });
        const d = await res.json();
        if (!res.ok) throw new Error(d.error);
        const idx = nodes.findIndex(n => n.id === nodeId);
        if (idx !== -1) nodes[idx].is_visible = newVal;
        renderTree();
        showToast(newVal ? '조회 모드에 노출됩니다.' : '조회 모드에서 숨겨집니다.', 'success');
      } catch (e) { showToast(e.message || '처리 실패', 'error'); }
    }

    /* ── 노드 선택 (편집) ── */
    function selectNode(id) {
      selId = id;
      document.getElementById('btnRefInfo').classList.remove('active');
      renderTree();
      const node = nodes.find(n => n.id === id);
      if (node) showNodePanel(node);
    }

    function showNodePanel(node) {
      const hasKids = nodes.some(n => (n.parent_id ?? null) === node.id);
      document.getElementById('mainEmpty').style.display = 'none';
      document.getElementById('refPanel').style.display  = 'none';
      const panel = document.getElementById('nodePanel');
      panel.style.display = 'block';

      panel.innerHTML = `
        <div class="node-panel">
          <div class="panel-heading">📝 메뉴 편집</div>
          <input id="nodeTitle" class="node-title-input"
                 value="${escHtml(node.title || '')}"
                 placeholder="메뉴 제목을 입력하세요" maxlength="200" />
          <textarea id="nodeContent" class="node-content-ta" rows="12"
                    placeholder="내용을 입력하세요...">${escHtml(node.content || '')}</textarea>
          ${hasKids ? `
          <div class="import-bar">
            <button class="btn sm" onclick="importChildren(${node.id})">📥 하위메뉴 글 가져오기</button>
            <span class="import-hint">하위 메뉴 내용을 순서대로 이 칸에 붙여옵니다</span>
          </div>` : ''}
          <div class="ai-section">
            <div class="ai-sec-head">✨ AI 다듬기</div>
            <div class="ai-bar">
              <input id="aiGuide" class="ai-guide-input"
                     placeholder="AI 가이드 (예: 긴장감 있게, 서정적으로...)">
              <button class="btn primary sm" id="btnPolish"
                      onclick="polishContent(${node.id})">AI 다듬기</button>
            </div>
            <div class="polish-result" id="polishResult">
              <div class="polish-label">✨ AI 다듬기 결과</div>
              <div class="polish-text" id="polishText"></div>
              <div class="polish-acts">
                <button class="btn primary sm" onclick="applyPolish()">✅ 적용</button>
                <button class="btn sm" onclick="document.getElementById('polishResult').style.display='none'">취소</button>
              </div>
            </div>
          </div>
          <div class="node-save-bar">
            <button class="btn primary" onclick="saveNode(${node.id})">💾 저장</button>
          </div>
        </div>`;
    }

    function importChildren(parentId) {
      const kids = nodes
        .filter(n => (n.parent_id ?? null) === parentId)
        .sort((a, b) => a.position - b.position);
      const content = kids.map(k => k.content || '').filter(Boolean).join('\n\n');
      if (!content) { showToast('하위 메뉴에 내용이 없습니다.', 'error'); return; }
      document.getElementById('nodeContent').value = content;
      showToast('하위 메뉴 내용을 가져왔습니다.', 'success');
    }

    async function polishContent(nodeId) {
      const content = document.getElementById('nodeContent')?.value;
      if (!content?.trim()) { showToast('내용을 먼저 입력하세요.', 'error'); return; }
      const guide = document.getElementById('aiGuide')?.value.trim();
      const btn = document.getElementById('btnPolish');
      btn.disabled = true; btn.textContent = '처리 중...';
      try {
        const res = await api(`/novel/nodes/${nodeId}/polish`, {
          method: 'POST', body: JSON.stringify({ guide, content })
        });
        const d = await res.json();
        if (!res.ok) throw new Error(d.error);
        polishedText = d.content;
        document.getElementById('polishText').textContent = d.content;
        const r = document.getElementById('polishResult');
        r.style.display = 'block';
        r.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      } catch (e) { showToast(e.message || 'AI 다듬기 실패', 'error'); }
      finally { btn.disabled = false; btn.textContent = 'AI 다듬기'; }
    }

    function applyPolish() {
      if (!polishedText) return;
      document.getElementById('nodeContent').value = polishedText;
      document.getElementById('polishResult').style.display = 'none';
      polishedText = null;
      showToast('적용됐습니다.', 'success');
    }

    async function saveNode(nodeId) {
      const title   = document.getElementById('nodeTitle')?.value.trim();
      const content = document.getElementById('nodeContent')?.value;
      if (!title) { showToast('메뉴 제목을 입력하세요.', 'error'); return; }
      try {
        const res = await api(`/novel/nodes/${nodeId}`, {
          method: 'PUT', body: JSON.stringify({ title, content })
        });
        const d = await res.json();
        if (!res.ok) throw new Error(d.error);
        const idx = nodes.findIndex(n => n.id === nodeId);
        if (idx !== -1) nodes[idx] = { ...nodes[idx], title, content };
        renderTree();
        showToast('저장됐습니다.', 'success');
      } catch (e) { showToast(e.message || '저장 실패', 'error'); }
    }

    /* ── 메뉴 추가 / 삭제 ── */
    async function addRootNode() { await addNodeWithParent(null); }
    async function addChildNode(parentId) {
      expanded.add(parentId);
      await addNodeWithParent(parentId);
    }

    async function addNodeWithParent(parentId) {
      if (!novelId) {
        const title = document.getElementById('wsTitleInput')?.value.trim();
        if (!title) { showToast('소설 제목을 먼저 입력하고 저장하세요.', 'error'); return; }
        await saveNovelTitle(); return;
      }
      try {
        const res = await api(`/novel/novels/${novelId}/nodes`, {
          method: 'POST', body: JSON.stringify({ parent_id: parentId, title: '새 메뉴' })
        });
        const d = await res.json();
        if (!res.ok) throw new Error(d.error);
        nodes.push(d.node);
        renderTree();
        selectNode(d.node.id);
        showToast('메뉴가 추가됐습니다.', 'success');
      } catch (e) { showToast(e.message || '메뉴 추가 실패', 'error'); }
    }

    function confirmDeleteNode(id) {
      const node = nodes.find(n => n.id === id);
      const hasKids = nodes.some(n => (n.parent_id ?? null) === id);
      const msg = hasKids
        ? `"${node?.title || '메뉴'}"와 모든 하위 메뉴를 삭제하시겠습니까?`
        : `"${node?.title || '메뉴'}"를 삭제하시겠습니까?`;
      if (!confirm(msg)) return;
      deleteNode(id);
    }

    async function deleteNode(id) {
      try {
        const res = await api(`/novel/nodes/${id}`, { method: 'DELETE' });
        const d = await res.json();
        if (!res.ok) throw new Error(d.error);
        removeDescendants(id);
        if (selId === id) {
          selId = null;
          document.getElementById('nodePanel').style.display = 'none';
          document.getElementById('mainEmpty').style.display = 'flex';
        }
        renderTree();
        showToast('삭제됐습니다.', 'success');
      } catch (e) { showToast(e.message || '삭제 실패', 'error'); }
    }

    function removeDescendants(id) {
      nodes.filter(n => (n.parent_id ?? null) === id).forEach(c => removeDescendants(c.id));
      nodes = nodes.filter(n => n.id !== id);
    }

    /* ── 기준정보 ── */
    async function loadRefInfo() {
      try {
        const res = await api(`/novel/novels/${novelId}/refinfo`);
        const d = await res.json();
        if (!res.ok) return;
        refInfo    = d.ref_info || {};
        refSummary = d.ref_summary || '';
        refFiles   = refInfo.files || [];
      } catch {}
    }

    function showRefPanel() {
      selId = null; renderTree();
      document.getElementById('mainEmpty').style.display = 'none';
      document.getElementById('nodePanel').style.display = 'none';
      document.getElementById('btnRefInfo').classList.add('active');
      document.getElementById('refPanel').style.display = 'block';
      renderRefPanel();
    }

    function renderRefPanel() {
      const filesHtml = refFiles.map((f, i) =>
        `<span style="font-size:.72rem;background:#f1f5f9;padding:.1rem .4rem;border-radius:3px">
          ${escHtml(f.name)} <button onclick="removeRefFile(${i})" style="border:none;background:none;cursor:pointer;color:#dc2626;font-size:.6rem">×</button>
        </span>`
      ).join('');

      document.getElementById('refPanel').innerHTML = `
        <div class="ref-panel">
          <div class="ref-panel-title">⚙️ 기준정보 설정</div>
          <div class="ref-group"><label class="ref-label">인물 정보</label>
            <textarea id="refChars" class="ref-textarea" rows="4" placeholder="등장인물, 성격, 관계...">${escHtml(refInfo.characters || '')}</textarea></div>
          <div class="ref-group"><label class="ref-label">기술 / 세계관</label>
            <textarea id="refTech" class="ref-textarea" rows="3" placeholder="마법, 기술 체계, 세계관...">${escHtml(refInfo.tech || '')}</textarea></div>
          <div class="ref-group"><label class="ref-label">주요 내용 / 줄거리</label>
            <textarea id="refPlot" class="ref-textarea" rows="3" placeholder="핵심 줄거리, 중요 사건...">${escHtml(refInfo.plot || '')}</textarea></div>
          <div class="ref-group"><label class="ref-label">목표 / 방향</label>
            <textarea id="refGoals" class="ref-textarea" rows="2" placeholder="소설의 목표, 결말 방향...">${escHtml(refInfo.goals || '')}</textarea></div>
          <div class="ref-group"><label class="ref-label">참고 글씨체 파일 <span style="font-size:.68rem;color:var(--text-muted)">(.txt, .md)</span></label>
            <div class="file-row">
              <input type="file" id="refFileInput" accept=".txt,.md" multiple onchange="handleRefFile(event)" style="display:none">
              <button class="btn sm" onclick="document.getElementById('refFileInput').click()">📁 파일 선택</button>
              <div style="display:flex;gap:.3rem;flex-wrap:wrap;align-items:center">${filesHtml || '<span style="font-size:.72rem;color:var(--text-muted)">선택된 파일 없음</span>'}</div>
            </div></div>
          <div class="ref-group"><label class="ref-label">작성 스타일</label>
            <textarea id="refStyle" class="ref-textarea" rows="3" placeholder="문체, 시점, 분위기, 톤...">${escHtml(refInfo.style || '')}</textarea></div>
          <div style="display:flex;justify-content:flex-end">
            <button class="btn primary" id="btnSaveRef" onclick="saveRefInfoData()">💾 저장 &amp; AI 요약</button>
          </div>
          ${refSummary ? `
          <div class="ref-summary-box">
            <div class="ref-summary-lbl">📋 AI 요약</div>
            <div class="ref-summary-txt">${escHtml(refSummary)}</div>
          </div>` : ''}
        </div>`;
    }

    function handleRefFile(e) {
      Array.from(e.target.files).forEach(f => {
        const reader = new FileReader();
        reader.onload = ev => {
          refFiles = refFiles.filter(x => x.name !== f.name);
          refFiles.push({ name: f.name, content: ev.target.result });
          renderRefPanel();
        };
        reader.readAsText(f);
      });
      e.target.value = '';
    }

    function removeRefFile(idx) { refFiles.splice(idx, 1); renderRefPanel(); }

    async function saveRefInfoData() {
      const btn = document.getElementById('btnSaveRef');
      btn.disabled = true; btn.textContent = '요약 중...';
      const data = {
        characters: document.getElementById('refChars')?.value  || '',
        tech:       document.getElementById('refTech')?.value   || '',
        plot:       document.getElementById('refPlot')?.value   || '',
        goals:      document.getElementById('refGoals')?.value  || '',
        style:      document.getElementById('refStyle')?.value  || '',
        files: refFiles,
      };
      try {
        const res = await api(`/novel/novels/${novelId}/refinfo`, {
          method: 'PUT', body: JSON.stringify(data)
        });
        const d = await res.json();
        if (!res.ok) throw new Error(d.error);
        refInfo = data; refSummary = d.summary;
        renderRefPanel();
        showToast('기준정보가 저장됐습니다.', 'success');
      } catch (e) { showToast(e.message || '저장 실패', 'error'); }
      finally { const b = document.getElementById('btnSaveRef'); if (b) { b.disabled = false; b.textContent = '💾 저장 & AI 요약'; } }
    }

    /* ── 임시저장 (작성중으로 복귀) ── */
    async function saveNovelTitle() {
      const title = document.getElementById('wsTitleInput')?.value.trim();
      if (!title) { showToast('제목을 입력하세요.', 'error'); return; }
      const btn = document.getElementById('btnWsSave');
      btn.disabled = true; btn.textContent = '저장 중...';
      try {
        if (!novelId) {
          const r = await api('/novel/novels', { method: 'POST', body: JSON.stringify({ title }) });
          const d = await r.json();
          if (!r.ok) throw new Error(d.error);
          location.href = `write.html?id=${d.novel.id}&mode=edit`;
          return;
        }
        // 제목 저장 + is_published = false (작성중으로 복귀)
        const r = await api(`/novel/novels/${novelId}`, {
          method: 'PUT', body: JSON.stringify({ title, is_published: false })
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error);
        showToast('저장됐습니다. (작성중 상태)', 'success');
      } catch (e) { showToast(e.message || '저장 실패', 'error'); }
      finally { btn.disabled = false; btn.textContent = '📌 임시저장'; }
    }

    /* ── 소설 완성 (발행) ── */
    async function publishNovel() {
      if (!novelId) { showToast('먼저 제목을 저장하세요.', 'error'); return; }
      const synopsis = assembleContent(null);
      if (!confirm('소설을 완성하면 조회 모드로 전환됩니다. 계속하시겠습니까?')) return;
      const btn = document.getElementById('btnWsComplete');
      btn.disabled = true; btn.textContent = '처리 중...';
      try {
        const title = document.getElementById('wsTitleInput')?.value.trim();
        await api(`/novel/novels/${novelId}`, { method: 'PUT', body: JSON.stringify({ title }) });
        await api(`/novel/novels/${novelId}/episodes`, {
          method: 'POST',
          body: JSON.stringify({ episodes: [], is_published: true, novel_content: synopsis })
        });
        showToast('소설이 완성됐습니다!', 'success');
        setTimeout(() => location.href = `write.html?id=${novelId}`, 800);
      } catch (e) { showToast(e.message || '처리 실패', 'error'); }
      finally { btn.disabled = false; btn.textContent = '✅ 소설 완성'; }
    }

    function assembleContent(parentId) {
      return nodes
        .filter(n => (n.parent_id ?? null) === parentId)
        .sort((a, b) => a.position - b.position)
        .map(n => n.content?.trim() ? n.content.trim() : assembleContent(n.id))
        .filter(Boolean).join('\n\n');
    }

    /* ═══════════════════════════════════════════
       조회 모드
    ═══════════════════════════════════════════ */
    async function showViewMode(novel) {
      document.getElementById('editWorkspace').style.display = 'none';
      document.getElementById('viewWorkspace').style.display = 'flex';
      document.getElementById('viewFooter').style.display    = 'block';

      // 헤더
      document.getElementById('viewNovelTitle').textContent = novel.title || '소설';
      const date = new Date(novel.created_at).toLocaleString('ko-KR', {
        year:'2-digit', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false
      });
      document.getElementById('viewNovelSub').textContent = `${novel.author} · ${date} · 조회 ${novel.view_count ?? 0}`;

      // 상단 버튼 (편집/삭제)
      if (isAuthor) {
        document.getElementById('viewTopActions').innerHTML = `
          <a href="write.html?id=${novelId}&mode=edit" class="btn sm primary" style="text-decoration:none">✏️ 편집</a>
          <button class="btn sm" style="border-color:#fca5a5;color:#dc2626" onclick="confirmDelete()">🗑 삭제</button>`;
      }

      // 반응 버튼
      renderNovelReactBar(novel);

      // 노출 노드 트리 로드
      try {
        const hdrs = isLoggedIn ? { Authorization: `Bearer ${getToken()}` } : {};
        const res = await fetch(API + `/novel/novels/${novelId}/nodes`, { headers: hdrs });
        if (res.ok) {
          const d = await res.json();
          viewNodes = d.nodes || [];
          renderViewTree();
        }
      } catch {}

      loadComments();
    }

    function renderViewTree() {
      document.getElementById('viewMenuTree').innerHTML =
        buildViewTreeHtml(null, 0) ||
        '<div style="text-align:center;padding:1.5rem;font-size:.75rem;color:var(--text-muted)">노출된 메뉴가 없습니다</div>';
    }

    function buildViewTreeHtml(parentId, depth) {
      const children = viewNodes
        .filter(n => (n.parent_id ?? null) === parentId)
        .sort((a, b) => a.position - b.position);
      if (!children.length) return '';

      return children.map(n => {
        const hasKids = viewNodes.some(c => (c.parent_id ?? null) === n.id);
        const isExp   = viewExpanded.has(n.id);
        const isSel   = viewSelId === n.id;
        const pl      = 0.4 + depth * 0.9;
        return `
          <div class="tree-node">
            <div class="tree-row${isSel ? ' selected' : ''}" style="padding-left:${pl}rem"
                 onclick="selectViewNode(${n.id})">
              <span class="tree-expand" onclick="event.stopPropagation();toggleViewExpand(${n.id})">
                ${hasKids ? (isExp ? '▼' : '▶') : '·'}
              </span>
              <span class="tree-title">${escHtml(n.title || '(제목 없음)')}</span>
            </div>
            <div style="display:${isExp ? 'block' : 'none'}">
              <div class="tree-children">${buildViewTreeHtml(n.id, depth + 1)}</div>
            </div>
          </div>`;
      }).join('');
    }

    function toggleViewExpand(id) {
      if (viewExpanded.has(id)) viewExpanded.delete(id); else viewExpanded.add(id);
      renderViewTree();
    }

    function selectViewNode(id) {
      viewSelId = id;
      renderViewTree();
      const node = viewNodes.find(n => n.id === id);
      if (!node) return;
      document.getElementById('viewEmpty').style.display = 'none';
      const panel = document.getElementById('viewNodePanel');
      panel.style.display = 'block';
      panel.innerHTML = `
        <div class="view-node-panel">
          <div class="view-node-title">${escHtml(node.title || '(제목 없음)')}</div>
          ${node.content?.trim()
            ? `<div class="view-node-body">${escHtml(node.content)}</div>`
            : `<div class="view-node-empty">내용이 없습니다.</div>`}
        </div>`;
    }

    /* ── 반응 ── */
    function renderNovelReactBar(novel) {
      const bar = document.getElementById('novelReactSection');
      if (!bar) return;
      const lc = novel.my_reaction === 'like'    ? ' active-like'    : '';
      const dc = novel.my_reaction === 'dislike' ? ' active-dislike' : '';
      bar.innerHTML = `
        <button class="react-btn${lc}" id="novLikeBtn"    onclick="reactNovel('like')">👍 <span id="novLikes">${novel.likes||0}</span></button>
        <button class="react-btn${dc}" id="novDislikeBtn" onclick="reactNovel('dislike')">👎 <span id="novDislikes">${novel.dislikes||0}</span></button>`;
    }

    async function reactNovel(reaction) {
      if (!isLoggedIn) { openLoginModal(); return; }
      try {
        const res = await api(`/novel/novels/${novelId}/react`, { method:'POST', body:JSON.stringify({ reaction }) });
        const d = await res.json();
        if (!res.ok) throw new Error(d.error);
        document.getElementById('novLikes').textContent    = d.likes;
        document.getElementById('novDislikes').textContent = d.dislikes;
        document.getElementById('novLikeBtn').className    = `react-btn${d.my_reaction==='like'?' active-like':''}`;
        document.getElementById('novDislikeBtn').className = `react-btn${d.my_reaction==='dislike'?' active-dislike':''}`;
      } catch (e) { showToast(e.message||'처리 실패','error'); }
    }

    async function confirmDelete() {
      if (!confirm('이 소설을 삭제하시겠습니까?')) return;
      try {
        const res = await api(`/novel/novels/${novelId}`, { method:'DELETE' });
        const d = await res.json();
        if (!res.ok) throw new Error(d.error);
        location.href = 'novels.html';
      } catch (e) { showToast(e.message||'삭제 실패','error'); }
    }

    /* ═══════════════════════════════════════════
       댓글
    ═══════════════════════════════════════════ */
    async function loadComments() {
      const sec = document.getElementById('commentsSection');
      if (!sec || !novelId) return;
      sec.style.display = '';
      try {
        const hdrs = isLoggedIn ? { Authorization:`Bearer ${getToken()}` } : {};
        const res = await fetch(API + `/novel/novels/${novelId}/comments`, { headers:hdrs });
        if (!res.ok) throw new Error();
        const { comments } = await res.json();
        renderCommentList(comments);
        renderCommentForm();
      } catch {
        document.getElementById('commentList').innerHTML = '<div class="empty-comments">댓글을 불러오지 못했습니다.</div>';
      }
    }

    function renderCommentList(cs) {
      document.getElementById('commentCountBadge').textContent = cs.length;
      document.getElementById('commentList').innerHTML = cs.length
        ? cs.map(renderCommentItem).join('')
        : '<div class="empty-comments">첫 댓글을 작성해보세요.</div>';
    }

    function renderCommentItem(c) {
      const date = new Date(c.created_at).toLocaleDateString('ko-KR',{year:'2-digit',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
      const mine = isLoggedIn && me && c.user_id===me.id;
      const lc = c.my_reaction==='like'?' active-like':'';
      const dc = c.my_reaction==='dislike'?' active-dislike':'';
      return `
        <div class="comment-item" id="comment-${c.id}">
          <div class="comment-meta">
            <span class="comment-author">${escHtml(c.author)}</span>
            <span class="comment-date">${date}</span>
            ${mine?`<button class="comment-del-btn" onclick="removeComment(${c.id})">삭제</button>`:''}
          </div>
          <div class="comment-body">${escHtml(c.content)}</div>
          <div class="comment-actions">
            <button class="react-btn${lc}" onclick="reactComment(${c.id},'like')">👍 <span id="clike-${c.id}">${c.likes}</span></button>
            <button class="react-btn${dc}" onclick="reactComment(${c.id},'dislike')">👎 <span id="cdislike-${c.id}">${c.dislikes}</span></button>
          </div>
        </div>`;
    }

    function renderCommentForm() {
      const wrap = document.getElementById('commentFormWrap');
      if (!wrap) return;
      if (!isLoggedIn) {
        wrap.innerHTML = `<div class="comment-login-notice" onclick="openLoginModal()">🔒 로그인하면 댓글을 작성할 수 있습니다</div>`;
        return;
      }
      wrap.innerHTML = `
        <div class="comment-form">
          <textarea id="commentInput" class="comment-textarea" placeholder="댓글을 입력하세요..." rows="3"></textarea>
          <div class="comment-submit-row">
            <button class="btn-comment-submit" id="btnCommentSubmit" onclick="submitComment()">댓글 등록</button>
          </div>
        </div>`;
    }

    async function submitComment() {
      const input = document.getElementById('commentInput');
      const content = input?.value.trim();
      if (!content) { showToast('댓글 내용을 입력하세요.','error'); return; }
      const btn = document.getElementById('btnCommentSubmit');
      btn.disabled=true; btn.textContent='등록 중...';
      try {
        const res = await api(`/novel/novels/${novelId}/comments`,{method:'POST',body:JSON.stringify({content})});
        const d = await res.json();
        if (!res.ok) throw new Error(d.error);
        input.value='';
        const list = document.getElementById('commentList');
        list.querySelector('.empty-comments')?.remove();
        list.insertAdjacentHTML('beforeend',renderCommentItem(d.comment));
        const badge=document.getElementById('commentCountBadge');
        badge.textContent=parseInt(badge.textContent||'0')+1;
        showToast('댓글이 등록됐습니다.','success');
      } catch (e) { showToast(e.message||'등록 실패','error'); }
      finally { btn.disabled=false; btn.textContent='댓글 등록'; }
    }

    async function reactComment(id, reaction) {
      if (!isLoggedIn) { openLoginModal(); return; }
      try {
        const res = await api(`/novel/comments/${id}/react`,{method:'POST',body:JSON.stringify({reaction})});
        const d = await res.json();
        if (!res.ok) throw new Error(d.error);
        document.getElementById(`clike-${id}`).textContent    = d.likes;
        document.getElementById(`cdislike-${id}`).textContent = d.dislikes;
        const item = document.getElementById(`comment-${id}`);
        const [lb,db] = item.querySelectorAll('.react-btn');
        lb.className = `react-btn${d.my_reaction==='like'?' active-like':''}`;
        db.className = `react-btn${d.my_reaction==='dislike'?' active-dislike':''}`;
      } catch (e) { showToast(e.message||'처리 실패','error'); }
    }

    async function removeComment(id) {
      if (!confirm('댓글을 삭제하시겠습니까?')) return;
      try {
        const res = await api(`/novel/comments/${id}`,{method:'DELETE'});
        const d = await res.json();
        if (!res.ok) throw new Error(d.error);
        document.getElementById(`comment-${id}`)?.remove();
        const badge=document.getElementById('commentCountBadge');
        badge.textContent=Math.max(0,parseInt(badge.textContent||'1')-1);
        if (!document.querySelector('.comment-item'))
          document.getElementById('commentList').innerHTML='<div class="empty-comments">첫 댓글을 작성해보세요.</div>';
        showToast('댓글이 삭제됐습니다.','success');
      } catch (e) { showToast(e.message||'삭제 실패','error'); }
    }

    /* ── 유틸 ── */
    function escHtml(s) {
      return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    let toastTimer;
    function showToast(msg, type='info') {
      const el=document.getElementById('toast');
      el.textContent=msg; el.className=`toast ${type} show`;
      clearTimeout(toastTimer);
      toastTimer=setTimeout(()=>el.className=`toast ${type}`,2800);
    }
  </script>
</body>
</html>
