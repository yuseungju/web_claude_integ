name: Deploy Lambda

on:
  push:
    branches:
      - main
    paths:
      - 'lambda/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: cd lambda && npm install --omit=dev

      - name: Zip Lambda
        run: cd lambda && zip -r /tmp/lambda.zip .

      # article-generate 는 AWS 에 실제로 존재하는 함수 이름이다.
      # 저장소 이름과 무관하며, 바꾸려면 Lambda 를 새로 만들고
      # API Gateway 통합도 다시 걸어야 하므로 그대로 둔다.
      - name: Deploy to Lambda
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-southeast-2
        run: |
          aws lambda update-function-code \
            --function-name article-generate \
            --zip-file fileb:///tmp/lambda.zip
